# Pre-commit hooks (branching-and-delivery standard §4). Install once per clone: `python3 .github/workspace/setup.py`.
pre-commit:
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is not installed: install it (macOS: brew install gitleaks) and commit again." >&2
          exit 1
        fi
        gitleaks git --pre-commit --staged --redact --no-banner
