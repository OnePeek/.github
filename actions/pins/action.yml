# Shared check body: the pin check (onepeek-docs architecture/lld/infra/foundation-playbook.md §8a P2 and S4). One
# implementation for pins.yml (the `pins` job), fast-checks.yml (a step of the `fast` job) and this repo's own
# workflow-lint.yml (decision 180; delivery-pipelines.md §9.1 "Tiny jobs merged", orchestrator ruling R-S2i-1).
# The caller has checked out the calling repo at the workspace root. The scripts are this action's own repository at
# the same commit (`$GITHUB_ACTION_PATH/../..`), so the check runs exactly at the version the caller pinned.
# Fails when the repo's OnePeek/.github pins are not all the commit of one v* tag. The docs-version.txt ancestor rule is
# gone (PIPE-SIMPLE v2 DOC-1); the app-client-id and app-private-key inputs stay, unused, so no caller has to change.
name: pins
description: The OnePeek/.github pins are one v* tag's commit; every reusable-workflow call passes its required inputs.

inputs:
  app-client-id:
    description: Unused since the docs rule went (DOC-1); kept so callers that pass it need no change.
    required: false
    default: ""
  app-private-key:
    description: Unused since the docs rule went (DOC-1); kept so callers that pass it need no change.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # delivery-pipelines.md §6.4a (F35): every call passes the called workflow's required inputs and secrets. The
    # script needs PyYAML, which our runner image lacks, so it runs in a venv with the pin workflow-lint.yml uses.
    - name: Every reusable-workflow call passes its required inputs and secrets
      shell: bash
      run: |
        shared="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        python3 -m venv "${RUNNER_TEMP}/cci"
        "${RUNNER_TEMP}/cci/bin/pip" install --quiet pyyaml==6.0.3
        "${RUNNER_TEMP}/cci/bin/python" "${shared}/scripts/check_caller_inputs.py" . --shared "${shared}"

    # A public repo's own CI never gets one of our runners (ci-runners.md section 11.6): a call of a shared workflow that
    # leaves `runner` unset would queue 24 hours and be cancelled (plugin-owl#62, FU-PUBLIC-RUNNER). So in a public repo
    # every call must pass `runner: public-hosted` (rule 1 of scripts/check_runner_labels.py, the same lint .github runs
    # on itself). Runs only when the event says the repository is public (visibility == 'public', never true for a payload without `repository`, e.g. a schedule event: `null == false` is true in expressions): a private repo's jobs are not this rule's.
    - name: A public repo's calls pass runner public-hosted
      if: ${{ github.event.repository.visibility == 'public' }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: |
        shared="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        "${RUNNER_TEMP}/cci/bin/python" "${shared}/scripts/check_runner_labels.py" --kind public --repo "${REPO}" .github/workflows

    - name: Pins are one tagged version
      shell: bash
      run: python3 "$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)/scripts/check_pins.py" .
