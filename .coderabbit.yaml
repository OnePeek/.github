# CodeRabbit review settings. Shared base for every OnePeek repo, plus this repo's rules.
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-GB"
tone_instructions: "Plain English, short and direct. When a rule is broken, name the AGENTS.md rule or the onepeek-docs standard it breaks."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "dev"
      - "release"
      - "main"
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/uv.lock"
    - "!**/.terraform.lock.hcl"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
  path_instructions:
    - path: ".github/workflows/**"
      instructions: "Shared reusable workflows called by every OnePeek repo. Pin every action to a full commit SHA, give each job the least permissions it needs, never echo secrets, use OIDC instead of long-lived keys, and keep minutes low (Linux runners, caching, concurrency cancel)."
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
chat:
  auto_reply: true
  allow_non_org_members: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "docs/**/*.md"
  learnings:
    scope: "global"
  pull_requests:
    scope: "global"
  linked_repositories:
    - repository: "OnePeek/onepeek-docs"
      instructions: "The source of truth: founder decisions, the PRD, the TRD, contracts and standards (engineering-standards, configuration-and-secrets, branching-and-delivery). Check changes against them."
