# CodeRabbit review settings: the same base in every OnePeek repo, plus this repo's own rules.
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-GB"
tone_instructions: "Plain English, short and direct. When a rule is broken, name the AGENTS.md rule or the onepeek-docs standard it breaks."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^dev$"
      - "^release$"
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
  path_instructions:
    - path: ".github/workflows/**"
      instructions: "Shared reusable workflows called by every OnePeek repo. Pin every action to a full commit SHA, give each job the least permissions it needs, never echo secrets, use OIDC instead of long-lived keys, and keep minutes low (Linux runners, caching, concurrency cancel)."
chat:
  auto_reply: true
  allow_non_org_members: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "onepeek-docs:standards/*.md"
      - "onepeek-docs:architecture/hld/*.md"
  learnings:
    scope: "auto"
  pull_requests:
    scope: "auto"
  linked_repositories:
    - repository: "OnePeek/onepeek-docs"
      instructions: "The source of truth: founder decisions, the technical HLD (architecture/hld/), the LLDs (architecture/lld/), the PRD, the TRD, contracts and standards. Code must implement its LLD exactly: flag anything the LLD does not say, and any break of an HLD rule."
