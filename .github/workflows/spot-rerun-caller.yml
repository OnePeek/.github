# This repo's own caller of spot-rerun.yml, and the example for every other repo (the snippet is in spot-rerun.yml's
# header): when one of the listed workflows ends in failure and a spot reclaim caused it, its failed jobs run once more.
# This repo is public, so it runs on GitHub-hosted runners (`runner: github`); private repos pass
# `${{ vars.RUNNER || 'github' }}` and list their own workflow names.
name: spot-rerun-caller

on:
  workflow_run:
    workflows: [workflow-lint]
    types: [completed]

permissions:
  contents: read

jobs:
  spot-rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    uses: ./.github/workflows/spot-rerun.yml
    permissions:
      actions: write  # read the run's jobs and logs, and re-run the failed jobs
      contents: read
    with:
      runner: github
