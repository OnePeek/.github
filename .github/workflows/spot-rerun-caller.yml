# This repo's own caller of spot-rerun.yml, and the example for every other repo (the snippets are in spot-rerun.yml's
# header): every 10 minutes (and on demand), each failed first-attempt run of the listed workflows that finished in the last 20 minutes
# whose failure a spot reclaim caused gets its failed jobs run once more (scan mode, PIPE-SIMPLE v2 GH-1). This repo is
# public, so it runs on GitHub-hosted runners (`runner: github`); private repos pass `${{ vars.RUNNER || 'github' }}`
# and list their own workflow names.
name: spot-rerun-caller

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: spot-rerun-caller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spot-rerun:
    uses: ./.github/workflows/spot-rerun.yml
    permissions:
      actions: write  # read the runs, their jobs and logs, and re-run the failed jobs
      checks: read    # the job's annotations (where a lost runner is reported)
      contents: read
    with:
      runner: github
      workflows: workflow-lint
