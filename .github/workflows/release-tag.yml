# Shared: tag every merge into release with the next version and publish release notes.
# Pre-launch versions stay at 0.x: a breaking change or a feat raises the minor version, anything else the patch.
name: release-tag

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek (the default), canary or public-hosted. Callers pass their repository's RUNNER setting, or github; github, onepeek, unset and any other value mean our runner class (F694, 2026-11-15: never GitHub-hosted). public-hosted is for the public repos' own CI only (scripts/check_runner_labels.py). The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: onepeek
      first-version:
        description: "Version of the first tag in a repo that has none (pre-launch repos stay at 0.x)."
        type: string
        default: v0.1.0

permissions:
  contents: write

jobs:
  tag:
    runs-on: ${{ inputs.runner == 'public-hosted' && 'ubuntu-latest' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'onepeek-arm64' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: version
        env:
          FIRST_VERSION: ${{ inputs.first-version }}
        run: |
          # --- next-version begin (the same lines in release-ecs.yml prepare; scripts/test_release_ecs.py NextVersion)
          last=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)  # plain vX.Y.Z only; the moving tag v1 and pre-release tags are ignored
          if [ -z "${last}" ]; then
            next="${FIRST_VERSION}"
          else
            subjects=$(git log --format='%s%n%b' "${last}..HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"
            if printf '%s\n' "${subjects}" | grep -Eq '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE|^feat(\([^)]*\))?:'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="v${major}.${minor}.${patch}"
          fi
          # --- next-version end
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "${NEXT}" --target "${GITHUB_SHA}" --title "${NEXT}" --generate-notes
