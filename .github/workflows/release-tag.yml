# Shared: tag every merge into release with the next version and publish release notes.
# Pre-launch versions stay at 0.x: a breaking change or a feat raises the minor version, anything else the patch.
name: release-tag

on:
  workflow_call:
    inputs:
      first-version:
        description: "Version of the first tag in a repo that has none (pre-launch repos stay at 0.x)."
        type: string
        default: v0.1.0

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: version
        env:
          FIRST_VERSION: ${{ inputs.first-version }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)  # full semver only; the old moving tag v1 is ignored
          if [ -z "${last}" ]; then
            echo "next=${FIRST_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subjects=$(git log --format='%s%n%b' "${last}..HEAD")
          IFS=. read -r major minor patch <<< "${last#v}"
          if printf '%s\n' "${subjects}" | grep -Eq '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE|^feat(\([^)]*\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "next=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "${NEXT}" --target "${GITHUB_SHA}" --title "${NEXT}" --generate-notes
