          lock_cancel_keys() {  # the keys this caller may touch, its scope's key first: an app its own scope's key, infra every key; release.json during the move
            case "${LOCK_SCOPE}" in
              infra) echo "locks/infra.json locks/backend.json locks/web.json locks/mcp.json ${LOCK_LEGACY_KEY}" ;;
              *) echo "locks/${LOCK_SCOPE}.json ${LOCK_LEGACY_KEY}" ;;
            esac
