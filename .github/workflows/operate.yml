                0) echo "Removed s3://${LOCK_BUCKET}/${key%%=*}." ;;
                2) echo "::error::s3://${LOCK_BUCKET}/${key%%=*} changed meanwhile; it is left in place."; return 1 ;;
                *) return 1 ;;
              esac
            done
          }
          lock_cancel_claim() {  # the exclusive repair claim on every held key -> 0 claimed (LOCK_CLAIMED key=etag list), 1 lost or failed
