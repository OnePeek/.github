# Redeploy or roll back one named service (onepeek-docs architecture/lld/infra/delivery-pipelines.md UC-DEL-002, §5).
# `workflow_dispatch` runs from the release branch only (the deploy roles trust no other branch; until launch `release`
# is preprod, playbook §5.4). A repo's own button can also call it as a shared workflow. It holds the cross-repo release
# lock while it changes anything (playbook §5.4): the lock job takes it, the unlock job releases it whatever happened,
# and no `concurrency` group queues runs. The service choice list below is generated from the services file by
# scripts/check_service_list.py, which fails CI if the list drifts (run it with --write to regenerate).
name: operate

on:
  workflow_dispatch:
    inputs:
      action:
        description: redeploy = force a new deployment of the same revision; rollback = an earlier version
        type: choice
        options: [redeploy, rollback]
        required: true
      service:
        description: A long-running service, or all of them
        type: choice
        # service-list begin
        options: [all, api, api-critical, worker, scheduler, web]
        # service-list end
        required: true
      environment:
        description: Environment (prod needs the prod environment approval)
        type: choice
        options: [preprod, prod]
        default: preprod
      version:
        description: "Rollback target: sha-<12> (preprod) or v<version> (prod); empty = the previous recorded deployment"
        type: string
        default: ""
      reason:
        description: Written into the deployment record
        type: string
        required: true
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      action:
        type: string
        required: true
      service:
        type: string
        required: true
      environment:
        type: string
        required: true
      version:
        type: string
        default: ""
      reason:
        type: string
        required: true
      role-to-assume:
        description: The repo's deploy role; empty = the repository variable AWS_ROLE_<ENV>.
        type: string
        default: ""
    secrets:
      AGENTS_APP_CLIENT_ID:
        description: The agents' GitHub App (playbook §5.3, §5.4). Required. Its token, with Actions read, lets a waiting run see that another repo's lock holder has finished; without it such a lock could never be taken over.
        required: true
      AGENTS_APP_PRIVATE_KEY:
        description: The agents' GitHub App private key (with AGENTS_APP_CLIENT_ID). Required.
        required: true

permissions: {}

env:
  COSIGN_EXPERIMENTAL: "1" # required by the OCI 1.1 referrers mode (delivery-pipelines §5)
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  ENVIRONMENT: ${{ inputs.environment }}
  NAME: onepeek-${{ inputs.environment }}
  LOCK_WAIT_SECONDS: "1800" # waits up to 30 minutes for the release lock (playbook §5.4)
  LOCK_POLL_SECONDS: "30" # polling every 30 s

jobs:
  lock:
    # The cross-repo release lock (foundation-playbook §5.4), before anything changes.
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 35
    environment: ${{ inputs.environment == 'prod' && 'prod' || null }}
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      attempt: ${{ steps.take.outputs.attempt }}
      token: ${{ steps.take.outputs.token }}
    steps:
      - name: The deploy role
        id: role
        env:
          GIVEN: ${{ inputs.role-to-assume }}
          PREPROD: ${{ vars.AWS_ROLE_PREPROD }}
          PROD: ${{ vars.AWS_ROLE_PROD }}
        run: |
          role="${GIVEN}"
          if [ -z "${role}" ]; then if [ "${ENVIRONMENT}" = "prod" ]; then role="${PROD}"; else role="${PREPROD}"; fi; fi
          if [ -z "${role}" ]; then echo "::error::No deploy role: set the repository variable AWS_ROLE_<ENV>."; exit 1; fi
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - name: The agents' GitHub App secrets are set (required, playbook §5.4)
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY must be passed: without the App token a lock left by another repo's finished run could never be taken over (playbook §5.4)."
            exit 1
          fi
      - name: The agents' GitHub App token (Actions read), to see whether another repo's lock holder has finished
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend-service,onepeek-web,onepeek-infra,mcp-athena # the repos that take the lock (playbook §5.4)
          permission-actions: read
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Take the release lock
        id: take
        env:
          LOCK_GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # The cross-repo release lock (foundation-playbook §5.4): one per environment, s3://onepeek-<env>-deploy/locks/release.json,
          # taken with a conditional write (If-None-Match: *) and removed with a conditional delete on its ETag (If-Match). The
          # record names the repo, run ID, run attempt, commit, start time and a random token; only the holder of the token
          # releases it. Anything unreadable fails closed: no lock, no deploy. A lock is never removed while its run is still
          # running: only its token's holder, or a waiter that GitHub shows the holder's run has finished, removes it.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written by a hotfix run, §5.6), every take
          # except that hotfix run's own fails with the reason.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token>"; 1 when the file is not such a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt, token = record["repo"], str(record["run_id"]), str(record["run_attempt"]), str(record.get("token", "-"))
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token)' "$1"
          }
          lock_delete() {  # lock_delete <key> <etag> -> 0 removed, 2 changed or gone meanwhile (read it again), 1 any other answer
            local msg
            if aws s3api delete-object --bucket "${LOCK_BUCKET}" --key "$1" --if-match "$2" >/dev/null 2>"${LOCK_ERR}"; then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*|*"(NoSuchKey)"*) return 2 ;; esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be removed: ${msg}"
            return 1
          }
          lock_run_finished() {  # lock_run_finished <repo> <run id> -> 0 only when GitHub reports the run completed
            local status
            if ! status=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/$1/actions/runs/$2" --jq .status 2>"${LOCK_ERR}"); then
              echo "::warning::Cannot read the state of $(lock_url "$1" "$2"), so it counts as running: $(cat "${LOCK_ERR}")"
              return 1
            fi
            [ "${status}" = "completed" ]
          }
          lock_record() {  # lock_record <file> [token]: this run's record
            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", "")}
          if len(sys.argv) > 2:
              record["token"] = sys.argv[2]
              del record["who"], record["why"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
          }
          lock_frozen_for_others() {  # 0 when preprod-frozen names another run (the reason is printed), 1 when not frozen for us, 2 unreadable
            local etag holder repo run attempt token
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${etag}" = "absent" ]; then return 1; fi
            if ! holder=$(lock_holder lock-frozen.json); then return 2; fi
            read -r repo run attempt token <<< "${holder}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ]; then return 1; fi
            python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));print("preprod is frozen by %s (%s) for the hotfix run %s" % (r.get("who","?"), r.get("why","?"), r.get("run","?")))' lock-frozen.json
            return 0
          }
          lock_take() {  # waits up to LOCK_WAIT_SECONDS, polling every LOCK_POLL_SECONDS, then fails naming the holder's run
            local msg etag holder repo run attempt token rc deadline reason
            if [ -z "${LOCK_TOKEN:-}" ]; then echo "::error::No lock token."; return 1; fi
            lock_record lock-mine.json "${LOCK_TOKEN}"
            deadline=$((SECONDS + LOCK_WAIT_SECONDS))
            while :; do
              rc=0
              reason=$(lock_frozen_for_others) || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "::error::The ${ENVIRONMENT} release lock is refused: ${reason}."; return 1; fi
              if [ "${rc}" -eq 2 ]; then echo "::error::s3://${LOCK_BUCKET}/${FROZEN_KEY} is unreadable, so nothing is deployed."; return 1; fi
              # No encryption flags: the bucket default applies (aws-stack §16).
              if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${LOCK_KEY}" --body lock-mine.json --if-none-match '*' \
                --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
                echo "Took the ${ENVIRONMENT} release lock (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 0
              fi
              msg=$(cat "${LOCK_ERR}")
              case "${msg}" in
                *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;;   # held, or another write at the same moment: see who holds it
                *) echo "::error::The release lock could not be written, so nothing is deployed: ${msg}"; return 1 ;;
              esac
              if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
                echo "::error::The release lock is unreadable, so nothing is deployed."
                return 1
              fi
              if [ "${etag}" = "absent" ]; then   # released between the write and the read: write again
                if [ "${SECONDS}" -ge "${deadline}" ]; then echo "::error::The release lock could not be taken in ${LOCK_WAIT_SECONDS} s."; return 1; fi
                sleep 1
                continue
              fi
              if ! holder=$(lock_holder lock-held.json); then
                echo "::error::The release lock holds no readable record, so nothing is deployed (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 1
              fi
              read -r repo run attempt token <<< "${holder}"
              if { [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" -lt "${GITHUB_RUN_ATTEMPT}" ]; } \
                || lock_run_finished "${repo}" "${run}"; then
                # An earlier attempt of this run (one attempt runs at a time), or a finished run that never released it.
                echo "The release lock is held by $(lock_url "${repo}" "${run}") (attempt ${attempt}), which is not running; taking it over."
                rc=0
                lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
                if [ "${rc}" -eq 1 ]; then return 1; fi
                continue
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::The ${ENVIRONMENT} release lock is still held after ${LOCK_WAIT_SECONDS} s by $(lock_url "${repo}" "${run}")."
                return 1
              fi
              echo "Waiting for the ${ENVIRONMENT} release lock, held by $(lock_url "${repo}" "${run}")."
              sleep "${LOCK_POLL_SECONDS}"
            done
          }
          lock_release() {  # removes the lock only when its token is LOCK_TOKEN (handed over by the lock job's outputs)
            local etag holder repo run attempt token rc
            if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
              echo "::error::The release lock is unreadable; it stays until a later release sees this run has finished."
              return 1
            fi
            if [ "${etag}" = "absent" ]; then echo "No release lock is held."; return 0; fi
            if ! holder=$(lock_holder lock-held.json); then
              echo "::error::The release lock holds no readable record; it is left in place."
              return 1
            fi
            read -r repo run attempt token <<< "${holder}"
            if [ -z "${LOCK_TOKEN:-}" ] || [ "${token}" != "${LOCK_TOKEN}" ]; then
              echo "The release lock is held by $(lock_url "${repo}" "${run}") under another token, not this call; it is left in place."
              return 0
            fi
            rc=0
            lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Released the ${ENVIRONMENT} release lock." ;;
              2) echo "::warning::The release lock changed while it was being released; it is left in place." ;;
              *) return 1 ;;
            esac
          }
          lock_freeze() {  # preprod-frozen (§5.4, §5.6): only a hotfix/* run writes it, naming itself
            local msg etag holder repo run attempt token
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${FROZEN_KEY}" --body lock-frozen-mine.json --if-none-match '*' \
              --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
              echo "Froze ${ENVIRONMENT} for this hotfix run (s3://${LOCK_BUCKET}/${FROZEN_KEY})."
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;; *) echo "::error::preprod-frozen could not be written: ${msg}"; return 1 ;; esac
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json) || [ "${etag}" = "absent" ] || ! holder=$(lock_holder lock-frozen.json); then
              echo "::error::preprod-frozen could not be read back."
              return 1
            fi
            read -r repo run attempt token <<< "${holder}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ]; then echo "${ENVIRONMENT} is already frozen for this run."; return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for $(lock_url "${repo}" "${run}")."
            return 1
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          # A random token names this take; unlock gets it through the job outputs and releases only on a match.
          LOCK_TOKEN=$(python3 -c "import secrets;print(secrets.token_hex(16))")
          echo "token=${LOCK_TOKEN}" >> "$GITHUB_OUTPUT"
          lock_take
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  operate:
    needs: lock
    # The real prod control is the prod role's trust (runner_environment: github-hosted, ci-runners.md section 11.3);
    # the prod prefix in runs-on is defence in depth.
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'prod' && 'prod' || null }}
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          TARGET_ENV: ${{ inputs.environment }}
          REASON: ${{ inputs.reason }}
        run: |
          case "${ACTION}" in redeploy|rollback) ;; *) echo "::error::action must be redeploy or rollback."; exit 1;; esac
          case "${TARGET_ENV}" in preprod|prod) ;; *) echo "::error::environment must be preprod or prod."; exit 1;; esac
          if ! printf '%s' "${SERVICE}" | grep -Eq '^[a-z][a-z0-9-]*$'; then echo "::error::bad service name."; exit 1; fi
          if [ -z "${REASON}" ]; then echo "::error::reason is required."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: The deploy role
        id: role
        env:
          GIVEN: ${{ inputs.role-to-assume }}
          PREPROD: ${{ vars.AWS_ROLE_PREPROD }}
          PROD: ${{ vars.AWS_ROLE_PROD }}
        run: |
          role="${GIVEN}"
          if [ -z "${role}" ]; then if [ "${ENVIRONMENT}" = "prod" ]; then role="${PROD}"; else role="${PREPROD}"; fi; fi
          if [ -z "${role}" ]; then echo "::error::No deploy role: set the repository variable AWS_ROLE_<ENV>."; exit 1; fi
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Redeploy or roll back
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          TARGET: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          DOMAIN_PREPROD: preprod.onepeek.info
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          aws s3 cp "s3://${NAME}-deploy/services.${ENVIRONMENT}.yaml" services.yaml --only-show-errors
          # name<TAB>image for every long-running service
          python3 - <<'PY' > targets.tsv
          import os, yaml
          doc = yaml.safe_load(open("services.yaml"))
          defaults = doc.get("defaults", {})
          one_off = {"migration", "operator", "function"}
          for name, svc in doc["services"].items():
              if set(svc.get("triggers", [])) <= one_off:
                  continue
              print(name, svc.get("image", defaults.get("image")), sep="\t")
          PY
          if [ "${SERVICE}" = "all" ]; then
            cut -f1 targets.tsv > selected.txt
          elif cut -f1 targets.tsv | grep -qx "${SERVICE}"; then
            echo "${SERVICE}" > selected.txt
          else
            echo "::error::${SERVICE} is not a long-running service in the services file."; exit 1
          fi
          if [ "${ENVIRONMENT}" = "prod" ]; then
            aws ssm get-parameter --name /onepeek/prod/release/signing_public_key --query Parameter.Value --output text > signing.pub
            key=signing.pub
          else
            key="awskms:///alias/${NAME}-image-signing"
          fi
          # The previous recorded deployment of this environment for an image (playbook §5.2 "Rollback target"): walking the
          # release-ecs records newest first, skip every record up to and including the running commit's, then take the
          # next successful one (never a newer, rolled-back release). Prints "<commit> <digest>", or nothing.
          # GitHub marks an older successful deployment `inactive` when a newer one succeeds, so both states count.
          previous_deployment() {  # previous_deployment <image> <current commit>
            gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=${ENVIRONMENT}&per_page=100" \
              --jq '.[] | select((.payload | type) == "object" and (.payload.digests | type) == "object") | [.id, .payload.commit, (.payload.digests["'"$1"'"] // "")] | @tsv' \
              | { past=""
                while IFS=$'\t' read -r id commit digest; do
                  if [ -z "${past}" ]; then
                    if [ "${commit}" = "$2" ]; then past=yes; fi
                    continue
                  fi
                  if [ -z "${digest}" ] || [ "${commit}" = "$2" ]; then continue; fi
                  state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""')
                  if [ "${state}" = "success" ] || [ "${state}" = "inactive" ]; then echo "${commit} ${digest}"; break; fi
                done; }
          }
          VERSION_NOW=""
          while read -r svc; do
            image=$(awk -F'\t' -v s="${svc}" '$1==s{print $2}' targets.tsv)
            if [ "${ACTION}" = "redeploy" ]; then
              aws ecs update-service --cluster "${NAME}" --service "${svc}" --force-new-deployment >/dev/null
              echo "Redeploying ${svc} (same revision)."
              continue
            fi
            target="${TARGET}"
            VERSION=""
            if [ "${ENVIRONMENT}" = "prod" ]; then
              # Prod is keyed on the version added at promotion (playbook §5.2); its task definitions also carry the commit.
              current=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${image}/version" --query Parameter.Value --output text)
              if [ -z "${target}" ]; then
                target=$(git tag --list 'v*' --sort=-v:refname | grep -x -A1 "v${current}" | tail -n1 | sed 's/^v//')
                if [ -z "${target}" ] || [ "${target}" = "${current}" ]; then echo "::error::No release tag before v${current}."; exit 1; fi
              fi
              target="${target#v}"
              digest=$(aws ecr describe-images --repository-name "${NAME}/${image}" --image-ids "imageTag=v${target}" --query 'imageDetails[0].imageDigest' --output text)
              COMMIT="sha-$(git rev-list -n 1 "v${target}" | cut -c1-12)"
              VERSION="${target}"   # the version tag is <semver> (delivery-pipelines §5 step 3)
            else
              # Preprod is keyed on the commit (playbook §5.2): a sha-<12> target, or the previous recorded deployment.
              # "Current" is what the service runs (its task definition's commit tag), not the last record: a failed or
              # rolled-back release has already moved /release/<image>/commit.
              running=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text)
              current=$(aws ecs describe-task-definition --task-definition "${running}" --include TAGS --query "tags[?key=='commit'].value | [0]" --output text)
              if [ -z "${target}" ]; then
                read -r target digest < <(previous_deployment "${image}" "${current}") || true
                if [ -z "${target:-}" ]; then echo "::error::No recorded ${ENVIRONMENT} deployment of ${image} before ${current}."; exit 1; fi
              else
                if ! printf '%s' "${target}" | grep -Eq '^sha-[0-9a-f]{12}$'; then echo "::error::A preprod rollback target is sha-<12>."; exit 1; fi
                digest=$(aws ecr describe-images --repository-name "${NAME}/${image}" --image-ids "imageTag=${target}" --query 'imageDetails[0].imageDigest' --output text)
              fi
              COMMIT="${target}"
            fi
            IMAGE_REF="${registry}/${NAME}/${image}@${digest}"
            cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${key}" "${IMAGE_REF}" >/dev/null
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
            aws ecs describe-task-definition --task-definition "${td}" --query taskDefinition --output json > "$2" || return 1
            echo "$2"
          }
          render() {  # render <service> <one-off | first-deploy | current task definition file> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              new = {c.get("name"): names(c, "environment") | names(c, "secrets") for c in containers}
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new.get(c.get("name"), set()) - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
            mode=$(current_td "${svc}" "current-${svc}.json")
            render "${svc}" "${mode}" > "td-${svc}.json"
            arn=$(aws ecs register-task-definition --cli-input-json "file://td-${svc}.json" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${arn}" >/dev/null
            echo "Rolling ${svc} back to ${VERSION:+v}${VERSION:-${COMMIT}} (${arn##*/})."
            VERSION_NOW="${VERSION:-${COMMIT}}"
          done < selected.txt
          # shellcheck disable=SC2046
          aws ecs wait services-stable --cluster "${NAME}" --services $(cat selected.txt)
          if [ "${ENVIRONMENT}" = "preprod" ]; then
            curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 10 --retry-all-errors "https://${DOMAIN_PREPROD}/api/status" >/dev/null
          fi
          # Watch: 5 minutes of the deploy alarms (the full 10-minute watch belongs to the release).
          end=$((SECONDS + 300))
          while [ "${SECONDS}" -lt "${end}" ]; do
            alarms=$(aws cloudwatch describe-alarms --alarm-name-prefix "${NAME}-deploy-" --state-value ALARM --query 'MetricAlarms[].AlarmName' --output text)
            if [ -n "${alarms}" ]; then echo "::error::Deploy alarms firing: ${alarms}"; exit 1; fi
            sleep 30
          done
          echo "${ACTION} ${SERVICE} ${VERSION_NOW}: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment record with the reason
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" -f ref="${GITHUB_SHA}" -f environment="${ENVIRONMENT}" \
            -F auto_merge=false -F "required_contexts[]" -f description="${ACTION} ${SERVICE}" -f payload="{\"reason\":$(printf '%s' "${REASON}" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')}" --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" -f state=success -f description="${ACTION} ${SERVICE}: ${REASON}" >/dev/null

  unlock:
    # Releases the release lock whatever happened, only with the token the lock job took it with (playbook §5.4).
    needs: [lock, operate]
    if: ${{ always() && needs.lock.result != 'skipped' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'prod' && 'prod' || null }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The deploy role
        id: role
        env:
          GIVEN: ${{ inputs.role-to-assume }}
          PREPROD: ${{ vars.AWS_ROLE_PREPROD }}
          PROD: ${{ vars.AWS_ROLE_PROD }}
        run: |
          role="${GIVEN}"
          if [ -z "${role}" ]; then if [ "${ENVIRONMENT}" = "prod" ]; then role="${PROD}"; else role="${PREPROD}"; fi; fi
          if [ -z "${role}" ]; then echo "::error::No deploy role: set the repository variable AWS_ROLE_<ENV>."; exit 1; fi
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Release the release lock
        env:
          LOCK_TOKEN: ${{ needs.lock.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # The cross-repo release lock (foundation-playbook §5.4): one per environment, s3://onepeek-<env>-deploy/locks/release.json,
          # taken with a conditional write (If-None-Match: *) and removed with a conditional delete on its ETag (If-Match). The
          # record names the repo, run ID, run attempt, commit, start time and a random token; only the holder of the token
          # releases it. Anything unreadable fails closed: no lock, no deploy. A lock is never removed while its run is still
          # running: only its token's holder, or a waiter that GitHub shows the holder's run has finished, removes it.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written by a hotfix run, §5.6), every take
          # except that hotfix run's own fails with the reason.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token>"; 1 when the file is not such a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt, token = record["repo"], str(record["run_id"]), str(record["run_attempt"]), str(record.get("token", "-"))
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token)' "$1"
          }
          lock_delete() {  # lock_delete <key> <etag> -> 0 removed, 2 changed or gone meanwhile (read it again), 1 any other answer
            local msg
            if aws s3api delete-object --bucket "${LOCK_BUCKET}" --key "$1" --if-match "$2" >/dev/null 2>"${LOCK_ERR}"; then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*|*"(NoSuchKey)"*) return 2 ;; esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be removed: ${msg}"
            return 1
          }
          lock_run_finished() {  # lock_run_finished <repo> <run id> -> 0 only when GitHub reports the run completed
            local status
            if ! status=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/$1/actions/runs/$2" --jq .status 2>"${LOCK_ERR}"); then
              echo "::warning::Cannot read the state of $(lock_url "$1" "$2"), so it counts as running: $(cat "${LOCK_ERR}")"
              return 1
            fi
            [ "${status}" = "completed" ]
          }
          lock_record() {  # lock_record <file> [token]: this run's record
            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", "")}
          if len(sys.argv) > 2:
              record["token"] = sys.argv[2]
              del record["who"], record["why"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
          }
          lock_frozen_for_others() {  # 0 when preprod-frozen names another run (the reason is printed), 1 when not frozen for us, 2 unreadable
            local etag holder repo run attempt token
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${etag}" = "absent" ]; then return 1; fi
            if ! holder=$(lock_holder lock-frozen.json); then return 2; fi
            read -r repo run attempt token <<< "${holder}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ]; then return 1; fi
            python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));print("preprod is frozen by %s (%s) for the hotfix run %s" % (r.get("who","?"), r.get("why","?"), r.get("run","?")))' lock-frozen.json
            return 0
          }
          lock_take() {  # waits up to LOCK_WAIT_SECONDS, polling every LOCK_POLL_SECONDS, then fails naming the holder's run
            local msg etag holder repo run attempt token rc deadline reason
            if [ -z "${LOCK_TOKEN:-}" ]; then echo "::error::No lock token."; return 1; fi
            lock_record lock-mine.json "${LOCK_TOKEN}"
            deadline=$((SECONDS + LOCK_WAIT_SECONDS))
            while :; do
              rc=0
              reason=$(lock_frozen_for_others) || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "::error::The ${ENVIRONMENT} release lock is refused: ${reason}."; return 1; fi
              if [ "${rc}" -eq 2 ]; then echo "::error::s3://${LOCK_BUCKET}/${FROZEN_KEY} is unreadable, so nothing is deployed."; return 1; fi
              # No encryption flags: the bucket default applies (aws-stack §16).
              if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${LOCK_KEY}" --body lock-mine.json --if-none-match '*' \
                --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
                echo "Took the ${ENVIRONMENT} release lock (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 0
              fi
              msg=$(cat "${LOCK_ERR}")
              case "${msg}" in
                *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;;   # held, or another write at the same moment: see who holds it
                *) echo "::error::The release lock could not be written, so nothing is deployed: ${msg}"; return 1 ;;
              esac
              if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
                echo "::error::The release lock is unreadable, so nothing is deployed."
                return 1
              fi
              if [ "${etag}" = "absent" ]; then   # released between the write and the read: write again
                if [ "${SECONDS}" -ge "${deadline}" ]; then echo "::error::The release lock could not be taken in ${LOCK_WAIT_SECONDS} s."; return 1; fi
                sleep 1
                continue
              fi
              if ! holder=$(lock_holder lock-held.json); then
                echo "::error::The release lock holds no readable record, so nothing is deployed (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 1
              fi
              read -r repo run attempt token <<< "${holder}"
              if { [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" -lt "${GITHUB_RUN_ATTEMPT}" ]; } \
                || lock_run_finished "${repo}" "${run}"; then
                # An earlier attempt of this run (one attempt runs at a time), or a finished run that never released it.
                echo "The release lock is held by $(lock_url "${repo}" "${run}") (attempt ${attempt}), which is not running; taking it over."
                rc=0
                lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
                if [ "${rc}" -eq 1 ]; then return 1; fi
                continue
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::The ${ENVIRONMENT} release lock is still held after ${LOCK_WAIT_SECONDS} s by $(lock_url "${repo}" "${run}")."
                return 1
              fi
              echo "Waiting for the ${ENVIRONMENT} release lock, held by $(lock_url "${repo}" "${run}")."
              sleep "${LOCK_POLL_SECONDS}"
            done
          }
          lock_release() {  # removes the lock only when its token is LOCK_TOKEN (handed over by the lock job's outputs)
            local etag holder repo run attempt token rc
            if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
              echo "::error::The release lock is unreadable; it stays until a later release sees this run has finished."
              return 1
            fi
            if [ "${etag}" = "absent" ]; then echo "No release lock is held."; return 0; fi
            if ! holder=$(lock_holder lock-held.json); then
              echo "::error::The release lock holds no readable record; it is left in place."
              return 1
            fi
            read -r repo run attempt token <<< "${holder}"
            if [ -z "${LOCK_TOKEN:-}" ] || [ "${token}" != "${LOCK_TOKEN}" ]; then
              echo "The release lock is held by $(lock_url "${repo}" "${run}") under another token, not this call; it is left in place."
              return 0
            fi
            rc=0
            lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Released the ${ENVIRONMENT} release lock." ;;
              2) echo "::warning::The release lock changed while it was being released; it is left in place." ;;
              *) return 1 ;;
            esac
          }
          lock_freeze() {  # preprod-frozen (§5.4, §5.6): only a hotfix/* run writes it, naming itself
            local msg etag holder repo run attempt token
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${FROZEN_KEY}" --body lock-frozen-mine.json --if-none-match '*' \
              --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
              echo "Froze ${ENVIRONMENT} for this hotfix run (s3://${LOCK_BUCKET}/${FROZEN_KEY})."
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;; *) echo "::error::preprod-frozen could not be written: ${msg}"; return 1 ;; esac
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json) || [ "${etag}" = "absent" ] || ! holder=$(lock_holder lock-frozen.json); then
              echo "::error::preprod-frozen could not be read back."
              return 1
            fi
            read -r repo run attempt token <<< "${holder}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ]; then echo "${ENVIRONMENT} is already frozen for this run."; return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for $(lock_url "${repo}" "${run}")."
            return 1
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          lock_release
