          fi
      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          TARGET_ENV: ${{ inputs.environment }}
          REASON: ${{ inputs.reason }}
        run: |
          case "${ACTION}" in redeploy|rollback) ;; *) echo "::error::action must be redeploy or rollback."; exit 1;; esac
          case "${TARGET_ENV}" in preprod|prod) ;; *) echo "::error::environment must be preprod or prod."; exit 1;; esac
          if ! printf '%s' "${SERVICE}" | grep -Eq '^[a-z][a-z0-9-]*$'; then echo "::error::bad service name."; exit 1; fi
