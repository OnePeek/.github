                if [ "${rc}" -eq 0 ]; then LOCK_CLAIMED+=("${key}=${LOCK_PUT_ETAG}"); break; fi
                if [ "${rc}" -eq 3 ] && [ "${tries}" -lt 3 ]; then   # 409: re-read; retry only while the ETag is the one this run read
                  tries=$((tries + 1)); sleep 1
                  if etag2=$(lock_read "${key}" "lock-cancel-${key##*/}") && [ "${etag2}" = "${etag}" ]; then continue; fi
                fi
                if [ "${rc}" -eq 1 ]; then return 1; fi
                holder=$(lock_read "${key}" lock-claim-now.json >/dev/null && lock_holder lock-claim-now.json | cut -d' ' -f8 || echo "?")
                echo "::error::The repair claim on s3://${LOCK_BUCKET}/${key} was lost to another repairer (run ${holder}); this run stops and changes nothing."
                return 1
              done
            done
          }
          lock_cancel() {  # cancel-release.yml (delivery-pipelines UC-DEL-009): cancel the caller's live release, or repair its finished one
            local rc live deadline status other conclusion
            rc=0
            lock_cancel_read || rc=$?
            case "${rc}" in
              3) echo "Lock free, nothing held." | tee -a "${GITHUB_STEP_SUMMARY}"; return 0 ;;
              0) ;;
              *) return 1 ;;
            esac
            echo "Held by $(lock_url "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_RUN}") (attempt ${LOCK_CANCEL_ATTEMPT}), phase ${LOCK_CANCEL_PHASE} at the cancel." | tee -a "${GITHUB_STEP_SUMMARY}"
            if ! lock_run_finished "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_RUN}"; then
              if [ "${LOCK_SCOPE}" = "infra" ]; then   # an apply is never cancelled (playbook F27)
                if ! live=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LOCK_CANCEL_RUN}/jobs?per_page=100" \
                    --jq '[.jobs[] | select((.name == "apply" or (.name | startswith("apply "))) and .status != "completed")] | length' 2>"${LOCK_ERR}"); then
                  echo "::error::The jobs of run ${LOCK_CANCEL_RUN} cannot be read, so nothing is cancelled: $(cat "${LOCK_ERR}")"; return 1
                fi
                if [ "${live}" != "0" ]; then
                  echo "::error::The infra release's apply is running: an apply is never cancelled (playbook F27). Run cancel-release.yml again after the apply." | tee -a "${GITHUB_STEP_SUMMARY}"
                  return 1
                fi
              fi
              # The run is live: cancel it (never force-cancel), then wait for its finish to free the key.
              if ! GH_TOKEN="${LOCK_CANCEL_TOKEN}" gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${LOCK_CANCEL_RUN}/cancel" >/dev/null 2>"${LOCK_ERR}"; then
                echo "::error::Run ${LOCK_CANCEL_RUN} could not be cancelled: $(cat "${LOCK_ERR}")"; return 1
              fi
              echo "Cancelled $(lock_url "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_RUN}"); waiting for its finish to free the key."
              deadline=$((SECONDS + LOCK_CANCEL_WAIT_SECONDS))
              while :; do
                sleep "${LOCK_CANCEL_POLL_SECONDS}"
                if ! lock_remint_if_due; then return 1; fi
                other="${LOCK_CANCEL_RUN}"
                rc=0
                lock_cancel_read || rc=$?
                if [ "${rc}" -eq 3 ]; then echo "Lock free: the cancelled run's finish freed the key." | tee -a "${GITHUB_STEP_SUMMARY}"; return 0; fi
                if [ "${rc}" -ne 0 ]; then return 1; fi
                if [ "${LOCK_CANCEL_RUN}" != "${other}" ]; then
                  echo "Freed by run ${other}, now held by $(lock_url "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_RUN}"); it is left alone." | tee -a "${GITHUB_STEP_SUMMARY}"; return 0
                fi
                if lock_run_finished "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_RUN}"; then break; fi
                if [ "${SECONDS}" -ge "${deadline}" ]; then
                  lock_fail_waiting "${GITHUB_REPOSITORY}" "${LOCK_SCOPE}" "${LOCK_CANCEL_RUN}"
                  echo "The key is still held in phase ${LOCK_CANCEL_PHASE}; nothing was removed." | tee -a "${GITHUB_STEP_SUMMARY}"
                  return 1
                fi
              done
            fi
            conclusion=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LOCK_CANCEL_RUN}" --jq '.conclusion // "?"' 2>/dev/null || echo "?")
            echo "The holder's run has finished (${conclusion}) with the key in phase ${LOCK_CANCEL_PHASE}." | tee -a "${GITHUB_STEP_SUMMARY}"
            case "${LOCK_CANCEL_PHASE}" in
              locked|done) lock_cancel_delete_all "${LOCK_CANCEL_HELD[@]}" || return 1 ;;
              migrating)
                # Never stopped: wait for the task (the migrate step's limit), and keep the key while it runs.
                deadline=$((SECONDS + LOCK_MIGRATE_WAIT_SECONDS))
                while :; do
                  rc=0
                  live=$(lock_migrate_live "${LOCK_CANCEL_TASK}" "${LOCK_CANCEL_RUN}" "${LOCK_CANCEL_ATTEMPT}") || rc=$?
                  if [ "${rc}" -eq 2 ]; then return 1; fi
                  if [ "${rc}" -eq 1 ]; then break; fi
                  if [ "${SECONDS}" -ge "${deadline}" ]; then
                    echo "::error::The migrate task ${live} is still running after ${LOCK_MIGRATE_WAIT_SECONDS} s; the key is kept (a migrate task is never stopped)." | tee -a "${GITHUB_STEP_SUMMARY}"; return 1
                  fi
                  sleep "${LOCK_POLL_SECONDS}"
                done
                echo "The migrate task stopped; exit code $(lock_migrate_exit "${LOCK_CANCEL_TASK}")." | tee -a "${GITHUB_STEP_SUMMARY}"
                lock_cancel_delete_all "${LOCK_CANCEL_HELD[@]}" || return 1 ;;
              rolling)
                if [ "${LOCK_CANCEL_REPAIR}" != "-" ] && ! lock_run_finished "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_REPAIR%-*}"; then
                  echo "::error::Being repaired by $(lock_url "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_REPAIR%-*}"); this run writes nothing." | tee -a "${GITHUB_STEP_SUMMARY}"; return 1
                fi
                lock_cancel_claim || return 1
                if ! lock_put_back "${LOCK_CANCEL_FILE}"; then
                  echo "::error::The put-back failed: the key stays rolling with this claim; run cancel-release.yml again to claim and repair it." | tee -a "${GITHUB_STEP_SUMMARY}"; return 1
                fi
                lock_cancel_report_services "${LOCK_CANCEL_FILE}"
                lock_cancel_delete_all "${LOCK_CLAIMED[@]}" || return 1
                echo "Lock free: every service is back on its recorded revision." | tee -a "${GITHUB_STEP_SUMMARY}" ;;
            esac
          }
          lock_cancel_report_services() {  # each service with its revision before (the record) and after (describe-services), and the aliases
            local kind svc td now
            while read -r kind svc td; do
              if [ "${kind}" = "service" ]; then
                now=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo "?")
                echo "- ${svc}: recorded ${td##*/}, now ${now##*/}" >> "${GITHUB_STEP_SUMMARY}"
              else
                echo "- ${svc} live alias: version ${td}" >> "${GITHUB_STEP_SUMMARY}"
              fi
            done < lock-put-back.txt
          }
          lock_freeze() {  # preprod-frozen (§5.4, §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            local msg etag branch repo ref
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${FROZEN_KEY}" --body lock-frozen-mine.json --if-none-match '*' \
              --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
              echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY})."
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;; *) echo "::error::preprod-frozen could not be written: ${msg}"; return 1 ;; esac
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json) || [ "${etag}" = "absent" ] || ! branch=$(lock_frozen_branch lock-frozen.json); then
              echo "::error::preprod-frozen could not be read back."
              return 1
            fi
            read -r repo ref <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then echo "${ENVIRONMENT} is already frozen for this branch."; return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          # A random token names this take; unlock gets it through the job outputs and releases only on a match.
          LOCK_TOKEN=$(python3 -c "import secrets;print(secrets.token_hex(16))")
          echo "token=${LOCK_TOKEN}" >> "$GITHUB_OUTPUT"
          lock_take
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  operate:
    needs: lock
    # The real prod control is the prod role's trust (runner_environment: github-hosted, ci-runners.md section 11.3);
    # the prod prefix in runs-on is defence in depth.
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'prod' && 'prod' || null }}
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
