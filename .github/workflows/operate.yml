                    echo "::error::locks/${LOCK_SCOPE}.json is held by an infra release ($(lock_url "${repo}" "${run}")): cancel from onepeek-infra."
                  else
                    echo "::error::locks/${LOCK_SCOPE}.json is held by ${repo} ($(lock_url "${repo}" "${run}")), not this repository: cancel from there."
                  fi
                  return 1
                fi
                echo "s3://${LOCK_BUCKET}/${key} is held by ${repo}, not this repository; it is left alone."
                continue
              fi
