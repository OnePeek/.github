            fi
            conclusion=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LOCK_CANCEL_RUN}" --jq '.conclusion // "?"' 2>/dev/null || echo "?")
            echo "The holder's run has finished (${conclusion}) with the key in phase ${LOCK_CANCEL_PHASE}." | tee -a "${GITHUB_STEP_SUMMARY}"
            case "${LOCK_CANCEL_PHASE}" in
              locked|done) lock_cancel_delete_all "${LOCK_CANCEL_HELD[@]}" || return 1 ;;
              migrating)
                # Never stopped: wait for the task (the migrate step's limit), and keep the key while it runs.
                deadline=$((SECONDS + LOCK_MIGRATE_WAIT_SECONDS))
                while :; do
                  rc=0
                  live=$(lock_migrate_live "${LOCK_CANCEL_TASK}" "${LOCK_CANCEL_RUN}" "${LOCK_CANCEL_ATTEMPT}") || rc=$?
                  if [ "${rc}" -eq 2 ]; then return 1; fi
                  if [ "${rc}" -eq 1 ]; then break; fi
                  if [ "${SECONDS}" -ge "${deadline}" ]; then
                    echo "::error::The migrate task ${live} is still running after ${LOCK_MIGRATE_WAIT_SECONDS} s; the key is kept (a migrate task is never stopped)." | tee -a "${GITHUB_STEP_SUMMARY}"; return 1
                  fi
                  sleep "${LOCK_POLL_SECONDS}"
                done
                echo "The migrate task stopped; exit code $(lock_migrate_exit "${LOCK_CANCEL_TASK}")." | tee -a "${GITHUB_STEP_SUMMARY}"
                lock_cancel_delete_all "${LOCK_CANCEL_HELD[@]}" || return 1 ;;
              rolling)
                if [ "${LOCK_CANCEL_REPAIR}" != "-" ] && ! lock_run_finished "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_REPAIR%-*}"; then
                  echo "::error::Being repaired by $(lock_url "${GITHUB_REPOSITORY}" "${LOCK_CANCEL_REPAIR%-*}"); this run writes nothing." | tee -a "${GITHUB_STEP_SUMMARY}"; return 1
                fi
                lock_cancel_claim || return 1
                if ! lock_put_back "${LOCK_CANCEL_FILE}"; then
                  echo "::error::The put-back failed: the key stays rolling with this claim; run cancel-release.yml again to claim and repair it." | tee -a "${GITHUB_STEP_SUMMARY}"; return 1
                fi
                lock_cancel_report_services "${LOCK_CANCEL_FILE}"
                lock_cancel_delete_all "${LOCK_CLAIMED[@]}" || return 1
                echo "Lock free: every service is back on its recorded revision." | tee -a "${GITHUB_STEP_SUMMARY}" ;;
            esac
          }
          lock_cancel_report_services() {  # each service with its revision before (the record) and after (describe-services), and the aliases
            local kind svc td now
            while read -r kind svc td; do
              if [ "${kind}" = "service" ]; then
                now=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo "?")
                echo "- ${svc}: recorded ${td##*/}, now ${now##*/}" >> "${GITHUB_STEP_SUMMARY}"
              else
                echo "- ${svc} live alias: version ${td}" >> "${GITHUB_STEP_SUMMARY}"
              fi
            done < lock-put-back.txt
          }
          lock_freeze() {  # preprod-frozen (§5.4, §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            local msg etag branch repo ref
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${FROZEN_KEY}" --body lock-frozen-mine.json --if-none-match '*' \
              --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
              echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY})."
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;; *) echo "::error::preprod-frozen could not be written: ${msg}"; return 1 ;; esac
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json) || [ "${etag}" = "absent" ] || ! branch=$(lock_frozen_branch lock-frozen.json); then
              echo "::error::preprod-frozen could not be read back."
              return 1
            fi
            read -r repo ref <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then echo "${ENVIRONMENT} is already frozen for this branch."; return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          lock_finish
