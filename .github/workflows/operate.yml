# Redeploy or roll back one named service (onepeek-docs architecture/lld/infra/delivery-pipelines.md UC-DEL-002, §5).
# `workflow_dispatch` runs from the release branch only (the deploy roles trust no other branch). A repo's own button
# can also call it as a shared workflow. The service choice list below is generated from the services file by
# scripts/check_service_list.py, which fails CI if the list drifts (run it with --write to regenerate).
name: operate

on:
  workflow_dispatch:
    inputs:
      action:
        description: redeploy = force a new deployment of the same revision; rollback = an earlier version
        type: choice
        options: [redeploy, rollback]
        required: true
      service:
        description: A long-running service, or all of them
        type: choice
        # service-list begin
        options: [all, api, api-critical, worker, scheduler, web]
        # service-list end
        required: true
      environment:
        description: Environment (prod needs the prod environment approval)
        type: choice
        options: [preprod, prod]
        default: preprod
      version:
        description: Rollback target; empty = the previous release tag
        type: string
        default: ""
      reason:
        description: Written into the deployment record
        type: string
        required: true
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      service:
        type: string
        required: true
      environment:
        type: string
        required: true
      version:
        type: string
        default: ""
      reason:
        type: string
        required: true
      role-to-assume:
        description: The repo's deploy role; empty = the repository variable AWS_ROLE_<ENV>.
        type: string
        default: ""

permissions: {}

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  ENVIRONMENT: ${{ inputs.environment }}
  NAME: onepeek-${{ inputs.environment }}

jobs:
  operate:
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'prod' && 'prod' || null }}
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          TARGET_ENV: ${{ inputs.environment }}
          REASON: ${{ inputs.reason }}
        run: |
          case "${ACTION}" in redeploy|rollback) ;; *) echo "::error::action must be redeploy or rollback."; exit 1;; esac
          case "${TARGET_ENV}" in preprod|prod) ;; *) echo "::error::environment must be preprod or prod."; exit 1;; esac
          if ! printf '%s' "${SERVICE}" | grep -Eq '^[a-z][a-z0-9-]*$'; then echo "::error::bad service name."; exit 1; fi
          if [ -z "${REASON}" ]; then echo "::error::reason is required."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: The deploy role
        id: role
        env:
          GIVEN: ${{ inputs.role-to-assume }}
          PREPROD: ${{ vars.AWS_ROLE_PREPROD }}
          PROD: ${{ vars.AWS_ROLE_PROD }}
        run: |
          role="${GIVEN}"
          if [ -z "${role}" ]; then if [ "${ENVIRONMENT}" = "prod" ]; then role="${PROD}"; else role="${PREPROD}"; fi; fi
          if [ -z "${role}" ]; then echo "::error::No deploy role: set the repository variable AWS_ROLE_<ENV>."; exit 1; fi
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Redeploy or roll back
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          TARGET: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          DOMAIN_PREPROD: preprod.onepeek.info
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          aws s3 cp "s3://${NAME}-deploy/services.${ENVIRONMENT}.yaml" services.yaml --only-show-errors
          # name<TAB>image for every long-running service
          python3 - <<'PY' > targets.tsv
          import os, yaml
          doc = yaml.safe_load(open("services.yaml"))
          defaults = doc.get("defaults", {})
          one_off = {"migration", "operator", "function"}
          for name, svc in doc["services"].items():
              if set(svc.get("triggers", [])) <= one_off:
                  continue
              print(name, svc.get("image", defaults.get("image")), sep="\t")
          PY
          if [ "${SERVICE}" = "all" ]; then
            cut -f1 targets.tsv > selected.txt
          elif cut -f1 targets.tsv | grep -qx "${SERVICE}"; then
            echo "${SERVICE}" > selected.txt
          else
            echo "::error::${SERVICE} is not a long-running service in the services file."; exit 1
          fi
          if [ "${ENVIRONMENT}" = "prod" ]; then
            aws ssm get-parameter --name /onepeek/prod/release/signing_public_key --query Parameter.Value --output text > signing.pub
            key=signing.pub
          else
            key="awskms:///alias/${NAME}-image-signing"
          fi
          VERSION_NOW=""
          while read -r svc; do
            image=$(awk -F'\t' -v s="${svc}" '$1==s{print $2}' targets.tsv)
            current=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${image}/version" --query Parameter.Value --output text)
            if [ "${ACTION}" = "redeploy" ]; then
              aws ecs update-service --cluster "${NAME}" --service "${svc}" --force-new-deployment >/dev/null
              echo "Redeploying ${svc} (same revision)."
              continue
            fi
            target="${TARGET}"
            if [ -z "${target}" ]; then
              target=$(git tag --list 'v*' --sort=-v:refname | grep -x -A1 "v${current}" | tail -n1 | sed 's/^v//')
              if [ -z "${target}" ] || [ "${target}" = "${current}" ]; then echo "::error::No release tag before v${current}."; exit 1; fi
            fi
            digest=$(aws ecr describe-images --repository-name "${NAME}/${image}" --image-ids "imageTag=v${target}" --query 'imageDetails[0].imageDigest' --output text)
            IMAGE_REF="${registry}/${NAME}/${image}@${digest}"
            cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${key}" "${IMAGE_REF}" >/dev/null
            VERSION="${target}"
            # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          render() {  # render <service> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" VERSION="${VERSION}" RUN_ID="${GITHUB_RUN_ID}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if len(containers) != 1:
              sys.exit("a task template holds exactly one container")
          containers[0]["image"] = os.environ["IMAGE_REF"]
          doc["tags"] = [{"key": "version", "value": os.environ["VERSION"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
            render "${svc}" > "td-${svc}.json"
            arn=$(aws ecs register-task-definition --cli-input-json "file://td-${svc}.json" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${arn}" >/dev/null
            echo "Rolling ${svc} back to v${target} (${arn##*/})."
            VERSION_NOW="${target}"
          done < selected.txt
          # shellcheck disable=SC2046
          aws ecs wait services-stable --cluster "${NAME}" --services $(cat selected.txt)
          if [ "${ENVIRONMENT}" = "preprod" ]; then
            curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 10 --retry-all-errors "https://${DOMAIN_PREPROD}/api/status" >/dev/null
          fi
          # Watch: 5 minutes of the deploy alarms (the full 10-minute watch belongs to the release).
          end=$((SECONDS + 300))
          while [ "${SECONDS}" -lt "${end}" ]; do
            alarms=$(aws cloudwatch describe-alarms --alarm-name-prefix "${NAME}-deploy-" --state-value ALARM --query 'MetricAlarms[].AlarmName' --output text)
            if [ -n "${alarms}" ]; then echo "::error::Deploy alarms firing: ${alarms}"; exit 1; fi
            sleep 30
          done
          echo "${ACTION} ${SERVICE} ${VERSION_NOW}: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment record with the reason
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" -f ref="${GITHUB_SHA}" -f environment="${ENVIRONMENT}" \
            -F auto_merge=false -F "required_contexts[]" -f description="${ACTION} ${SERVICE}" -f payload="{\"reason\":$(printf '%s' "${REASON}" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')}" --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" -f state=success -f description="${ACTION} ${SERVICE}: ${REASON}" >/dev/null
