# Shared: the contract between repos on every pull request (onepeek-docs decisions/founder-decisions.md decision 153;
# architecture/lld/infra/delivery-pipelines.md §6.1 row "contract between repos"; aws-stack.md §16 "Merge order and pins").
# Called by backend-service, onepeek-web and onepeek-infra on pull requests into dev and release. Real code against real
# files: the backend's `app check services` and settings loader against infra's config/services.<env>.yaml and published
# settings, and web's start-up loader against the same settings. The calling repo is taken at the pull request; the other
# repos at dev for a pull request into dev; for a release pull request, at their release candidate: the head commit of
# their open dev -> release pull request, else their release branch (delivery-pipelines §6.1), so what is checked is the
# exact version that ships; and at release for a hotfix/* pull request into release. The checks themselves live in one
# place, onepeek-infra's scripts/contract.py.
name: contract

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      role:
        description: The calling repo, backend, web or infra.
        type: string
        required: true
      base_ref:
        description: The pull request's base branch, dev or release (github.base_ref).
        type: string
        required: true
    secrets:
      AGENTS_APP_CLIENT_ID:
        description: The agents' GitHub App (playbook §8a S6). Its token, scoped to backend-service, onepeek-web and onepeek-infra with Contents read and Pull requests read, checks out the other repos and reads their open release pull requests.
        required: false
      AGENTS_APP_PRIVATE_KEY:
        description: The agents' GitHub App private key (with AGENTS_APP_CLIENT_ID).
        required: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: The agents' App secrets are passed
        id: tokens
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::Pass AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY (playbook §8a S6): the contract job reads the other repos."
            exit 1
          fi

      - name: The agents' GitHub App token (Contents and Pull requests read on the three repos)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend-service,onepeek-web,onepeek-infra # the repos this job names
          permission-contents: read
          permission-pull-requests: read

      - name: The other repos' ref (dev; the release candidate for a release pull request; release for a hotfix)
        id: ref
        env:
          ROLE: ${{ inputs.role }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          case "${ROLE}" in backend|web|infra) ;; *) echo "::error::role must be backend, web or infra, not '${ROLE}'."; exit 1 ;; esac
          case "${BASE_REF}" in dev|release) ;; *) echo "::error::base_ref must be dev or release, not '${BASE_REF}'."; exit 1 ;; esac
          for side in backend web infra; do
            [ "${side}" = "${ROLE}" ] && continue
            case "${side}" in backend) repo=backend-service ;; web) repo=onepeek-web ;; infra) repo=onepeek-infra ;; esac
            if [ "${BASE_REF}" = dev ]; then
              ref=dev
            elif [[ "${HEAD_REF}" == hotfix/* ]]; then
              ref=release   # a hotfix ships against what is live
            else
              # The release candidate (delivery-pipelines §6.1): the head commit of the open dev -> release pull request,
              # which is exactly what its promotion ships, else the release branch, which is what runs. Fails closed.
              if ! heads=$(gh api "repos/${OWNER}/${repo}/pulls?state=open&base=release&head=${OWNER}:dev" --jq '.[].head.sha'); then
                echo "::error::Cannot read ${repo}'s open pull requests into release, so its release candidate is unknown."
                exit 1
              fi
              if [ -z "${heads}" ]; then
                ref=release
              elif [[ "${heads}" =~ ^[0-9a-f]{40}$ ]]; then   # one line only: =~ anchors to the whole value
                ref="${heads}"
              else
                echo "::error::${repo}: expected at most one open dev -> release pull request with a commit SHA, got: ${heads}"
                exit 1
              fi
            fi
            echo "${side} is taken at ${ref}"
            echo "${side}=${ref}" >> "$GITHUB_OUTPUT"
          done

      - name: This pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _${{ inputs.role }}
          persist-credentials: false

      - name: onepeek-infra at its ref
        if: ${{ inputs.role != 'infra' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/onepeek-infra
          ref: ${{ steps.ref.outputs.infra }}
          token: ${{ steps.app.outputs.token }}
          path: _infra
          persist-credentials: false

      - name: backend-service at its ref
        if: ${{ inputs.role == 'infra' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/backend-service
          ref: ${{ steps.ref.outputs.backend }}
          token: ${{ steps.app.outputs.token }}
          path: _backend
          persist-credentials: false

      - name: onepeek-web at its ref
        if: ${{ inputs.role == 'infra' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/onepeek-web
          ref: ${{ steps.ref.outputs.web }}
          token: ${{ steps.app.outputs.token }}
          path: _web
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.0" # foundation-playbook §8a P3; local_ci.py UV_VERSION

      - name: The backend's own environment (its real validator and settings loader)
        if: ${{ inputs.role != 'web' }}
        run: uv sync --directory _backend --frozen --quiet

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.role != 'backend' }}
        with:
          node-version-file: _web/.node-version

      - name: The contract logic's own tests (onepeek-infra pull requests)
        if: ${{ inputs.role == 'infra' }}
        working-directory: _infra
        run: uvx --with pyyaml==6.0.3 python -m unittest scripts/test_contract.py

      - name: The contract between repos
        env:
          ROLE: ${{ inputs.role }}
        run: |
          # No AWS credentials or settings from the runner reach the loaders.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_REGION AWS_DEFAULT_REGION
          export AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null
          case "${ROLE}" in
            backend) sides=(--backend _backend) ;;
            web) sides=(--web _web) ;;
            infra) sides=(--backend _backend --web _web) ;;
          esac
          uvx --with pyyaml==6.0.3 python _infra/scripts/contract.py --infra _infra "${sides[@]}"

      - name: Job usage (CPU, memory, disk and instance type, as a notice; S0 runner sizes)
        # Measurement only: scripts/job_usage.py verbatim (scripts/test_job_usage.py), never fails or slows the job.
        if: ${{ always() && runner.environment != 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          RUNNER_CLASS: light
          RUNNER_INPUT: ${{ inputs.runner }}
        shell: python3 -I {0}
        run: |
          """Job usage: one JSON line with what a job on our own runners used (S0 of the infra stabilization plan, runner sizes).

          Run as the last step of every shared-workflow job that can run on our runners (`if: always()`, continue-on-error).
          It reads the job's cgroup totals (no start step needed): CPU seconds (cgroup v2 cpu.stat usage_usec, else cgroup v1
          cpuacct.usage, else /proc/stat since boot), peak memory (memory.peak, else memory.max_usage_in_bytes), the job's wall
          time (from the start of the runner's per-job Runner.Worker process), average vCPU (CPU seconds over wall seconds),
          disk used on / and on the workspace's filesystem at job end, and the instance type (IMDSv2, link-local, 1 s budget).
          A value it cannot read is "unavailable" ("unknown" for the instance type). It prints `::notice::job-usage {json}` (read
          back from the job's annotations by the API, no artifact) and appends the JSON line to the step summary. It never fails
          the job: every read is guarded and it always exits 0. On GitHub-hosted runners it does nothing.
          Workflows run a verbatim copy of this file (scripts/test_job_usage.py keeps the copies identical).
          """
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.request

          NA = "unavailable"
          LIMIT = 65536  # bytes read from any one file
          IMDS = "http://169.254.169.254"
          IMDS_BUDGET = 1.0  # seconds for the whole instance-type lookup
          WORKER = "Runner.Worker"  # the runner's per-job process; its start is the job's start


          def _read(path):
              try:
                  with open(path, "rb") as f:
                      return f.read(LIMIT).decode("ascii")
              except (OSError, UnicodeDecodeError, ValueError):
                  return None


          def _int(text):
              try:
                  value = int(text.strip())
              except (AttributeError, ValueError):
                  return None
              return value if value >= 0 else None


          def cgroups(proc):
              """{"v2": path} or {controller: path} for cgroup v1, from <proc>/self/cgroup; {} when unreadable."""
              found = {}
              for line in (_read(os.path.join(proc, "self", "cgroup")) or "").splitlines():
                  parts = line.split(":", 2)
                  if len(parts) != 3 or not parts[2].startswith("/"):
                      continue
                  if parts[0] == "0" and parts[1] == "":
                      found["v2"] = parts[2]
                  for controller in parts[1].split(","):
                      if controller:
                          found[controller] = parts[2]
              return found


          def _under(sysfs, *parts):
              return os.path.join(sysfs, *[p.lstrip("/") for p in parts])


          def cpu_seconds(proc, sysfs, groups):
              """(seconds, source), or (NA, NA)."""
              if "v2" in groups:
                  for line in (_read(_under(sysfs, groups["v2"], "cpu.stat")) or "").splitlines():
                      key, _, value = line.partition(" ")
                      if key == "usage_usec" and _int(value) is not None:
                          return round(_int(value) / 1e6, 3), "cgroup"
              if "cpuacct" in groups:
                  value = _int(_read(_under(sysfs, "cpuacct", groups["cpuacct"], "cpuacct.usage")))
                  if value is not None:
                      return round(value / 1e9, 3), "cgroup_v1"
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  fields = line.split()
                  if fields[:1] == ["cpu"] and len(fields) >= 9:
                      ticks = [_int(fields[i]) for i in (1, 2, 3, 6, 7, 8)]  # user nice system irq softirq steal
                      if None not in ticks:
                          return round(sum(ticks) / os.sysconf("SC_CLK_TCK"), 3), "proc_stat_since_boot"
              return NA, NA


          def memory_peak(sysfs, groups):
              """(bytes, source), or (NA, NA)."""
              if "v2" in groups:
                  value = _int(_read(_under(sysfs, groups["v2"], "memory.peak")))
                  if value is not None:
                      return value, "cgroup"
              if "memory" in groups:
                  value = _int(_read(_under(sysfs, "memory", groups["memory"], "memory.max_usage_in_bytes")))
                  if value is not None:
                      return value, "cgroup_v1"
              return NA, NA


          def _stat(proc, pid):
              """(comm, ppid, starttime in clock ticks after boot) of a process, or None."""
              text = _read(os.path.join(proc, str(pid), "stat"))
              if not text or "(" not in text or ")" not in text:
                  return None
              comm = text[text.index("(") + 1:text.rindex(")")]
              fields = text[text.rindex(")") + 1:].split()
              if len(fields) < 20 or _int(fields[1]) is None or _int(fields[19]) is None:
                  return None
              return comm, _int(fields[1]), _int(fields[19])


          def wall_seconds(proc, now, pid):
              """Seconds since the nearest Runner.Worker ancestor started, or NA."""
              btime = None
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  if line.startswith("btime "):
                      btime = _int(line[6:])
              if btime is None:
                  return NA
              for _ in range(64):
                  info = _stat(proc, pid)
                  if info is None:
                      return NA
                  comm, ppid, start = info
                  if comm == WORKER:
                      wall = now - (btime + start / os.sysconf("SC_CLK_TCK"))
                      return round(wall, 1) if wall > 0 else NA
                  if ppid in (None, 0) or ppid == pid:
                      return NA
                  pid = ppid
              return NA


          def disk_used(path):
              try:
                  st = os.statvfs(path)
              except (OSError, TypeError, ValueError):
                  return NA
              return (st.f_blocks - st.f_bfree) * st.f_frsize


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def _imds(base, out):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), _NoRedirect)
              put = urllib.request.Request(base + "/latest/api/token", method="PUT",
                                           headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
              with opener.open(put, timeout=IMDS_BUDGET) as r:
                  token = r.read(256).decode("ascii").strip()
              get = urllib.request.Request(base + "/latest/meta-data/instance-type", headers={"X-aws-ec2-metadata-token": token})
              with opener.open(get, timeout=IMDS_BUDGET) as r:
                  value = r.read(64).decode("ascii").strip()
              if re.fullmatch(r"[a-z0-9-]+\.[a-z0-9]+", value):
                  out.append(value)


          def instance_type(base=IMDS, budget=IMDS_BUDGET):
              """The EC2 instance type, or "unknown" when IMDS is absent, slow, denied or odd (never more than `budget` s)."""
              out = []

              def run():
                  try:
                      _imds(base, out)
                  except Exception:
                      pass

              worker = threading.Thread(target=run, daemon=True)
              worker.start()
              worker.join(budget)
              return out[0] if out and not worker.is_alive() else "unknown"


          def collect(env, proc="/proc", sysfs="/sys/fs/cgroup", imds=IMDS, now=None, pid=None):
              now = time.time() if now is None else now
              groups = cgroups(proc)
              cpu, cpu_source = cpu_seconds(proc, sysfs, groups)
              mem, mem_source = memory_peak(sysfs, groups)
              wall = wall_seconds(proc, now, os.getpid() if pid is None else pid)
              avg = round(cpu / wall, 3) if isinstance(cpu, float) and isinstance(wall, float) and wall > 0 else NA
              return {
                  "repo": env.get("GITHUB_REPOSITORY", NA),
                  "job": env.get("GITHUB_JOB", NA),
                  "runner_class": env.get("RUNNER_CLASS", NA),
                  "runner_input": env.get("RUNNER_INPUT", NA),
                  "runner_name": env.get("RUNNER_NAME", NA),
                  "instance_type": instance_type(imds),
                  "wall_s": wall,
                  "cpu_s": cpu,
                  "cpu_source": cpu_source,
                  "avg_vcpu": avg,
                  "mem_peak_bytes": mem,
                  "mem_source": mem_source,
                  "disk_used_root_bytes": disk_used("/"),
                  "disk_used_workspace_bytes": disk_used(env.get("GITHUB_WORKSPACE")) if env.get("GITHUB_WORKSPACE") else NA,
                  "cgroup": groups.get("v2", groups.get("memory", NA)),
              }


          def main(env=None, **kwargs):
              env = os.environ if env is None else env
              if env.get("RUNNER_ENVIRONMENT") == "github-hosted":
                  return 0
              line = json.dumps(collect(env, **kwargs), sort_keys=True, separators=(",", ":"))
              print("::notice::job-usage " + line.replace("%", "%25"), flush=True)
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as f:
                          f.write(line + "\n")
                  except (OSError, ValueError):
                      print("job-usage: the step summary is not writable", file=sys.stderr)
              return 0


          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  pass
              sys.exit(0)
