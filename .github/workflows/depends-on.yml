# Shared: dependencies of a pull request (onepeek-docs architecture/lld/infra/foundation-playbook.md §8a P1, lessons
# L26 and L27). Every pull-request workflow that runs on our runners starts with this job and every other job in it
# `needs:` it, not only checks.yml, so no runner time is spent on a run whose result is already known. It fails with
# "waiting for <repo>#<n>" while a pull request named in the body by a `Depends on: OnePeek/<repo>#<n>` line is
# unmerged, and, with no line needed, while the caller's docs-version.txt names a onepeek-docs commit that is not on
# docs main: then the open docs pull request containing that commit is the dependency ("waiting for onepeek-docs#<n>"),
# and a pin in no open docs pull request fails. Callers trigger on pull_request types opened, reopened and synchronize,
# never edited (it re-ran every check on a body edit): when a dependency merges, ship_change_set.py re-runs the
# dependent pull request's checks. Reads use the agents' App token (S6): callers pass AGENTS_APP_CLIENT_ID and
# AGENTS_APP_PRIVATE_KEY; they are needed when the body has such a line or the repo has docs-version.txt. The logic is
# scripts/check_depends_on.py at the caller's pin. The body is read live from the API with the job's GITHUB_TOKEN
# (pull-requests: read, which the caller's job must grant), never from the event payload, which is the body at trigger
# time and would miss a line added or removed after it. With no pull request in the event (a push, schedule or dispatch run of
# the caller) there is nothing to wait for: every step but a notice is skipped, so the job passes and the jobs that need it run;
# the docs ancestor rule on push is the pins job's, not this one's.
name: depends-on

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
    secrets:
      AGENTS_APP_CLIENT_ID:
        description: The agents' GitHub App (playbook §8a S6), for Pull requests read on the repos the body names and Contents and Pull requests read on onepeek-docs.
        required: false
      AGENTS_APP_PRIVATE_KEY:
        description: The agents' GitHub App private key (with AGENTS_APP_CLIENT_ID).
        required: false

permissions:
  contents: read
  pull-requests: read  # the pull request's own live body (callers grant it to this job)

jobs:
  depends-on:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Not a pull request (a push, schedule or dispatch run)
        if: ${{ github.event.pull_request.number == '' }}
        run: |
          echo "::notice::not a pull request: nothing to wait for"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.pull_request.number != '' }}
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts

      - name: This workflow's version (the caller's pin of depends-on.yml)
        id: version
        if: ${{ github.event.pull_request.number != '' }}
        run: |
          sha=$(grep -rhoiE 'OnePeek/\.github/\.github/workflows/depends-on\.yml@[0-9a-f]{40}' .github/workflows | head -n 1 | cut -d@ -f2 || true)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "depends-on.yml runs at ${sha:-this repo (a local call)}"

      - name: OnePeek/.github at that version
        if: ${{ github.event.pull_request.number != '' && steps.version.outputs.sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OnePeek/.github
          ref: ${{ steps.version.outputs.sha }}
          path: _shared
          persist-credentials: false

      - name: The pull request's live body (from the API, not the event payload)
        id: body
        if: ${{ github.event.pull_request.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr-body.txt"
          echo "file=${RUNNER_TEMP}/pr-body.txt" >> "$GITHUB_OUTPUT"

      - name: The repos the body names, and the docs commit docs-version.txt pins
        id: deps
        if: ${{ github.event.pull_request.number != '' }}
        env:
          SHA: ${{ steps.version.outputs.sha }}
          BODY_FILE: ${{ steps.body.outputs.file }}
        run: |
          script=scripts/check_depends_on.py
          [ -n "${SHA}" ] && script=_shared/scripts/check_depends_on.py
          {
            echo "script=${script}"
            echo "repos=$(python3 "${script}" --repos)"
            echo "docs=$(python3 "${script}" --docs-pin)"
          } >> "$GITHUB_OUTPUT"

      - name: The agents' GitHub App secrets are set (a dependency in another repo, or the docs pin, is read with them)
        if: ${{ github.event.pull_request.number != '' && (steps.deps.outputs.repos != '' || steps.deps.outputs.docs != '') }}
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY must be passed: the Depends on lines name pull requests in other repos, or docs-version.txt pins a onepeek-docs commit (playbook §8a P1, S6)."
            exit 1
          fi

      - name: The agents' GitHub App token (Pull requests read on the named repos)
        id: app
        if: ${{ github.event.pull_request.number != '' && steps.deps.outputs.repos != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.deps.outputs.repos }}
          permission-pull-requests: read

      - name: The agents' GitHub App token (Contents and Pull requests read on onepeek-docs, for the docs pin)
        id: docs-app
        if: ${{ github.event.pull_request.number != '' && steps.deps.outputs.docs != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: onepeek-docs
          permission-contents: read
          permission-pull-requests: read

      - name: Every dependency is merged (declared, and the docs pin's pull request)
        if: ${{ github.event.pull_request.number != '' }}
        env:
          SCRIPT: ${{ steps.deps.outputs.script }}
          BODY_FILE: ${{ steps.body.outputs.file }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOCS_TOKEN: ${{ steps.docs-app.outputs.token }}
        run: python3 "${SCRIPT}" --check
