# Shared: scan new commits for secrets with gitleaks. Called by every OnePeek repo.
name: secret-scan

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The job brings its own Python packages: our runner image has no pip (ci-runners.md §8.3).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.0" # foundation-playbook §8a P3; local_ci.py UV_VERSION

      - name: Pre-commit hook has a gitleaks step that fails when gitleaks is missing
        run: |
          uv run --no-project --with pyyaml==6.0.3 python3 - <<'PY'
          import sys, yaml
          try:
              run = yaml.safe_load(open("lefthook.yml"))["pre-commit"]["commands"]["gitleaks"]["run"]
          except (OSError, KeyError, TypeError, yaml.YAMLError) as e:
              sys.exit(f"::error::lefthook.yml needs pre-commit.commands.gitleaks.run ({type(e).__name__})")
          if "command -v gitleaks" not in run or "exit 1" not in run:
              sys.exit("::error::the lefthook gitleaks step must test `command -v gitleaks` and `exit 1` when it is missing")
          PY

      - name: Install gitleaks (pinned, checksum verified)
        env:
          VERSION: 8.30.1
          SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          case "${RUNNER_ARCH}" in
            X64) asset=linux_x64; sha="${SHA256_X64}" ;;
            ARM64) asset=linux_arm64; sha="${SHA256_ARM64}" ;;
            *) echo "::error::Unsupported runner architecture ${RUNNER_ARCH}."; exit 1 ;;
          esac
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_${asset}.tar.gz"
          echo "${sha}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request, scan only its commits; otherwise scan the whole history.
          if [ -n "${BASE_SHA}" ]; then
            ./gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..HEAD" .
          else
            ./gitleaks git --redact --no-banner .
          fi
