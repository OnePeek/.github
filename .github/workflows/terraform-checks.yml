# Shared: Terraform checks (fmt, validate, tflint, checkov). Called by onepeek-infra.
name: terraform-checks

on:
  workflow_call:
    inputs:
      roots:
        description: "Space-separated Terraform roots to validate."
        type: string
        default: "envs/preprod envs/prod"
      terraform-version:
        description: "Exact Terraform version; keep it inside the roots' required_version."
        type: string
        default: "1.16.6"

permissions:
  contents: read

env:
  CHECKOV_VERSION: 3.3.29
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Format
        run: terraform fmt -check -recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl', '**/versions.tf') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Validate each root
        env:
          ROOTS: ${{ inputs.roots }}
        run: |
          for root in ${ROOTS}; do
            echo "== ${root}"
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: Terraform tests (every module or root with a *.tftest.hcl)
        # Registry provider downloads only; no backend, no cloud credentials.
        run: |
          set -euo pipefail
          # A suite's module is the folder above its tests/ folder (any depth under tests/), else its own folder.
          dirs=$(find . -name '*.tftest.hcl' -not -path '*/.terraform/*' -print0 | while IFS= read -r -d '' f; do
            d=$(dirname "$f")
            case "$d" in
              */tests/*) d=${d%%/tests/*} ;;
              */tests) d=${d%/tests} ;;
            esac
            printf '%s\n' "$d"
          done | sort -u)
          if [ -z "${dirs}" ]; then echo "::error::no *.tftest.hcl found: this check would test nothing"; exit 1; fi
          while IFS= read -r d; do
            echo "== ${d}"
            terraform -chdir="${d}" init -backend=false -input=false
            terraform -chdir="${d}" test
          done <<< "${dirs}"

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

      - name: checkov
        run: uvx "checkov==${CHECKOV_VERSION}" --directory . --framework terraform --quiet --compact
