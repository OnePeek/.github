# Shared: Terraform checks (fmt, validate, tflint, checkov). Called by onepeek-infra.
name: terraform-checks

on:
  workflow_call:
    inputs:
      roots:
        description: "Space-separated Terraform roots to validate."
        type: string
        default: "envs/preprod envs/prod"
      terraform-version:
        description: "Exact Terraform version; keep it inside the roots' required_version."
        type: string
        default: "1.16.6"

permissions:
  contents: read

env:
  CHECKOV_VERSION: 3.3.29

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate each root
        env:
          ROOTS: ${{ inputs.roots }}
        run: |
          for root in ${ROOTS}; do
            echo "== ${root}"
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

      - name: checkov
        run: uvx "checkov==${CHECKOV_VERSION}" --directory . --framework terraform --quiet --compact
