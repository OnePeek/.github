# Shared: Terraform checks (fmt, validate, tflint, checkov). Called by onepeek-infra.
name: terraform-checks

on:
  workflow_call:
    inputs:
      roots:
        description: "Space-separated Terraform roots to validate."
        type: string
        default: "envs/preprod envs/prod"
      terraform-version:
        description: "Exact Terraform version; keep it inside the roots' required_version."
        type: string
        default: "1.16.6"

permissions:
  contents: read

env:
  CHECKOV_VERSION: 3.3.29
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the test selection diffs against origin/<base branch>
          persist-credentials: false

      - name: Test selection script
        # The shared selection logic (scripts/tf_test_selection.py in OnePeek/.github, public), as the repo's other checks fetch it.
        run: git clone --quiet --depth 1 --branch main https://github.com/OnePeek/.github.git "${RUNNER_TEMP}/onepeek-shared"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Format
        run: terraform fmt -check -recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl', '**/versions.tf') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Validate each root
        env:
          ROOTS: ${{ inputs.roots }}
        run: |
          for root in ${ROOTS}; do
            echo "== ${root}"
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: Terraform tests (a module or root with a *.tftest.hcl)
        # Registry provider downloads only; no backend, no cloud credentials.
        # Pull requests into dev run only the suites the change reaches (scripts/tf_test_selection.py); release pull
        # requests, pushes and the schedule run them all.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          dirs=$(python3 "${RUNNER_TEMP}/onepeek-shared/scripts/tf_test_selection.py" --event "${EVENT_NAME}" --base-ref "${BASE_REF}" --diff-against "origin/${BASE_REF}")
          if [ -z "${dirs}" ]; then echo "No suite is reached by this change; terraform test skipped."; exit 0; fi
          while IFS= read -r d; do
            echo "== ${d}"
            terraform -chdir="${d}" init -backend=false -input=false
            terraform -chdir="${d}" test
          done <<< "${dirs}"

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

      - name: checkov
        run: uvx "checkov==${CHECKOV_VERSION}" --directory . --framework terraform --quiet --compact
