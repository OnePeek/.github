# Shared: Terraform checks (fmt, validate, tflint, checkov). Called by onepeek-infra.
name: terraform-checks

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      roots:
        description: "Space-separated Terraform roots to validate."
        type: string
        default: "envs/preprod envs/prod"
      terraform-version:
        description: "Exact Terraform version; keep it inside the roots' required_version."
        type: string
        default: "1.16.6"
      paths:
        description: "Newline-separated globs (delivery-pipelines section 9.1): on a pull_request run whose changed files match none of them, every step after the first is skipped and the job passes. Empty (the default), a push, a workflow_dispatch run, full true, a malformed glob or any detection error run everything. * and ? stop at /, ** crosses folders, **/ is zero or more folders."
        type: string
        default: ""

permissions:
  contents: read

env:
  CHECKOV_VERSION: 3.3.29
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  checks:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Path detection (the paths input, pull requests only; delivery-pipelines section 9.1)
        id: paths
        # scripts/path_detection.py verbatim (scripts/test_path_detection.py keeps the copies identical); runs only when the
        # caller passes paths. It never fails the job: any error says run (fail closed), and only run=false skips the
        # steps below, so the job always reports.
        if: inputs.paths != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          PATHS: ${{ inputs.paths }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }} # contents: read is enough for the compare API
        run: |
          cat > "$RUNNER_TEMP/path_detection.py" <<'PATHS_PY'
          """Job-level path detection: does this pull request change a file the caller's `paths` globs name? (delivery-pipelines §9.1)

          The first step of node-checks.yml, python-checks.yml and terraform-checks.yml runs a verbatim copy of this file (a test
          keeps the copies identical) when the caller passes `paths`. It writes `run=true` or `run=false` to $GITHUB_OUTPUT; the
          job's later steps run unless the output is exactly `false`, so the job always reports (green when skipped here).

          `paths` applies only to a `pull_request` run; the changed files are those of the pull request, compared from its base
          sha (`GET /repos/<repo>/compare/<base sha>...<head sha>`, contents: read). It says run (fail closed) on any other event
          (a push to dev, a workflow_dispatch run: certification), when `full` is true, when `paths` is empty, when `paths` is
          malformed (with a warning), when the shas are missing or the API or its answer fails, when the change lists no file,
          and when it lists 300 files or more (the API's cap: the list may be cut short). A renamed file counts by its old and its
          new name, a deleted file by its name.

          Globs, one per line (blank lines ignored, each line trimmed): `*` any characters but `/`, `?` one character but `/`,
          `**` any characters, `**/` zero or more folders; everything else is literal (spaces, `$`, `;`, quotes and the rest are
          plain characters: a glob is never given to a shell). `[`, `]`, `{`, `}`, `\\`, a leading `!` or `/`, a trailing `/`,
          `***`, a control character, a glob over 512 characters or more than 100 globs make `paths` malformed.
          It never fails the job: every error says run, and it always exits 0.
          """
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          FILE_CAP = 300  # the compare API lists at most 300 files: a list that long may be cut short
          MAX_GLOBS = 100
          MAX_GLOB_LEN = 512
          MAX_BODY = 64 * 1024 * 1024  # bytes read from the API answer
          TIMEOUT = 20  # seconds per request
          SHA = re.compile(r"[0-9a-f]{40}|[0-9a-f]{64}")
          REPO = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
          REFUSED = set("[]{}\\")


          class Malformed(ValueError):
              pass


          class DetectionError(Exception):
              pass


          def parse(text):
              """The globs of a `paths` input as token lists; [] when it is empty. Raises Malformed."""
              lines = [line.strip() for line in text.splitlines()]
              globs = [line for line in lines if line]
              if len(globs) > MAX_GLOBS:
                  raise Malformed(f"more than {MAX_GLOBS} globs")
              return [compile_glob(g, n) for n, g in enumerate(globs, 1)]


          def compile_glob(glob, n):
              """Tokens: ("lit", c), ("one",), ("star",), ("any",), ("dirs",)."""
              if len(glob) > MAX_GLOB_LEN:
                  raise Malformed(f"glob {n} is longer than {MAX_GLOB_LEN} characters")
              if any(ord(c) < 32 or ord(c) == 127 for c in glob):
                  raise Malformed(f"glob {n} holds a control character")
              if glob[0] in "!/" or glob.endswith("/"):
                  raise Malformed(f"glob {n} starts with ! or / or ends with /")
              if any(c in REFUSED for c in glob) or "***" in glob:
                  raise Malformed(f"glob {n} uses an unsupported pattern character")
              tokens, i = [], 0
              while i < len(glob):
                  if glob.startswith("**/", i):
                      tokens.append(("dirs",))
                      i += 3
                  elif glob.startswith("**", i):
                      tokens.append(("any",))
                      i += 2
                  elif glob[i] == "*":
                      tokens.append(("star",))
                      i += 1
                  elif glob[i] == "?":
                      tokens.append(("one",))
                      i += 1
                  else:
                      tokens.append(("lit", glob[i]))
                      i += 1
              return tokens


          def _closure(tokens, states):
              """Add the states reached without a character: past a `*` or `**`, and past a `**/` only before it took one."""
              out, todo = set(states), list(states)
              while todo:
                  i, inside = todo.pop()
                  if i < len(tokens) and not inside and tokens[i][0] in ("star", "any", "dirs") and (i + 1, False) not in out:
                      out.add((i + 1, False))
                      todo.append((i + 1, False))
              return out


          def matches(tokens, path):
              """True when the whole path matches the glob (a set-of-states walk: linear, no backtracking).

              A state is (token index, inside): inside is True once a `**/` has taken a character, so it can end only at a `/`."""
              states = _closure(tokens, {(0, False)})
              for c in path:
                  nxt = set()
                  for i, inside in states:
                      if i == len(tokens):
                          continue
                      kind = tokens[i][0]
                      if kind == "lit" and tokens[i][1] == c or kind == "one" and c != "/":
                          nxt.add((i + 1, False))
                      elif kind == "star" and c != "/" or kind == "any":
                          nxt.add((i, False))
                      elif kind == "dirs":
                          nxt.add((i, True))
                          if c == "/":
                              nxt.add((i + 1, False))
                  states = _closure(tokens, nxt)
                  if not states:
                      return False
              return (len(tokens), False) in states


          def changed_files(body):
              """The file names a compare answer lists (old and new name of a rename). Raises DetectionError."""
              try:
                  doc = json.loads(body)
              except (ValueError, UnicodeDecodeError) as e:
                  raise DetectionError(f"the compare answer is not JSON ({type(e).__name__})")
              files = doc.get("files") if isinstance(doc, dict) else None
              if not isinstance(files, list):
                  raise DetectionError("the compare answer has no files list")
              names = []
              for f in files:
                  if not isinstance(f, dict) or not isinstance(f.get("filename"), str) or not f["filename"]:
                      raise DetectionError("a compare entry has no filename")
                  names.append(f["filename"])
                  if f.get("status") == "renamed":
                      if not isinstance(f.get("previous_filename"), str) or not f["previous_filename"]:
                          raise DetectionError("a renamed entry has no previous_filename")
                      names.append(f["previous_filename"])
              return len(files), names


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def fetch_compare(api, repo, base, head, token):
              """The compare answer's bytes. Raises DetectionError."""
              if not api.startswith("https://") or not REPO.fullmatch(repo or "") or not token:
                  raise DetectionError("GITHUB_API_URL, GITHUB_REPOSITORY or the token is missing or odd")
              url = f"{api.rstrip('/')}/repos/{repo}/compare/{base}...{head}?per_page=1"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                                                         "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "onepeek-path-detection"})
              try:
                  with urllib.request.build_opener(_NoRedirect).open(req, timeout=TIMEOUT) as r:
                      if r.status != 200:
                          raise DetectionError(f"the compare API answered {r.status}")
                      body = r.read(MAX_BODY + 1)
              except urllib.error.HTTPError as e:
                  raise DetectionError(f"the compare API answered {e.code}")
              except (urllib.error.URLError, OSError, ValueError) as e:
                  raise DetectionError(f"the compare API could not be read ({type(e).__name__})")
              if len(body) > MAX_BODY:
                  raise DetectionError("the compare answer is too large")
              return body


          def decide(event, full, paths, base, head, fetch):
              """(run, reason, warning or None). `fetch(base, head)` returns the compare answer's bytes."""
              if event != "pull_request":
                  return True, f"paths is ignored on a {event or 'unknown'} run (certification and every other event run everything)", None
              if full not in ("", "false"):
                  return True, "paths is ignored when full is true", None
              try:
                  globs = parse(paths)
              except Malformed as e:
                  return True, "paths is malformed, so everything runs", f"paths is malformed ({e}): everything runs"
              if not globs:
                  return True, "paths is empty, so everything runs", None
              if not SHA.fullmatch(base or "") or not SHA.fullmatch(head or ""):
                  return True, "the pull request's base or head sha is missing, so everything runs", \
                      "path detection: the base or head sha is missing: everything runs"
              try:
                  count, names = changed_files(fetch(base, head))
              except DetectionError as e:
                  return True, "the changed files could not be read, so everything runs", f"path detection failed ({e}): everything runs"
              if count == 0:
                  return True, "the change lists no file, so everything runs", None
              if count >= FILE_CAP:
                  return True, f"the change lists {count} files (the API lists at most {FILE_CAP}), so everything runs", None
              hits = sum(1 for name in names if any(matches(g, name) for g in globs))
              if hits:
                  return True, f"{hits} of the {count} changed files match paths", None
              return False, f"none of the {count} changed files match paths, so the checks were skipped (the job passes)", None


          def main(env=None):
              env = os.environ if env is None else env
              run, reason, warning = True, "path detection did not finish, so everything runs", None
              try:
                  run, reason, warning = decide(
                      env.get("EVENT_NAME", ""), env.get("FULL", ""), env.get("PATHS", ""), env.get("BASE_SHA", ""), env.get("HEAD_SHA", ""),
                      lambda b, h: fetch_compare(env.get("GITHUB_API_URL", ""), env.get("GITHUB_REPOSITORY", ""), b, h, env.get("GH_TOKEN", "")))
              except Exception as e:
                  run, reason, warning = True, "path detection failed, so everything runs", f"path detection failed ({type(e).__name__}): everything runs"
              if warning:
                  print(f"::warning::{warning}", flush=True)
              print(f"path detection: {reason}", flush=True)
              for name, line in (("GITHUB_STEP_SUMMARY", f"Path detection: {reason}.\n"), ("GITHUB_OUTPUT", f"run={'true' if run else 'false'}\n")):
                  if env.get(name):
                      try:
                          with open(env[name], "a", encoding="utf-8") as f:
                              f.write(line)
                      except (OSError, ValueError):
                          print(f"path detection: {name} is not writable", file=sys.stderr)
              return 0


          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  pass
              sys.exit(0)
          PATHS_PY
          python3 -I "$RUNNER_TEMP/path_detection.py"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.paths.outputs.run != 'false'
        with:
          fetch-depth: 0 # the test selection diffs against origin/<base branch>
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.paths.outputs.run != 'false'
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.paths.outputs.run != 'false'
        with:
          tflint_version: v0.65.0 # foundation-playbook §8a P3; local_ci.py TFLINT_VERSION

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.paths.outputs.run != 'false'
        with:
          version: "0.12.0" # foundation-playbook §8a P3; local_ci.py UV_VERSION

      - name: Provider cache
        if: steps.paths.outputs.run != 'false'
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Format
        if: steps.paths.outputs.run != 'false'
        run: terraform fmt -check -recursive

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.paths.outputs.run != 'false'
        with:
          path: .terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl', '**/versions.tf') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Validate each root
        if: steps.paths.outputs.run != 'false'
        env:
          ROOTS: ${{ inputs.roots }}
        run: |
          for root in ${ROOTS}; do
            echo "== ${root}"
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: Terraform tests (a module or root with a *.tftest.hcl)
        if: steps.paths.outputs.run != 'false'
        # Registry provider downloads only; no backend, no cloud credentials.
        # Pull requests into dev run only the suites the change reaches (scripts/tf_test_selection.py, embedded verbatim below so it runs at the commit the caller pinned; a test keeps the copies identical); release pull
        # requests, pushes and the schedule run them all.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/tf_test_selection.py" <<'PY'
          """Choose which `terraform test` suites a pull request must run (used by .github/workflows/terraform-checks.yml).

          A suite is a directory with a `*.tftest.hcl` file: the folder above its `tests/` folder (any depth under tests/), else
          the folder holding the file. On a pull request into `dev` only the suites whose directory (or whose tests/) changed run,
          plus the suite of the AWS stack (stacks/aws) when the change could reach it: anything under stacks/aws, config/, policy/, scripts/ or
          modules/aws (any module may be consumed by the stack, so any module change counts). Release pull requests (base
          `release`), pushes and schedules run every suite.

            python3 tf_test_selection.py --event pull_request --base-ref dev --diff-against origin/dev   # one suite per line
          Prints nothing and exits 0 when no suite is selected; exits 1 when the repository has no suite at all.
          """
          from __future__ import annotations

          import argparse
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          STACK = "stacks/aws"
          STACK_TRIGGERS = ("stacks/aws", "config", "policy", "scripts", "modules/aws")


          def suite_dir(path: str) -> str:
              """The suite a *.tftest.hcl file belongs to."""
              p = PurePosixPath(path).parent
              parts = p.parts
              if "tests" in parts:
                  p = PurePosixPath(*parts[: parts.index("tests")]) if parts.index("tests") else PurePosixPath(".")
              return p.as_posix()


          def find_suites(root: Path) -> list[str]:
              found = {suite_dir(f.relative_to(root).as_posix()) for f in root.rglob("*.tftest.hcl") if ".terraform" not in f.parts}
              return sorted(found)


          def under(path: str, directory: str) -> bool:
              return directory == "." or path == directory or path.startswith(directory.rstrip("/") + "/")


          def select(suites: list[str], changed: list[str], event: str, base_ref: str) -> list[str]:
              """The suites to run. All of them unless this is a pull request into dev."""
              if event != "pull_request" or base_ref != "dev":
                  return sorted(suites)
              chosen = {s for s in suites if any(under(c, s) for c in changed)}
              if STACK in suites and any(under(c, t) for c in changed for t in STACK_TRIGGERS):
                  chosen.add(STACK)
              return sorted(chosen)


          def main(argv: list[str] | None = None) -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument("--event", required=True)
              ap.add_argument("--base-ref", default="")
              ap.add_argument("--diff-against", default="", help="git ref of the base branch, e.g. origin/dev")
              ap.add_argument("--root", default=".")
              args = ap.parse_args(argv)
              root = Path(args.root)
              suites = find_suites(root)
              if not suites:
                  print("no *.tftest.hcl found: this check would test nothing", file=sys.stderr)
                  return 1
              changed: list[str] = []
              if args.event == "pull_request" and args.base_ref == "dev":
                  if not args.diff_against:
                      print("--diff-against is required for a pull request into dev", file=sys.stderr)
                      return 1
                  out = subprocess.run(["git", "-C", str(root), "diff", "--name-only", args.diff_against, "HEAD"],
                                       check=True, capture_output=True, text=True).stdout
                  changed = [line for line in out.splitlines() if line]
              for s in select(suites, changed, args.event, args.base_ref):
                  print(s)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          dirs=$(python3 "${RUNNER_TEMP}/tf_test_selection.py" --event "${EVENT_NAME}" --base-ref "${BASE_REF}" --diff-against "origin/${BASE_REF}")
          if [ -z "${dirs}" ]; then echo "No suite is reached by this change; terraform test skipped."; exit 0; fi
          while IFS= read -r d; do
            echo "== ${d}"
            terraform -chdir="${d}" init -backend=false -input=false
            terraform -chdir="${d}" test
          done <<< "${dirs}"

      - name: tflint
        if: steps.paths.outputs.run != 'false'
        run: |
          tflint --init
          tflint --recursive

      - name: checkov
        if: steps.paths.outputs.run != 'false'
        run: uvx "checkov==${CHECKOV_VERSION}" --directory . --framework terraform --quiet --compact

      - name: Job usage (CPU, memory, disk and instance type, as a notice; S0 runner sizes)
        # Measurement only: scripts/job_usage.py verbatim (scripts/test_job_usage.py), never fails or slows the job.
        if: ${{ always() && runner.environment != 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          RUNNER_CLASS: fast
          RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          cat > "$RUNNER_TEMP/job_usage.py" <<'PY'
          """Job usage: one JSON line with what a job on our own runners used (S0 of the infra stabilization plan, runner sizes).

          Run as the last step of every shared-workflow job that can run on our runners (`if: always()`, continue-on-error).
          It reads the job's cgroup totals (no start step needed): CPU seconds (cgroup v2 cpu.stat usage_usec, else cgroup v1
          cpuacct.usage, else /proc/stat since boot), peak memory (memory.peak, else memory.max_usage_in_bytes), the job's wall
          time (from the start of the runner's per-job Runner.Worker process), average vCPU (CPU seconds over wall seconds),
          disk used on / and on the workspace's filesystem at job end, and the instance type (IMDSv2, link-local, 1 s budget).
          A value it cannot read is "unavailable" ("unknown" for the instance type). It prints `::notice::job-usage {json}` (read
          back from the job's annotations by the API, no artifact) and appends the JSON line to the step summary. It never fails
          the job: every read is guarded and it always exits 0. On GitHub-hosted runners it does nothing.
          Workflows run a verbatim copy of this file (scripts/test_job_usage.py keeps the copies identical).
          """
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.request

          NA = "unavailable"
          LIMIT = 65536  # bytes read from any one file
          IMDS = "http://169.254.169.254"
          IMDS_BUDGET = 1.0  # seconds for the whole instance-type lookup
          WORKER = "Runner.Worker"  # the runner's per-job process; its start is the job's start


          def _read(path):
              try:
                  with open(path, "rb") as f:
                      return f.read(LIMIT).decode("ascii")
              except (OSError, UnicodeDecodeError, ValueError):
                  return None


          def _int(text):
              try:
                  value = int(text.strip())
              except (AttributeError, ValueError):
                  return None
              return value if value >= 0 else None


          def cgroups(proc):
              """{"v2": path} or {controller: path} for cgroup v1, from <proc>/self/cgroup; {} when unreadable."""
              found = {}
              for line in (_read(os.path.join(proc, "self", "cgroup")) or "").splitlines():
                  parts = line.split(":", 2)
                  if len(parts) != 3 or not parts[2].startswith("/"):
                      continue
                  if parts[0] == "0" and parts[1] == "":
                      found["v2"] = parts[2]
                  for controller in parts[1].split(","):
                      if controller:
                          found[controller] = parts[2]
              return found


          def _under(sysfs, *parts):
              return os.path.join(sysfs, *[p.lstrip("/") for p in parts])


          def cpu_seconds(proc, sysfs, groups):
              """(seconds, source), or (NA, NA)."""
              if "v2" in groups:
                  for line in (_read(_under(sysfs, groups["v2"], "cpu.stat")) or "").splitlines():
                      key, _, value = line.partition(" ")
                      if key == "usage_usec" and _int(value) is not None:
                          return round(_int(value) / 1e6, 3), "cgroup"
              if "cpuacct" in groups:
                  value = _int(_read(_under(sysfs, "cpuacct", groups["cpuacct"], "cpuacct.usage")))
                  if value is not None:
                      return round(value / 1e9, 3), "cgroup_v1"
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  fields = line.split()
                  if fields[:1] == ["cpu"] and len(fields) >= 9:
                      ticks = [_int(fields[i]) for i in (1, 2, 3, 6, 7, 8)]  # user nice system irq softirq steal
                      if None not in ticks:
                          return round(sum(ticks) / os.sysconf("SC_CLK_TCK"), 3), "proc_stat_since_boot"
              return NA, NA


          def memory_peak(sysfs, groups):
              """(bytes, source), or (NA, NA)."""
              if "v2" in groups:
                  value = _int(_read(_under(sysfs, groups["v2"], "memory.peak")))
                  if value is not None:
                      return value, "cgroup"
              if "memory" in groups:
                  value = _int(_read(_under(sysfs, "memory", groups["memory"], "memory.max_usage_in_bytes")))
                  if value is not None:
                      return value, "cgroup_v1"
              return NA, NA


          def _stat(proc, pid):
              """(comm, ppid, starttime in clock ticks after boot) of a process, or None."""
              text = _read(os.path.join(proc, str(pid), "stat"))
              if not text or "(" not in text or ")" not in text:
                  return None
              comm = text[text.index("(") + 1:text.rindex(")")]
              fields = text[text.rindex(")") + 1:].split()
              if len(fields) < 20 or _int(fields[1]) is None or _int(fields[19]) is None:
                  return None
              return comm, _int(fields[1]), _int(fields[19])


          def wall_seconds(proc, now, pid):
              """Seconds since the nearest Runner.Worker ancestor started, or NA."""
              btime = None
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  if line.startswith("btime "):
                      btime = _int(line[6:])
              if btime is None:
                  return NA
              for _ in range(64):
                  info = _stat(proc, pid)
                  if info is None:
                      return NA
                  comm, ppid, start = info
                  if comm == WORKER:
                      wall = now - (btime + start / os.sysconf("SC_CLK_TCK"))
                      return round(wall, 1) if wall > 0 else NA
                  if ppid in (None, 0) or ppid == pid:
                      return NA
                  pid = ppid
              return NA


          def disk_used(path):
              try:
                  st = os.statvfs(path)
              except (OSError, TypeError, ValueError):
                  return NA
              return (st.f_blocks - st.f_bfree) * st.f_frsize


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def _imds(base, out):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), _NoRedirect)
              put = urllib.request.Request(base + "/latest/api/token", method="PUT",
                                           headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
              with opener.open(put, timeout=IMDS_BUDGET) as r:
                  token = r.read(256).decode("ascii").strip()
              get = urllib.request.Request(base + "/latest/meta-data/instance-type", headers={"X-aws-ec2-metadata-token": token})
              with opener.open(get, timeout=IMDS_BUDGET) as r:
                  value = r.read(64).decode("ascii").strip()
              if re.fullmatch(r"[a-z0-9-]+\.[a-z0-9]+", value):
                  out.append(value)


          def instance_type(base=IMDS, budget=IMDS_BUDGET):
              """The EC2 instance type, or "unknown" when IMDS is absent, slow, denied or odd (never more than `budget` s)."""
              out = []

              def run():
                  try:
                      _imds(base, out)
                  except Exception:
                      pass

              worker = threading.Thread(target=run, daemon=True)
              worker.start()
              worker.join(budget)
              return out[0] if out and not worker.is_alive() else "unknown"


          def collect(env, proc="/proc", sysfs="/sys/fs/cgroup", imds=IMDS, now=None, pid=None):
              now = time.time() if now is None else now
              groups = cgroups(proc)
              cpu, cpu_source = cpu_seconds(proc, sysfs, groups)
              mem, mem_source = memory_peak(sysfs, groups)
              wall = wall_seconds(proc, now, os.getpid() if pid is None else pid)
              avg = round(cpu / wall, 3) if isinstance(cpu, float) and isinstance(wall, float) and wall > 0 else NA
              return {
                  "repo": env.get("GITHUB_REPOSITORY", NA),
                  "job": env.get("GITHUB_JOB", NA),
                  "runner_class": env.get("RUNNER_CLASS", NA),
                  "runner_input": env.get("RUNNER_INPUT", NA),
                  "runner_name": env.get("RUNNER_NAME", NA),
                  "instance_type": instance_type(imds),
                  "wall_s": wall,
                  "cpu_s": cpu,
                  "cpu_source": cpu_source,
                  "avg_vcpu": avg,
                  "mem_peak_bytes": mem,
                  "mem_source": mem_source,
                  "disk_used_root_bytes": disk_used("/"),
                  "disk_used_workspace_bytes": disk_used(env.get("GITHUB_WORKSPACE")) if env.get("GITHUB_WORKSPACE") else NA,
                  "cgroup": groups.get("v2", groups.get("memory", NA)),
              }


          def main(env=None, **kwargs):
              env = os.environ if env is None else env
              if env.get("RUNNER_ENVIRONMENT") == "github-hosted":
                  return 0
              line = json.dumps(collect(env, **kwargs), sort_keys=True, separators=(",", ":"))
              print("::notice::job-usage " + line.replace("%", "%25"), flush=True)
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as f:
                          f.write(line + "\n")
                  except (OSError, ValueError):
                      print("job-usage: the step summary is not writable", file=sys.stderr)
              return 0


          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  pass
              sys.exit(0)
          PY
          python3 -I "$RUNNER_TEMP/job_usage.py"
