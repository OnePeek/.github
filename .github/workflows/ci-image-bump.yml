# Shared, weekly: move the digest-pinned CI container images (`image: <name>@sha256:<digest> # <tag>` in the caller's
# workflows) to the tag's current digest and open one pull request (foundation-playbook §12a slice 4 item 4). A caller
# runs it on a weekly `schedule`. Registry access is read-only and anonymous: the script holds no registry credential,
# and the step that runs it gets no token.
# Every change is to a workflow file, which GITHUB_TOKEN can never push (it has no `workflows` permission) and the
# agents' App must not (it stays read-only). So the push and the pull request use the onepeek-ci-bump GitHub App
# (onepeek-docs decision recorded in PR #183) when the caller passes CI_BUMP_APP_ID and CI_BUMP_APP_PRIVATE_KEY (a token for
# this repo only, with contents, pull requests and workflows write); without them the job still finds and lists the
# moves (and fails on a tag it cannot resolve or a pinned line it cannot move), and skips the push with a notice.
# The job's own GITHUB_TOKEN stays read-only. The script is a verbatim copy of scripts/bump_ci_images.py (a test keeps
# them identical).
name: ci-image-bump

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      base:
        description: "The branch the pull request targets (the repo's integration branch)."
        type: string
        default: dev
    secrets:
      CI_BUMP_APP_ID:
        description: "The CI bump GitHub App's ID (or client ID). Optional: without it and the key, nothing is pushed."
        required: false
      CI_BUMP_APP_PRIVATE_KEY:
        description: "The CI bump GitHub App's private key. Optional, with CI_BUMP_APP_ID."
        required: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false

      - name: Resolve each tag's current digest (anonymous, read-only) and rewrite the workflows
        run: |
          cat > "$RUNNER_TEMP/bump.py" <<'PY'
          """Move digest-pinned CI container images to their tag's current digest (foundation-playbook §12a slice 4 item 4).

          A CI image is written `image: <name>@sha256:<64 hex> # <tag>` (or `container: ...` as a string), in a workflow under
          .github/workflows; the comment's first word is the tag (`17`, or `postgres:17`: the part after the last colon). For each
          one this asks the registry for the tag's current digest and rewrites the line when it moved. Registry access is read-only
          and anonymous (a pull token, a manifest GET); no credentials are used or needed for the public registries CI containers
          come from (public.ecr.aws). A tag the registry cannot resolve is an error, never a skip, and so is a pinned line this
          cannot move (an `image:`/`container:` line naming `@sha256:` that is not in the form above, such as one with no tag
          comment). A `:tag` written in the name (`mongo:7@sha256:...`) is dropped before the registry is asked: the digest names
          the image, the comment names the tag.

          Usage: bump_ci_images.py [--check] [ROOT]   (--check lists what would move and exits 1 if anything would; default rewrites)
          Prints one `file:line: <name> <tag> <old> -> <new>` line per move.
          """
          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Callable

          LINE = re.compile(
              r"^(?P<head>\s*(?:-\s*)?(?:image|container):\s*)(?P<q>['\"]?)(?P<name>[^\s'\"@#]+)@(?P<digest>sha256:[0-9a-f]{64})(?P=q)"
              r"(?P<gap>\s+)#\s*(?P<comment>.*?)\s*$")
          ACCEPT = ", ".join([
              "application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"])
          PINNED = re.compile(r"^\s*(?:-\s*)?(?:image|container):.*@sha256:")  # a pinned line: it must match LINE
          Resolver = Callable[[str, str], str]  # (name, tag) -> "sha256:<64 hex>"


          def tag_of(comment: str) -> str | None:
              word = comment.split()[0] if comment.split() else ""
              tag = word.rsplit(":", 1)[-1]
              return tag or None


          def repository(name: str) -> str:
              """The name without a `:tag` in its last path part (a registry host's `:port` stays)."""
              head, slash, last = name.rpartition("/")
              return f"{head}{slash}{last.split(':', 1)[0]}"


          def split_name(name: str) -> tuple[str, str]:
              """(registry host, repository path); a name with no host is Docker Hub."""
              first, _, rest = name.partition("/")
              if rest and ("." in first or ":" in first or first == "localhost"):
                  return first, rest
              return "registry-1.docker.io", (name if "/" in name else f"library/{name}")


          def _bearer(header: str) -> dict[str, str]:
              return dict(re.findall(r'(\w+)="([^"]*)"', header))


          def registry_digest(name: str, tag: str) -> str:
              """The digest a tag points at, from the Docker-Content-Digest header of an anonymous manifest request."""
              host, repo = split_name(name)
              url = f"https://{host}/v2/{repo}/manifests/{tag}"
              token = None
              for _ in range(2):
                  req = urllib.request.Request(url, method="HEAD", headers={"Accept": ACCEPT})
                  if token:
                      req.add_header("Authorization", f"Bearer {token}")
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          digest = resp.headers.get("Docker-Content-Digest", "")
                          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                              raise RuntimeError(f"{name}:{tag}: the registry sent no digest")
                          return digest
                  except urllib.error.HTTPError as e:
                      challenge = e.headers.get("WWW-Authenticate", "")
                      if e.code != 401 or token or not challenge.lower().startswith("bearer"):
                          raise RuntimeError(f"{name}:{tag}: registry answered {e.code}") from e
                      c = _bearer(challenge)
                      query = "&".join(f"{k}={v}" for k, v in (("service", c.get("service")), ("scope", c.get("scope"))) if v)
                      with urllib.request.urlopen(f"{c['realm']}?{query}", timeout=30) as tr:  # anonymous: no credentials sent
                          body = json.load(tr)
                      token = body.get("token") or body.get("access_token")
              raise RuntimeError(f"{name}:{tag}: no digest")


          def bump_file(path: Path, resolve: Resolver, write: bool) -> list[str]:
              moved: list[str] = []
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              for n, raw in enumerate(lines, 1):
                  m = LINE.match(raw.rstrip("\r\n"))
                  if not m:
                      if PINNED.match(raw):
                          raise RuntimeError(f"{path}:{n}: a digest-pinned image this cannot move: write it "
                                             "`image: <name>@sha256:<64 hex> # <tag>` on one line")
                      continue
                  tag = tag_of(m["comment"])
                  if tag is None:
                      raise RuntimeError(f"{path}:{n}: the comment after the digest must start with the tag")
                  new = resolve(repository(m["name"]), tag)
                  if new != m["digest"]:
                      moved.append(f"{path}:{n}: {m['name']} {tag} {m['digest']} -> {new}")
                      lines[n - 1] = raw.replace(m["digest"], new, 1)
              if moved and write:
                  path.write_text("".join(lines), encoding="utf-8")
              return moved


          def bump(root: Path, resolve: Resolver, write: bool = True) -> list[str]:
              moved: list[str] = []
              workflows = root / ".github/workflows"
              for p in sorted([*workflows.glob("*.yml"), *workflows.glob("*.yaml")]):
                  moved += bump_file(p, resolve, write)
              return moved


          def main(argv: list[str] | None = None) -> int:
              ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              ap.add_argument("--check", action="store_true")
              ap.add_argument("root", nargs="?", type=Path, default=Path("."))
              a = ap.parse_args(argv)
              try:
                  moved = bump(a.root, registry_digest, write=not a.check)
              except (RuntimeError, urllib.error.URLError, OSError) as e:
                  print(f"::error::{e}")
                  return 1
              for line in moved:
                  print(line)
              if not moved:
                  print("ci images: all digests are current")
              return 1 if (moved and a.check) else 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 "$RUNNER_TEMP/bump.py" . | tee "$RUNNER_TEMP/moves.txt"

      - name: The CI bump App's secrets are set
        id: has-app
        env:
          HAS_APP: ${{ secrets.CI_BUMP_APP_ID != '' && secrets.CI_BUMP_APP_PRIVATE_KEY != '' }}
        run: |
          echo "app=${HAS_APP}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_APP}" != "true" ] && ! git diff --quiet; then
            echo "::notice::CI_BUMP_APP_ID and CI_BUMP_APP_PRIVATE_KEY are not passed, so these moves are not pushed:"
            sed 's/^/::notice::/' "$RUNNER_TEMP/moves.txt"
            { echo "CI image moves found but not pushed (no CI bump App secrets):"; echo; sed 's/^/- /' "$RUNNER_TEMP/moves.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: The CI bump App's token (this repo only; contents, pull requests and workflows write)
        id: app
        if: ${{ steps.has-app.outputs.app == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CI_BUMP_APP_ID }}
          private-key: ${{ secrets.CI_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open the pull request
        if: ${{ steps.has-app.outputs.app == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          BASE: ${{ inputs.base }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "Every CI image digest is current."
            exit 0
          fi
          branch="ci-image-bump"
          gh auth setup-git   # git uses gh as its credential helper: the token is never in a URL or an argument
          bot_id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)   # the commit is the App's own bot user
          git config user.name "${SLUG}[bot]"
          git config user.email "${bot_id}+${SLUG}[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add .github/workflows
          git commit -q -m "ci: move the CI container image digests to their tags' current digests"
          git push --force origin "${branch}"
          if [ -z "$(gh pr list --repo "${REPO}" --head "${branch}" --base "${BASE}" --state open --json number --jq '.[].number')" ]; then
            {
              echo "The weekly CI image bump (foundation-playbook §12a slice 4 item 4). Each digest-pinned \`image:\` moved to the current digest of the tag in its comment:"
              echo
              sed 's/^/- /' "$RUNNER_TEMP/moves.txt"
            } > "$RUNNER_TEMP/body.md"
            gh pr create --repo "${REPO}" --base "${BASE}" --head "${branch}" \
              --title "ci: weekly CI image digest bump" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Job usage (CPU, memory, disk and instance type, as a notice; S0 runner sizes)
        # Measurement only: scripts/job_usage.py verbatim (scripts/test_job_usage.py), never fails or slows the job.
        if: ${{ always() && runner.environment != 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          RUNNER_CLASS: light
          RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          cat > "$RUNNER_TEMP/job_usage.py" <<'PY'
          """Job usage: one JSON line with what a job on our own runners used (S0 of the infra stabilization plan, runner sizes).

          Run as the last step of every shared-workflow job that can run on our runners (`if: always()`, continue-on-error).
          It reads the job's cgroup totals (no start step needed): CPU seconds (cgroup v2 cpu.stat usage_usec, else cgroup v1
          cpuacct.usage, else /proc/stat since boot), peak memory (memory.peak, else memory.max_usage_in_bytes), the job's wall
          time (from the start of the runner's per-job Runner.Worker process), average vCPU (CPU seconds over wall seconds),
          disk used on / and on the workspace's filesystem at job end, and the instance type (IMDSv2, link-local, 1 s budget).
          A value it cannot read is "unavailable" ("unknown" for the instance type). It prints `::notice::job-usage {json}` (read
          back from the job's annotations by the API, no artifact) and appends the JSON line to the step summary. It never fails
          the job: every read is guarded and it always exits 0. On GitHub-hosted runners it does nothing.
          Workflows run a verbatim copy of this file (scripts/test_job_usage.py keeps the copies identical).
          """
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.request

          NA = "unavailable"
          LIMIT = 65536  # bytes read from any one file
          IMDS = "http://169.254.169.254"
          IMDS_BUDGET = 1.0  # seconds for the whole instance-type lookup
          WORKER = "Runner.Worker"  # the runner's per-job process; its start is the job's start


          def _read(path):
              try:
                  with open(path, "rb") as f:
                      return f.read(LIMIT).decode("ascii")
              except (OSError, UnicodeDecodeError, ValueError):
                  return None


          def _int(text):
              try:
                  value = int(text.strip())
              except (AttributeError, ValueError):
                  return None
              return value if value >= 0 else None


          def cgroups(proc):
              """{"v2": path} or {controller: path} for cgroup v1, from <proc>/self/cgroup; {} when unreadable."""
              found = {}
              for line in (_read(os.path.join(proc, "self", "cgroup")) or "").splitlines():
                  parts = line.split(":", 2)
                  if len(parts) != 3 or not parts[2].startswith("/"):
                      continue
                  if parts[0] == "0" and parts[1] == "":
                      found["v2"] = parts[2]
                  for controller in parts[1].split(","):
                      if controller:
                          found[controller] = parts[2]
              return found


          def _under(sysfs, *parts):
              return os.path.join(sysfs, *[p.lstrip("/") for p in parts])


          def cpu_seconds(proc, sysfs, groups):
              """(seconds, source), or (NA, NA)."""
              if "v2" in groups:
                  for line in (_read(_under(sysfs, groups["v2"], "cpu.stat")) or "").splitlines():
                      key, _, value = line.partition(" ")
                      if key == "usage_usec" and _int(value) is not None:
                          return round(_int(value) / 1e6, 3), "cgroup"
              if "cpuacct" in groups:
                  value = _int(_read(_under(sysfs, "cpuacct", groups["cpuacct"], "cpuacct.usage")))
                  if value is not None:
                      return round(value / 1e9, 3), "cgroup_v1"
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  fields = line.split()
                  if fields[:1] == ["cpu"] and len(fields) >= 9:
                      ticks = [_int(fields[i]) for i in (1, 2, 3, 6, 7, 8)]  # user nice system irq softirq steal
                      if None not in ticks:
                          return round(sum(ticks) / os.sysconf("SC_CLK_TCK"), 3), "proc_stat_since_boot"
              return NA, NA


          def memory_peak(sysfs, groups):
              """(bytes, source), or (NA, NA)."""
              if "v2" in groups:
                  value = _int(_read(_under(sysfs, groups["v2"], "memory.peak")))
                  if value is not None:
                      return value, "cgroup"
              if "memory" in groups:
                  value = _int(_read(_under(sysfs, "memory", groups["memory"], "memory.max_usage_in_bytes")))
                  if value is not None:
                      return value, "cgroup_v1"
              return NA, NA


          def _stat(proc, pid):
              """(comm, ppid, starttime in clock ticks after boot) of a process, or None."""
              text = _read(os.path.join(proc, str(pid), "stat"))
              if not text or "(" not in text or ")" not in text:
                  return None
              comm = text[text.index("(") + 1:text.rindex(")")]
              fields = text[text.rindex(")") + 1:].split()
              if len(fields) < 20 or _int(fields[1]) is None or _int(fields[19]) is None:
                  return None
              return comm, _int(fields[1]), _int(fields[19])


          def wall_seconds(proc, now, pid):
              """Seconds since the nearest Runner.Worker ancestor started, or NA."""
              btime = None
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  if line.startswith("btime "):
                      btime = _int(line[6:])
              if btime is None:
                  return NA
              for _ in range(64):
                  info = _stat(proc, pid)
                  if info is None:
                      return NA
                  comm, ppid, start = info
                  if comm == WORKER:
                      wall = now - (btime + start / os.sysconf("SC_CLK_TCK"))
                      return round(wall, 1) if wall > 0 else NA
                  if ppid in (None, 0) or ppid == pid:
                      return NA
                  pid = ppid
              return NA


          def disk_used(path):
              try:
                  st = os.statvfs(path)
              except (OSError, TypeError, ValueError):
                  return NA
              return (st.f_blocks - st.f_bfree) * st.f_frsize


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def _imds(base, out):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), _NoRedirect)
              put = urllib.request.Request(base + "/latest/api/token", method="PUT",
                                           headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
              with opener.open(put, timeout=IMDS_BUDGET) as r:
                  token = r.read(256).decode("ascii").strip()
              get = urllib.request.Request(base + "/latest/meta-data/instance-type", headers={"X-aws-ec2-metadata-token": token})
              with opener.open(get, timeout=IMDS_BUDGET) as r:
                  value = r.read(64).decode("ascii").strip()
              if re.fullmatch(r"[a-z0-9-]+\.[a-z0-9]+", value):
                  out.append(value)


          def instance_type(base=IMDS, budget=IMDS_BUDGET):
              """The EC2 instance type, or "unknown" when IMDS is absent, slow, denied or odd (never more than `budget` s)."""
              out = []

              def run():
                  try:
                      _imds(base, out)
                  except Exception:
                      pass

              worker = threading.Thread(target=run, daemon=True)
              worker.start()
              worker.join(budget)
              return out[0] if out and not worker.is_alive() else "unknown"


          def collect(env, proc="/proc", sysfs="/sys/fs/cgroup", imds=IMDS, now=None, pid=None):
              now = time.time() if now is None else now
              groups = cgroups(proc)
              cpu, cpu_source = cpu_seconds(proc, sysfs, groups)
              mem, mem_source = memory_peak(sysfs, groups)
              wall = wall_seconds(proc, now, os.getpid() if pid is None else pid)
              avg = round(cpu / wall, 3) if isinstance(cpu, float) and isinstance(wall, float) and wall > 0 else NA
              return {
                  "repo": env.get("GITHUB_REPOSITORY", NA),
                  "job": env.get("GITHUB_JOB", NA),
                  "runner_class": env.get("RUNNER_CLASS", NA),
                  "runner_input": env.get("RUNNER_INPUT", NA),
                  "runner_name": env.get("RUNNER_NAME", NA),
                  "instance_type": instance_type(imds),
                  "wall_s": wall,
                  "cpu_s": cpu,
                  "cpu_source": cpu_source,
                  "avg_vcpu": avg,
                  "mem_peak_bytes": mem,
                  "mem_source": mem_source,
                  "disk_used_root_bytes": disk_used("/"),
                  "disk_used_workspace_bytes": disk_used(env.get("GITHUB_WORKSPACE")) if env.get("GITHUB_WORKSPACE") else NA,
                  "cgroup": groups.get("v2", groups.get("memory", NA)),
              }


          def main(env=None, **kwargs):
              env = os.environ if env is None else env
              if env.get("RUNNER_ENVIRONMENT") == "github-hosted":
                  return 0
              line = json.dumps(collect(env, **kwargs), sort_keys=True, separators=(",", ":"))
              print("::notice::job-usage " + line.replace("%", "%25"), flush=True)
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as f:
                          f.write(line + "\n")
                  except (OSError, ValueError):
                      print("job-usage: the step summary is not writable", file=sys.stderr)
              return 0


          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  pass
              sys.exit(0)
          PY
          python3 -I "$RUNNER_TEMP/job_usage.py"
