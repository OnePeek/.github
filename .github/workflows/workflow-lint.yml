# This repo's own check: lint the shared workflows with actionlint, and scan for secrets.
name: workflow-lint

on:
  push:
    branches: [dev]  # depends-on passes at once with no pull request (its notice); the pins job holds the docs ancestor rule on push
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]  # never edited: ship_change_set.py re-runs checks when a dependency merges

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256_A: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  # x64 (amd64)
  ACTIONLINT_SHA256_B: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6  # arm64

jobs:
  depends-on:
    # Dependencies first (playbook §8a P1, L26/L27): while a `Depends on:` pull request is unmerged, nothing else runs.
    uses: ./.github/workflows/depends-on.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      AGENTS_APP_CLIENT_ID: ${{ secrets.AGENTS_APP_CLIENT_ID }}
      AGENTS_APP_PRIVATE_KEY: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}

  actionlint:
    needs: depends-on
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the install step may retry for up to 5 minutes (F125)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the verified actionlint archive (the checksum is checked again on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-tools/actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.arch }}-${{ env.ACTIONLINT_SHA256_A }}-${{ env.ACTIONLINT_SHA256_B }}

      - name: Install actionlint (pinned, checksum verified)
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
          SHA256_A: ${{ env.ACTIONLINT_SHA256_A }}
          SHA256_B: ${{ env.ACTIONLINT_SHA256_B }}
        run: |
          case "${RUNNER_ARCH}" in
            X64) asset=linux_amd64; sha="${SHA256_A}" ;;
            ARM64) asset=linux_arm64; sha="${SHA256_B}" ;;
            *) echo "::error::Unsupported runner architecture ${RUNNER_ARCH}."; exit 1 ;;
          esac
          dir="${RUNNER_TEMP}/release-tools/actionlint"; mkdir -p "${dir}"
          archive="${dir}/actionlint_${VERSION}_${asset}.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_${asset}.tar.gz"
          # A cached archive is never trusted: it is checked like a fresh download, and a bad one is discarded (F125).
          if [ -f "${archive}" ] && ! echo "${sha}  ${archive}" | sha256sum -c --quiet -; then
            echo "::warning::The cached actionlint archive failed its checksum; discarding it."
            rm -f "${archive}"
          fi
          if [ ! -f "${archive}" ]; then
            # Retries with a delay ride out a download-host outage (504 for two hours: F125); the checksum below still decides.
            if ! curl -sSfL --connect-timeout 15 --max-time 90 --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 300 -o "${archive}.part" "${url}"; then
              rm -f "${archive}.part"
              echo "::error::Could not download actionlint from github.com after retries (${url})."
              exit 1
            fi
            mv "${archive}.part" "${archive}"
          fi
          if ! echo "${sha}  ${archive}" | sha256sum -c -; then
            rm -f "${archive}"
            echo "::error::The actionlint archive does not match its pinned SHA-256; not using it."
            exit 1
          fi
          tar -xzf "${archive}" actionlint

      - name: Lint workflows
        run: ./actionlint -color

  secrets:
    needs: depends-on
    uses: ./.github/workflows/secret-scan.yml

  zizmor:
    needs: depends-on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security lint of the workflows
        run: pip install --quiet zizmor==1.31.1 && zizmor --no-progress --min-severity medium .github/workflows

  runner-labels:
    needs: depends-on
    # ci-runners.md section 5.4: where jobs may run (the rules, with a fixture each, are in scripts/test_check_runner_labels.py).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner label rules (public repo)
        run: |
          pip install --quiet pyyaml==6.0.3
          python scripts/check_runner_labels.py --kind public --repo OnePeek/.github \
            --list .github/workflow-lint/github-only-jobs.yaml .github/workflows

  pins:
    needs: depends-on
    # The shared pin check runs here too (this repo has no pins and no docs-version.txt, so it proves the workflow runs).
    uses: ./.github/workflows/pins.yml

  service-list:
    needs: depends-on
    # operate.yml's service choices must equal the services file; the render function must match release-ecs.yml; the
    # release-lock waits fit the runners' lifetimes (scripts/check_lock_limits.py).
    # local_ci.py runs the last step too (playbook §8a P5), with onepeek-infra at origin/dev as _infra.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The agents' App secrets are passed
        id: tokens
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY are not both set in this repo: the drift check against the services file cannot run (playbook §8a S6). Add the App secrets."
            exit 1
          fi
      - name: The agents' GitHub App token (Contents read on onepeek-infra)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: onepeek-infra
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/onepeek-infra
          ref: dev
          token: ${{ steps.app.outputs.token }}
          path: _infra
          persist-credentials: false
      - name: Tests, then the drift check
        run: |
          pip install --quiet pyyaml==6.0.3
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_service_list.py --services-file _infra/config/services.preprod.yaml
          # The release-lock waits against the reaper lifetimes in onepeek-infra's config/ci.yaml (playbook §5.4a limits test).
          python scripts/check_lock_limits.py --infra-config _infra/config/ci.yaml
