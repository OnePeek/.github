# This repo's own check: lint the shared workflows with actionlint, and scan for secrets. The checks that run under a
# minute are steps of one job, `lint` (decision 180; onepeek-docs architecture/lld/infra/delivery-pipelines.md §9.1
# "Tiny jobs merged"; orchestrator rulings R-S2i-1 and R-S2i-5, provisional, 2026-11-10): every step runs even when
# an earlier one failed (`if: always()`), the last step writes each check's result to the job summary and fails the
# job when any check failed. The secrets scan and the pin check are the same composite actions (actions/) that
# secret-scan.yml, pins.yml and fast-checks.yml run. No depends-on job: the merge tool (vanguard ship) reads a
# `Depends on:` line itself (PIPE-SIMPLE v2 DOC-3). The `fast` job calls fast-checks.yml locally, so every change
# here proves the shared merged job end to end. The `ready` job (ready.yml, called locally, shown as `ci / ready`) is
# the summary every job ends in (PIPE-SIMPLE v2 D6), proving it end to end.
name: workflow-lint

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]  # never edited: a body edit is not a code change

# Cancel a superseded run only for a pull request, never a push to dev (decision 180; delivery-pipelines.md §9.1
# "Cancel only pull-request runs", orchestrator ruling R-S2i-3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256_A: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  # x64 (amd64)
  ACTIONLINT_SHA256_B: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6  # arm64

jobs:
  lint:
    # GitHub-hosted (this repo is public). The limit: actionlint 10 (its install may retry for up to 5 minutes, F125),
    # gitleaks 10 (the same), zizmor, runner labels, pins and the service list 5 each, less the boots they no longer pay.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The full history: gitleaks scans the pull request's commits.
      - name: This repo
        id: repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache the verified actionlint archive (the checksum is checked again on every use)
        if: ${{ always() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-tools/actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.arch }}-${{ env.ACTIONLINT_SHA256_A }}-${{ env.ACTIONLINT_SHA256_B }}

      - name: Install actionlint (pinned, checksum verified)
        id: actionlint-install
        if: ${{ always() }}
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
          SHA256_A: ${{ env.ACTIONLINT_SHA256_A }}
          SHA256_B: ${{ env.ACTIONLINT_SHA256_B }}
        run: |
          case "${RUNNER_ARCH}" in
            X64) asset=linux_amd64; sha="${SHA256_A}" ;;
            ARM64) asset=linux_arm64; sha="${SHA256_B}" ;;
            *) echo "::error::Unsupported runner architecture ${RUNNER_ARCH}."; exit 1 ;;
          esac
          dir="${RUNNER_TEMP}/release-tools/actionlint"; mkdir -p "${dir}"
          archive="${dir}/actionlint_${VERSION}_${asset}.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_${asset}.tar.gz"
          # A cached archive is never trusted: it is checked like a fresh download, and a bad one is discarded (F125).
          if [ -f "${archive}" ] && ! echo "${sha}  ${archive}" | sha256sum -c --quiet -; then
            echo "::warning::The cached actionlint archive failed its checksum; discarding it."
            rm -f "${archive}"
          fi
          if [ ! -f "${archive}" ]; then
            # Retries with a delay ride out a download-host outage (504 for two hours: F125); the checksum below still decides.
            if ! curl -sSfL --connect-timeout 15 --max-time 90 --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 300 -o "${archive}.part" "${url}"; then
              rm -f "${archive}.part"
              echo "::error::Could not download actionlint from github.com after retries (${url})."
              exit 1
            fi
            mv "${archive}.part" "${archive}"
          fi
          if ! echo "${sha}  ${archive}" | sha256sum -c -; then
            rm -f "${archive}"
            echo "::error::The actionlint archive does not match its pinned SHA-256; not using it."
            exit 1
          fi
          tar -xzf "${archive}" actionlint

      - name: Lint workflows
        id: actionlint
        if: ${{ always() && steps.actionlint-install.outcome == 'success' }}
        run: ./actionlint -color

      - name: Secrets scan (gitleaks)
        id: secrets
        if: ${{ always() }}
        uses: ./actions/gitleaks

      - name: Security lint of the workflows and the composite actions
        id: zizmor
        if: ${{ always() }}
        run: pip install --quiet zizmor==1.31.1 && zizmor --no-progress --min-severity medium .github/workflows actions

      # ci-runners.md section 5.4: where jobs may run (the rules, with a fixture each, are in scripts/test_check_runner_labels.py).
      - name: Runner label rules (public repo)
        id: runner-labels
        if: ${{ always() }}
        run: |
          pip install --quiet pyyaml==6.0.3
          python scripts/check_runner_labels.py --kind public --repo OnePeek/.github \
            --list .github/workflow-lint/github-only-jobs.yaml .github/workflows

      # The shared pin check runs here too (this repo has no pins and no docs-version.txt, so it proves the action runs).
      - name: Pins
        id: pins
        if: ${{ always() }}
        uses: ./actions/pins

      # operate.yml's service choices must equal the services file; the render function must match release-ecs.yml; the
      # release-lock waits fit the runners' lifetimes (scripts/check_lock_limits.py).
      # local_ci.py runs the last step too (playbook §8a P5), with onepeek-infra at origin/dev as _infra.
      - name: The agents' App secrets are passed
        id: tokens
        if: ${{ always() }}
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY are not both set in this repo: the drift check against the services file cannot run (playbook §8a S6). Add the App secrets."
            exit 1
          fi
      - name: The agents' GitHub App token (Contents read on onepeek-infra)
        id: app
        if: ${{ always() && steps.tokens.outcome == 'success' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: onepeek-infra
          permission-contents: read
      - name: onepeek-infra at dev (_infra)
        id: infra
        if: ${{ always() && steps.app.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/onepeek-infra
          ref: dev
          token: ${{ steps.app.outputs.token }}
          path: _infra
          persist-credentials: false
      - name: Tests, then the drift check
        id: service-list
        if: ${{ always() && steps.infra.outcome == 'success' }}
        run: |
          pip install --quiet pyyaml==6.0.3
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_service_list.py --services-file _infra/config/services.preprod.yaml
          # The release-lock waits against the reaper lifetimes in onepeek-infra's config/ci.yaml (playbook §5.4a limits test).
          python scripts/check_lock_limits.py --infra-config _infra/config/ci.yaml
          # settled()'s plan-relevant paths against the filter in onepeek-infra's plan.yml, both ways (playbook §5.4a drift check).
          python scripts/release_order.py check-paths --infra-plan _infra/.github/workflows/plan.yml

      # One line per check: <name>|<wanted: true, false or excused>|<the outcomes of its steps, comma-separated>.
      # Runs whatever happened before (always()); it reads only step outcomes, never an output or a secret.
      - name: Results (each check's result in the summary; fails when any check failed)
        if: ${{ always() }}
        env:
          RESULTS: |
            setup|true|${{ steps.repo.outcome }}
            actionlint|true|${{ steps.actionlint-install.outcome }},${{ steps.actionlint.outcome }}
            secrets|true|${{ steps.secrets.outcome }}
            zizmor|true|${{ steps.zizmor.outcome }}
            runner-labels|true|${{ steps.runner-labels.outcome }}
            pins|true|${{ steps.pins.outcome }}
            service-list|true|${{ steps.tokens.outcome }},${{ steps.app.outcome }},${{ steps.infra.outcome }},${{ steps.service-list.outcome }}
        run: |
          # scripts/test_fast_checks.py runs this script; workflow-lint.yml's lint job holds the same copy (a test keeps them equal).
          fail=0
          wanted=0
          table="| check | result |"$'\n'"|---|---|"
          while IFS='|' read -r name want outcomes; do
            [ -n "${name}" ] || continue
            if [ "${want}" = false ]; then
              result="not requested"
            else
              [ "${name}" = setup ] || wanted=$((wanted + 1))
              result=success
              IFS=',' read -ra each <<< "${outcomes}"
              [ "${#each[@]}" -gt 0 ] || result="not run"
              for o in "${each[@]}"; do
                case "${o}" in
                  success) ;;
                  failure) result=failed ;;
                  *) [ "${result}" = failed ] || result="not run (${o:-no outcome})" ;;
                esac
              done
              if [ "${want}" = excused ] && [ "${result}" != failed ] && [ "${result}" != success ]; then
                result="skipped: a dev -> release promotion pull request (tree-only, certified on the push to dev, delivery-pipelines.md §8.1)"
              elif [ "${result}" != success ]; then
                fail=1
              fi
            fi
            table="${table}"$'\n'"| ${name} | ${result} |"
          done <<< "${RESULTS}"
          if [ "${wanted}" -eq 0 ]; then
            fail=1
            table="${table}"$'\n'"| (none) | failed: no check was requested |"
            echo "::error::No check was requested: turn on at least one check input."
          fi
          echo "${table}"
          if ! { printf '### Checks\n\n%s\n' "${table}" >> "${GITHUB_STEP_SUMMARY}"; } 2>/dev/null; then
            echo "::warning::Could not write the job summary; the table above and the exit status decide."
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "::error::A check failed or did not run; see the table above."
          fi
          exit "${fail}"

  fast:
    # The shared merged job, called locally: its version step takes this run's commit, so the actions it runs are this
    # pull request's. One cheap check is enough to prove the mechanism (checkout, version, actions, results).
    uses: ./.github/workflows/fast-checks.yml
    with:
      no-prerelease-deps: true
      docs: true

  ready:
    # The one summary row (`ci / ready`): every other job passed. Local call: its scripts are this pull request's.
    name: ci
    if: ${{ always() }}
    needs: [lint, fast]
    uses: ./.github/workflows/ready.yml
    with:
      runner: github
      needs: ${{ toJSON(needs) }}
      reproduce: |
        lint: vanguard local-ci <worktree> --jobs lint
        fast: vanguard local-ci <worktree> --jobs fast
