# Shared: the tiny checks of a repo as steps of ONE job, `fast` (decision 180; onepeek-docs
# architecture/lld/infra/delivery-pipelines.md §9.1 "Tiny jobs merged"; orchestrator rulings R-S2i-1, R-S2i-2 and
# R-S2i-5, provisional, 2026-11-10). Each check that runs under a minute was its own job and booted its own machine;
# here each is one step, with the same body as its own workflow (pins.yml, secret-scan.yml, contract.yml and
# no-prerelease-deps.yml run the same composite actions under actions/, which stay until every caller has moved).
# A caller turns on the checks it needs with the boolean inputs. Every requested check runs even when an earlier one
# failed (`if: always()`, rulings R-S2i-1 and R-S2i-6), the last check step writes each check's result to
# the job summary and the log, and the job fails when any check failed, so one failure never hides another.
# depends-on stays its own job (vanguard config/ship.yaml depends_on_check matches it by name). The caller's check
# name is `<caller job> / fast`.
# Order: no-prerelease-deps scans the whole working tree, so it runs before contract checks the other repos out.
# A tree-only check (secrets, delivery-pipelines.md §8.1) skips itself on a dev -> release promotion pull request, as
# its own job did there; release-gate makes that skip safe. The summary names the skip.
name: fast-checks

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      pins:
        description: Run the pin check (pins.yml's body, actions/pins).
        type: boolean
        default: false
      secrets:
        description: Run the gitleaks secrets scan (secret-scan.yml's body, actions/gitleaks). Tree-only (§8.1).
        type: boolean
        default: false
      contract:
        description: Run the contract between repos (contract.yml's body, actions/contract); needs role and base_ref.
        type: boolean
        default: false
      no-prerelease-deps:
        description: Refuse pull-request previews of @onepeek/* packages (no-prerelease-deps.yml's body).
        type: boolean
        default: false
      role:
        description: For contract, the calling repo, backend, web or infra.
        type: string
        default: ""
      base_ref:
        description: For contract, the pull request's base branch, dev or release (github.base_ref).
        type: string
        default: ""
    secrets:
      AGENTS_APP_CLIENT_ID:
        description: The agents' GitHub App (playbook §8a S6), for the docs rule of pins and for contract.
        required: false
      AGENTS_APP_PRIVATE_KEY:
        description: The agents' GitHub App private key (with AGENTS_APP_CLIENT_ID).
        required: false

permissions:
  contents: read

jobs:
  fast:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 25  # the sum of the merged jobs' limits less the boots they no longer pay (pins 5, gitleaks 10, contract 10)
    steps:
      # The full history: gitleaks scans the pull request's commits.
      - name: This repo
        id: repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The composite actions and scripts are this workflow's own repository at the commit the caller pinned, read from
      # the caller's pin (pins.yml's way since 2026-11-06; delivery-pipelines.md §6.5 ruling 4). A local call inside
      # OnePeek/.github has no pin: it uses this run's commit. Any other caller without a pin fails here (fail closed).
      - name: This workflow's version (the caller's pin of fast-checks.yml)
        id: version
        env:
          FILE: fast-checks.yml
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          sha=$(grep -rhoiE "OnePeek/\.github/\.github/workflows/${FILE//./\\.}@[0-9a-f]{40}" .github/workflows 2>/dev/null | head -n 1 | cut -d@ -f2 || true)
          if [ -z "${sha}" ]; then
            if [ "$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')" != "onepeek/.github" ]; then
              echo "::error::No pin of OnePeek/.github/.github/workflows/${FILE}@<commit SHA> in .github/workflows: call ${FILE} pinned by commit SHA."
              exit 1
            fi
            sha="${RUN_SHA}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${FILE} runs at ${sha}"

      - name: OnePeek/.github at that version (its composite actions and scripts)
        id: shared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OnePeek/.github
          ref: ${{ steps.version.outputs.sha }}
          path: _shared
          persist-credentials: false

      - name: pins
        id: pins
        if: ${{ always() && inputs.pins && steps.shared.outcome == 'success' }}
        uses: ./_shared/actions/pins
        with:
          app-client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}

      - name: secrets (gitleaks)
        id: secrets
        if: ${{ always() && inputs.secrets && steps.shared.outcome == 'success' && !(github.event_name == 'pull_request' && github.base_ref == 'release' && github.head_ref == 'dev') }}
        uses: ./_shared/actions/gitleaks

      - name: no-prerelease-deps
        id: no-prerelease-deps
        if: ${{ always() && inputs.no-prerelease-deps && steps.shared.outcome == 'success' }}
        uses: ./_shared/actions/no-prerelease-deps

      - name: contract
        id: contract
        if: ${{ always() && inputs.contract && steps.shared.outcome == 'success' }}
        uses: ./_shared/actions/contract
        with:
          role: ${{ inputs.role }}
          base_ref: ${{ inputs.base_ref }}
          app-client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}

      # One line per check: <name>|<wanted: true, false or excused>|<the outcomes of its steps, comma-separated>.
      # Runs whatever happened before (always()); it reads only step outcomes, never an output or a secret, so the
      # summary holds no secret. A summary that cannot be written is a warning: the exit status still decides.
      - name: Results (each check's result in the summary; fails when any check failed)
        if: ${{ always() }}
        env:
          RESULTS: |
            setup|true|${{ steps.repo.outcome }},${{ steps.version.outcome }},${{ steps.shared.outcome }}
            pins|${{ inputs.pins }}|${{ steps.pins.outcome }}
            secrets|${{ inputs.secrets && ((github.event_name == 'pull_request' && github.base_ref == 'release' && github.head_ref == 'dev') && 'excused' || 'true') || 'false' }}|${{ steps.secrets.outcome }}
            no-prerelease-deps|${{ inputs.no-prerelease-deps }}|${{ steps.no-prerelease-deps.outcome }}
            contract|${{ inputs.contract }}|${{ steps.contract.outcome }}
        run: |
          # scripts/test_fast_checks.py runs this script; workflow-lint.yml's lint job holds the same copy (a test keeps them equal).
          fail=0
          wanted=0
          table="| check | result |"$'\n'"|---|---|"
          while IFS='|' read -r name want outcomes; do
            [ -n "${name}" ] || continue
            if [ "${want}" = false ]; then
              result="not requested"
            else
              [ "${name}" = setup ] || wanted=$((wanted + 1))
              result=success
              IFS=',' read -ra each <<< "${outcomes}"
              [ "${#each[@]}" -gt 0 ] || result="not run"
              for o in "${each[@]}"; do
                case "${o}" in
                  success) ;;
                  failure) result=failed ;;
                  *) [ "${result}" = failed ] || result="not run (${o:-no outcome})" ;;
                esac
              done
              if [ "${want}" = excused ] && [ "${result}" != failed ] && [ "${result}" != success ]; then
                result="skipped: a dev -> release promotion pull request (tree-only, certified on the push to dev, delivery-pipelines.md §8.1)"
              elif [ "${result}" != success ]; then
                fail=1
              fi
            fi
            table="${table}"$'\n'"| ${name} | ${result} |"
          done <<< "${RESULTS}"
          if [ "${wanted}" -eq 0 ]; then
            fail=1
            table="${table}"$'\n'"| (none) | failed: no check was requested |"
            echo "::error::No check was requested: turn on at least one check input."
          fi
          echo "${table}"
          if ! { printf '### Checks\n\n%s\n' "${table}" >> "${GITHUB_STEP_SUMMARY}"; } 2>/dev/null; then
            echo "::warning::Could not write the job summary; the table above and the exit status decide."
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "::error::A check failed or did not run; see the table above."
          fi
          exit "${fail}"

      - name: Job usage (CPU, memory, disk and instance type, as a notice; S0 runner sizes)
        # Measurement only: scripts/job_usage.py verbatim (scripts/test_job_usage.py), never fails or slows the job.
        if: ${{ always() && runner.environment != 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          RUNNER_CLASS: light
          RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          cat > "$RUNNER_TEMP/job_usage.py" <<'PY'
          """Job usage: one JSON line with what a job on our own runners used (S0 of the infra stabilization plan, runner sizes).

          Run as the last step of every shared-workflow job that can run on our runners (`if: always()`, continue-on-error).
          It reads the job's cgroup totals (no start step needed): CPU seconds (cgroup v2 cpu.stat usage_usec, else cgroup v1
          cpuacct.usage, else /proc/stat since boot), peak memory (memory.peak, else memory.max_usage_in_bytes), the job's wall
          time (from the start of the runner's per-job Runner.Worker process), average vCPU (CPU seconds over wall seconds),
          disk used on / and on the workspace's filesystem at job end, and the instance type (IMDSv2, link-local, 1 s budget).
          A value it cannot read is "unavailable" ("unknown" for the instance type). It prints `::notice::job-usage {json}` (read
          back from the job's annotations by the API, no artifact) and appends the JSON line to the step summary. It never fails
          the job: every read is guarded and it always exits 0. On GitHub-hosted runners it does nothing.
          Workflows run a verbatim copy of this file (scripts/test_job_usage.py keeps the copies identical).
          """
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.request

          NA = "unavailable"
          LIMIT = 65536  # bytes read from any one file
          IMDS = "http://169.254.169.254"
          IMDS_BUDGET = 1.0  # seconds for the whole instance-type lookup
          WORKER = "Runner.Worker"  # the runner's per-job process; its start is the job's start


          def _read(path):
              try:
                  with open(path, "rb") as f:
                      return f.read(LIMIT).decode("ascii")
              except (OSError, UnicodeDecodeError, ValueError):
                  return None


          def _int(text):
              try:
                  value = int(text.strip())
              except (AttributeError, ValueError):
                  return None
              return value if value >= 0 else None


          def cgroups(proc):
              """{"v2": path} or {controller: path} for cgroup v1, from <proc>/self/cgroup; {} when unreadable."""
              found = {}
              for line in (_read(os.path.join(proc, "self", "cgroup")) or "").splitlines():
                  parts = line.split(":", 2)
                  if len(parts) != 3 or not parts[2].startswith("/"):
                      continue
                  if parts[0] == "0" and parts[1] == "":
                      found["v2"] = parts[2]
                  for controller in parts[1].split(","):
                      if controller:
                          found[controller] = parts[2]
              return found


          def _under(sysfs, *parts):
              return os.path.join(sysfs, *[p.lstrip("/") for p in parts])


          def cpu_seconds(proc, sysfs, groups):
              """(seconds, source), or (NA, NA)."""
              if "v2" in groups:
                  for line in (_read(_under(sysfs, groups["v2"], "cpu.stat")) or "").splitlines():
                      key, _, value = line.partition(" ")
                      if key == "usage_usec" and _int(value) is not None:
                          return round(_int(value) / 1e6, 3), "cgroup"
              if "cpuacct" in groups:
                  value = _int(_read(_under(sysfs, "cpuacct", groups["cpuacct"], "cpuacct.usage")))
                  if value is not None:
                      return round(value / 1e9, 3), "cgroup_v1"
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  fields = line.split()
                  if fields[:1] == ["cpu"] and len(fields) >= 9:
                      ticks = [_int(fields[i]) for i in (1, 2, 3, 6, 7, 8)]  # user nice system irq softirq steal
                      if None not in ticks:
                          return round(sum(ticks) / os.sysconf("SC_CLK_TCK"), 3), "proc_stat_since_boot"
              return NA, NA


          def memory_peak(sysfs, groups):
              """(bytes, source), or (NA, NA)."""
              if "v2" in groups:
                  value = _int(_read(_under(sysfs, groups["v2"], "memory.peak")))
                  if value is not None:
                      return value, "cgroup"
              if "memory" in groups:
                  value = _int(_read(_under(sysfs, "memory", groups["memory"], "memory.max_usage_in_bytes")))
                  if value is not None:
                      return value, "cgroup_v1"
              return NA, NA


          def _stat(proc, pid):
              """(comm, ppid, starttime in clock ticks after boot) of a process, or None."""
              text = _read(os.path.join(proc, str(pid), "stat"))
              if not text or "(" not in text or ")" not in text:
                  return None
              comm = text[text.index("(") + 1:text.rindex(")")]
              fields = text[text.rindex(")") + 1:].split()
              if len(fields) < 20 or _int(fields[1]) is None or _int(fields[19]) is None:
                  return None
              return comm, _int(fields[1]), _int(fields[19])


          def wall_seconds(proc, now, pid):
              """Seconds since the nearest Runner.Worker ancestor started, or NA."""
              btime = None
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  if line.startswith("btime "):
                      btime = _int(line[6:])
              if btime is None:
                  return NA
              for _ in range(64):
                  info = _stat(proc, pid)
                  if info is None:
                      return NA
                  comm, ppid, start = info
                  if comm == WORKER:
                      wall = now - (btime + start / os.sysconf("SC_CLK_TCK"))
                      return round(wall, 1) if wall > 0 else NA
                  if ppid in (None, 0) or ppid == pid:
                      return NA
                  pid = ppid
              return NA


          def disk_used(path):
              try:
                  st = os.statvfs(path)
              except (OSError, TypeError, ValueError):
                  return NA
              return (st.f_blocks - st.f_bfree) * st.f_frsize


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def _imds(base, out):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), _NoRedirect)
              put = urllib.request.Request(base + "/latest/api/token", method="PUT",
                                           headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
              with opener.open(put, timeout=IMDS_BUDGET) as r:
                  token = r.read(256).decode("ascii").strip()
              get = urllib.request.Request(base + "/latest/meta-data/instance-type", headers={"X-aws-ec2-metadata-token": token})
              with opener.open(get, timeout=IMDS_BUDGET) as r:
                  value = r.read(64).decode("ascii").strip()
              if re.fullmatch(r"[a-z0-9-]+\.[a-z0-9]+", value):
                  out.append(value)


          def instance_type(base=IMDS, budget=IMDS_BUDGET):
              """The EC2 instance type, or "unknown" when IMDS is absent, slow, denied or odd (never more than `budget` s)."""
              out = []

              def run():
                  try:
                      _imds(base, out)
                  except Exception:
                      pass

              worker = threading.Thread(target=run, daemon=True)
              worker.start()
              worker.join(budget)
              return out[0] if out and not worker.is_alive() else "unknown"


          def collect(env, proc="/proc", sysfs="/sys/fs/cgroup", imds=IMDS, now=None, pid=None):
              now = time.time() if now is None else now
              groups = cgroups(proc)
              cpu, cpu_source = cpu_seconds(proc, sysfs, groups)
              mem, mem_source = memory_peak(sysfs, groups)
              wall = wall_seconds(proc, now, os.getpid() if pid is None else pid)
              avg = round(cpu / wall, 3) if isinstance(cpu, float) and isinstance(wall, float) and wall > 0 else NA
              return {
                  "repo": env.get("GITHUB_REPOSITORY", NA),
                  "job": env.get("GITHUB_JOB", NA),
                  "runner_class": env.get("RUNNER_CLASS", NA),
                  "runner_input": env.get("RUNNER_INPUT", NA),
                  "runner_name": env.get("RUNNER_NAME", NA),
                  "instance_type": instance_type(imds),
                  "wall_s": wall,
                  "cpu_s": cpu,
                  "cpu_source": cpu_source,
                  "avg_vcpu": avg,
                  "mem_peak_bytes": mem,
                  "mem_source": mem_source,
                  "disk_used_root_bytes": disk_used("/"),
                  "disk_used_workspace_bytes": disk_used(env.get("GITHUB_WORKSPACE")) if env.get("GITHUB_WORKSPACE") else NA,
                  "cgroup": groups.get("v2", groups.get("memory", NA)),
              }


          def main(env=None, **kwargs):
              env = os.environ if env is None else env
              if env.get("RUNNER_ENVIRONMENT") == "github-hosted":
                  return 0
              line = json.dumps(collect(env, **kwargs), sort_keys=True, separators=(",", ":"))
              print("::notice::job-usage " + line.replace("%", "%25"), flush=True)
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as f:
                          f.write(line + "\n")
                  except (OSError, ValueError):
                      print("job-usage: the step summary is not writable", file=sys.stderr)
              return 0


          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  pass
              sys.exit(0)
          PY
          python3 -I "$RUNNER_TEMP/job_usage.py"
