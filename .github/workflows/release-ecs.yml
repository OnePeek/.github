# Shared release workflow (onepeek-docs architecture/lld/infra/delivery-pipelines.md UC-DEL-001, UC-DEL-005, §5).
# Called by backend-service and onepeek-web on a push to the branch their preprod deploy runs from (release until launch,
# dev after the switch-over; playbook §5.4); prod is promote-only (promote.yml, UC-DEL-003), so this workflow refuses
# environment prod. The caller only passes inputs. Five stages (foundation-reset W2.1: each job waits about a minute for
# a runner, so the steps are grouped by stage, not one job per step), in order:
# prepare (the cross-repo release lock and the order check, playbook §5.4; the version), build (build-image, or
# build-web for web: build, scan, SBOM and sign, read back and verify the recorded digest), db-bootstrap (backend only;
# a call of infra's reusable workflow under its own role, so it stays a job of its own), deploy (migrate, assets, the
# rollout, the ops registration), verify (smoke, watch, and the rollback on a failed rollout, smoke or watch) and finish
# (the deployment record, the unlock, always, and the API client). Nobody deploys from a laptop.
# Every preprod artefact is keyed on the commit, sha-<12> (foundation-playbook §5.2, decision 159): the image tag, the
# web-assets folder, the SSM release record and the task-definition tags. The release-please version is image metadata
# only; the v<version> tag, the git tag and the GitHub release are made on promotion (promote.yml, UC-DEL-003).
#
# Provisional (delivery-pipelines §16 "Decided before building"): ARM64 images are built with QEMU on GitHub's
# standard runners (Q1), natively on ARM64 runners when the runner input picks them (ci-runners.md section 5.3); team notices go to the run summary and the GitHub deployment record until Q2 picks a channel (preprod has no release page, playbook §5.2).
# `dry-run: true` (§15) renders every task definition and checks every signature, and changes nothing.
name: release-ecs

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      environment:
        description: Environment; resources are named onepeek-<environment>.
        type: string
        required: true
      image:
        description: The main image, backend or web.
        type: string
        required: true
      extra-images:
        description: Further images built in the same run (sandbox). Empty until the sandbox image exists.
        type: string
        default: ""
      migrate:
        description: Run the migrate task before the rollout (backend only).
        type: boolean
        default: false
      assets:
        description: Copy the web build's assets to the web-assets bucket before the rollout (web only, UC-DEL-005).
        type: boolean
        default: false
      domain:
        description: The environment's public host name, for the smoke checks.
        type: string
        required: true
      role-to-assume:
        description: The repo's deploy role (onepeek-<env>-deploy-<repo>).
        type: string
        required: true
      signing-key:
        description: The cosign key reference, for example awskms:///alias/onepeek-preprod-image-signing.
        type: string
        required: true
      dry-run:
        description: Render every task definition and verify every signature; register, run, update and tag nothing.
        type: boolean
        default: false
      db-bootstrap-role:
        description: The onepeek-<env>-deploy-db-bootstrap role that infra's reusable db-bootstrap workflow assumes (backend only, with migrate; decision 148).
        type: string
        default: ""
      smoke-script:
        description: The caller repo's smoke checks against https://<domain>, run in addition to the shared baseline readiness check (delivery-pipelines UC-DEL-001 row 7), without AWS credentials, with DOMAIN set. Absent = a visible warning.
        type: string
        default: smoke.sh
      deploy-from-dev:
        description: Allow a release triggered from refs/heads/dev. Off until the launch switch-over makes dev preprod (foundation-playbook §5.4; until launch release is preprod).
        type: boolean
        default: false
      allow-drop:
        description: Reviewed setting and secret names allowed to disappear from a service in this release (the contract step of an expand/contract change; delivery-pipelines §5 step 4). Space or comma separated; a name applies to every container.
        type: string
        default: ""
    secrets:
      NPM_READ_TOKEN:
        description: Retired and ignored (foundation-playbook §12a slice 3). The build reads @onepeek packages with the run's GITHUB_TOKEN (packages read). Kept optional only so a caller that still passes it does not fail; delete it once onepeek-web stops passing it.
        required: false
      AGENTS_APP_CLIENT_ID:
        description: The agents' GitHub App (playbook §5.3, §5.4). Required. Its token, with Actions read, lets a waiting run see that another repo's lock holder has finished; without it such a lock could never be taken over.
        required: true
      AGENTS_APP_PRIVATE_KEY:
        description: The agents' GitHub App private key (with AGENTS_APP_CLIENT_ID). Required.
        required: true

permissions: {}

env:
  COSIGN_EXPERIMENTAL: "1" # required by the OCI 1.1 referrers mode (delivery-pipelines §5)
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  SYFT_VERSION: 1.55.0 # the Syft install step: pinned, checksum verified, both architectures
  SYFT_SHA256_A: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d # amd64
  SYFT_SHA256_B: 929bd163db2d7cd2255d3bcb8967208079813d7b46b0c952f7b794d8e2c7d304 # arm64
  NAME: onepeek-${{ inputs.environment }}
  ENVIRONMENT: ${{ inputs.environment }}
  VERSION_FILE: .release-please-manifest.json
  LOCK_SCOPE: ${{ inputs.image }} # the scope is derived from the image, never a free input (playbook §5.4a "Keys")
  LOCK_WAIT_SECONDS: "1800" # an app waits up to 30 minutes for its own key held by a run of its own scope (playbook §5.4)
  LOCK_WAIT_CAP_SECONDS: "7200" # every wait of a job counts towards one cap of 120 minutes (playbook §5.4a "Waits that fit the runners")
  LOCK_QUEUED_WAIT_SECONDS: "3600" # 60 minutes for an infra release run that is queued or holds no key yet
  LOCK_MIGRATE_WAIT_SECONDS: "900" # a migrate task gets 15 minutes to stop (the migrate step's own limit)
  LOCK_REMINT_SECONDS: "3000" # a new App token and role session every 50 minutes inside a wait (both last 1 hour)
  LOCK_POLL_SECONDS: "30" # polling every 30 s

jobs:
  prepare:
    # The release lock of this image's scope (foundation-playbook §5.4a; UC-DEL-001; E5), taken by the first step of the
    # first job, before any build: locks/release.json and locks/<scope>.json, try-or-release, waiting holding nothing.
    # No `concurrency` group: GitHub keeps one pending run per group and cancels the older one (playbook §5.1 step 7).
    # The finish job ends it by its phase, always. Then the order check: a release of a commit older than what runs is a
    # skip. Then row 1, the version. Its limit is the wait cap (120) plus 15 (a named TIMEOUT_EXCEPTIONS entry, §5.4a).
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 135
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      attempt: ${{ steps.take.outputs.attempt }}
      token: ${{ steps.take.outputs.token }}
      skip: ${{ steps.order.outputs.skip }}
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      images: ${{ steps.v.outputs.images }}
      started: ${{ steps.v.outputs.started }}
    steps:
      - name: Prod is promote-only (promote.yml, UC-DEL-003); this workflow deploys preprod
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          if [ "${ENVIRONMENT_NAME}" = "prod" ]; then
            echo "::error::release-ecs never deploys prod: prod promotes the digests recorded for the merged dev commit (promote.yml)."
            exit 1
          fi
      - name: Deploy from dev is off until the launch switch-over (foundation-playbook §5.4)
        env:
          DEPLOY_FROM_DEV: ${{ inputs.deploy-from-dev }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/dev" ] && [ "${DEPLOY_FROM_DEV}" != "true" ]; then
            echo "::error::deploy from dev is disabled until the launch switch-over (foundation-playbook §5.4)"
            exit 1
          fi
      - name: The agents' GitHub App secrets are set (required, playbook §5.4)
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY must be passed: without the App token a lock left by another repo's finished run could never be taken over (playbook §5.4)."
            exit 1
          fi
      - name: The agents' GitHub App token (Actions and Contents read), to see whether another repo's lock holder has finished and read the release order
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend-service,onepeek-web,onepeek-infra,mcp-athena # the repos that take the lock (playbook §5.4)
          permission-actions: read
          permission-contents: read # the release order's reads (playbook §5.4a "The run's GitHub reads")
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Take the release lock
        id: take
        env:
          # The infra edge's queued-or-running part (playbook §5.4a "Taking keys and waiting" item 4; E5): no take while an
          # infra release run is queued or running or infra.json is held, and once more after the take.
          LOCK_INFRA_EDGE: "1"
          LOCK_GH_TOKEN: ${{ steps.app.outputs.token }}
          # Minted again every 50 minutes inside a wait (playbook §5.4a rule 4): the same App, repositories and permissions,
          # the same role and session name. The key reaches only this step's environment and is never printed.
          LOCK_APP_CLIENT_ID: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          LOCK_APP_PRIVATE_KEY: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          LOCK_APP_REPOS: backend-service,onepeek-web,onepeek-infra,mcp-athena
          LOCK_APP_PERMISSIONS: '{"actions": "read", "contents": "read"}'
          LOCK_ROLE_ARN: ${{ inputs.role-to-assume }}
          LOCK_ROLE_SESSION: ${{ github.event.repository.name }}-${{ github.run_id }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # Release locks per scope (foundation-playbook §5.4, §5.4a): one key per scope in s3://onepeek-<env>-deploy/locks/
          # (infra.json, backend.json, web.json, mcp.json), taken with a conditional write (If-None-Match: *) and removed with a
          # conditional delete on its ETag (If-Match). Expand step of the move off locks/release.json: every take set starts with
          # release.json, and every reader reads it too. An app takes release.json and its own scope's key; infra takes
          # release.json, then infra.json, backend.json, web.json and mcp.json in that fixed order. Every take is try-or-release:
          # when one key is held by a live run, the keys taken so far are deleted (in reverse order, each on the ETag of its own
          # write) and the run waits holding nothing, so no run ever waits while it holds a key.
          # The record names the repo, run ID, run attempt, commit, start time, a random token, the scope and the phase (locked,
          # migrating, rolling or done). Only the holder (or the one repairer that claimed it) writes it, with If-Match on the
          # ETag it read; a 412 means the key is lost, a 409 is re-read and retried up to 3 times while the ETag is unchanged. A key whose holder's run has
          # finished is taken over by its phase: locked or done, removed; migrating, removed only once the migrate task has
          # stopped; rolling, never (cancel-release.yml repairs it). Anything unreadable fails closed: no lock, no deploy.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock once freeze has recorded infra_head, every
          # other take (infra's included) fails with the reason, and every take reads it again after taking its keys.
          # Waits fit the runners (§5.4a): every wait counts towards LOCK_WAIT_CAP_SECONDS; a run of the same scope holding the key
          # is waited for at most LOCK_WAIT_SECONDS; at a limit the step fails with "waiting for <holder> (<scope>, run <id>);
          # re-run", holding nothing. Every LOCK_REMINT_SECONDS inside a wait the App token and the AWS role session are minted again.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_LEGACY_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          LOCK_OWNER="${GITHUB_REPOSITORY%%/*}"
          LOCK_MINTED=${SECONDS}
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_scope_repo() {  # lock_scope_repo <scope> -> the scope's owning repo
            case "$1" in
              infra) echo "${LOCK_OWNER}/onepeek-infra" ;;
              backend) echo "${LOCK_OWNER}/backend-service" ;;
              web) echo "${LOCK_OWNER}/onepeek-web" ;;
              mcp) echo "${LOCK_OWNER}/mcp-athena" ;;
              *) return 1 ;;
            esac
          }
          lock_repo_scope() {  # lock_repo_scope <owner/repo> -> the scope that repo owns; 1 when it owns none
            case "${1#*/}" in
              onepeek-infra) echo infra ;;
              backend-service) echo backend ;;
              onepeek-web) echo web ;;
              mcp-athena) echo mcp ;;
              *) return 1 ;;
            esac
          }
          lock_keys() {  # the take set of LOCK_SCOPE, in take order
            case "${LOCK_SCOPE:-}" in
              infra) echo "${LOCK_LEGACY_KEY} locks/infra.json locks/backend.json locks/web.json locks/mcp.json" ;;
              backend|web|mcp) echo "${LOCK_LEGACY_KEY} locks/${LOCK_SCOPE}.json" ;;
              *) echo "::error::No lock scope (LOCK_SCOPE='${LOCK_SCOPE:-}'): it must be infra, backend, web or mcp." >&2; return 1 ;;
            esac
          }
          lock_reverse() {  # lock_reverse <words> -> the words in reverse order
            local out="" w words
            read -r -a words <<< "$1"
            for w in "${words[@]}"; do out="${w} ${out}"; done
            echo "${out}"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token> <scope> <phase> <migrate task> <repair run>"; 1 when not a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt = record["repo"], str(record["run_id"]), str(record["run_attempt"])
              token, scope, phase = str(record.get("token", "-")), str(record.get("scope", "-")), str(record.get("phase", "locked"))
              task, repair = str(record.get("migrate_task") or "-"), str(record.get("repair_run") or "-")
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)
                  and scope in ("infra", "backend", "web", "mcp", "-") and phase in ("locked", "migrating", "rolling", "done")
                  and re.fullmatch(r"arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task/[A-Za-z0-9_/-]+|-", task) and re.fullmatch(r"[0-9]+-[0-9]+|-", repair)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token, scope, phase, task, repair)' "$1"
          }
          lock_put() {  # lock_put <key> <file> <etag | *> -> 0 written (LOCK_PUT_ETAG is the new ETag), 2 lost (412, or gone), 3 conflict (409), 1 any other answer
            local msg cond=(--if-match "$3")
            LOCK_PUT_ETAG=""
            if [ "$3" = "*" ]; then cond=(--if-none-match '*'); fi
            # No encryption flags: the bucket default applies (aws-stack §16).
            if LOCK_PUT_ETAG=$(aws s3api put-object --bucket "${LOCK_BUCKET}" --key "$1" --body "$2" "${cond[@]}" \
              --content-type application/json --query ETag --output text 2>"${LOCK_ERR}"); then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in
              *"(PreconditionFailed)"*|*"(NoSuchKey)"*) return 2 ;;
              *"(ConditionalRequestConflict)"*) return 3 ;;
            esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be written: ${msg}"
            return 1
          }
          lock_delete() {  # lock_delete <key> <etag> -> 0 removed, 2 changed or gone meanwhile (read it again), 1 any other answer
            local msg
            if aws s3api delete-object --bucket "${LOCK_BUCKET}" --key "$1" --if-match "$2" >/dev/null 2>"${LOCK_ERR}"; then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*|*"(NoSuchKey)"*) return 2 ;; esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be removed: ${msg}"
            return 1
          }
          lock_run_finished() {  # lock_run_finished <repo> <run id> -> 0 only when GitHub reports the run completed
            local status
            if ! status=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/$1/actions/runs/$2" --jq .status 2>"${LOCK_ERR}"); then
              echo "::warning::Cannot read the state of $(lock_url "$1" "$2"), so it counts as running: $(cat "${LOCK_ERR}")" >&2
              return 1
            fi
            [ "${status}" = "completed" ]
          }
          lock_record() {  # lock_record <file> [token]: this run's record (with a token: a lock record of LOCK_SCOPE, phase locked)
            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", ""), "ref": e.get("GITHUB_REF", "")}
          if len(sys.argv) > 2:
              record.update(token=sys.argv[2], scope=e["LOCK_SCOPE"], phase="locked")
              del record["who"], record["why"], record["ref"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
          }
          lock_is_mine() {  # lock_is_mine <holder line> -> 0 when the record is this run's own: its token, or (no token at hand) its run and attempt
            local repo run attempt token rest
            read -r repo run attempt token rest <<< "$1"
            if [ -n "${LOCK_TOKEN:-}" ]; then [ "${token}" = "${LOCK_TOKEN}" ]; return; fi
            [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" = "${GITHUB_RUN_ATTEMPT}" ]
          }
          lock_frozen_branch() {  # lock_frozen_branch <file> -> "<repo> <ref> <infra_head | ->" of a preprod-frozen record ("-": freeze has not recorded it yet); 1 when it is not one
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, ref = record["repo"], record["ref"]
              head, settled = record.get("infra_head"), record.get("infra_settled")
          except Exception as error:
              sys.exit("not a preprod-frozen record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and re.fullmatch(r"refs/heads/hotfix/[A-Za-z0-9_./-]+", ref)):
              sys.exit("not a preprod-frozen record: " + json.dumps(record))
          # Once recorded, infra_head is a commit SHA and infra_settled a boolean (§5.4a "Freeze and thaw"); anything else fails closed.
          if head is not None and not (isinstance(head, str) and re.fullmatch(r"[0-9a-f]{40}", head) and isinstance(settled, bool)):
              sys.exit("not a preprod-frozen record (infra_head or infra_settled): " + json.dumps(record))
          print(repo, ref, head or "-")' "$1"
          }
          lock_frozen_for_others() {  # 0 when preprod-frozen refuses this run (the reason is printed): it names another branch, or this branch before freeze recorded infra_head; 1 when not frozen for us, 2 unreadable
            local etag branch repo ref head
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${etag}" = "absent" ]; then return 1; fi
            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref head <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF:-}" ]; then
              if [ "${head}" != "-" ]; then return 1; fi
              # §5.4a "Freeze and thaw": a hotfix take refuses while frozen.json has no infra_head yet.
              echo "preprod is frozen for this hotfix branch ${repo} ${ref}, but freeze has not recorded infra_head yet (it waits while a live infra release holds infra.json); re-run once freeze has finished"
              return 0
            fi
            python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));print("preprod is frozen by %s (%s) for the hotfix branch %s %s, first frozen by %s" % (r.get("who","?"), r.get("why","?"), r["repo"], r["ref"], r.get("run","?")))' lock-frozen.json
            return 0
          }
          lock_remint() {  # a new App installation token and a new role session (the same permissions, repositories, role and session name)
            local jwt installation repo creds
            if [ -n "${LOCK_APP_CLIENT_ID:-}" ] && [ -n "${LOCK_APP_PRIVATE_KEY:-}" ]; then
              # The key stays in this step's environment: it is signed from a file descriptor and never printed.
              if ! jwt=$(LOCK_APP_PRIVATE_KEY="${LOCK_APP_PRIVATE_KEY}" python3 -c '
          import base64, json, os, subprocess, time
          b64 = lambda raw: base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          head = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + "." + b64(json.dumps({"iat": now - 60, "exp": now + 540, "iss": os.environ["LOCK_APP_CLIENT_ID"]}).encode())
          read, write = os.pipe()
          os.write(write, os.environ["LOCK_APP_PRIVATE_KEY"].encode())
          os.close(write)
          signed = subprocess.run(["openssl", "dgst", "-sha256", "-sign", "/dev/fd/%d" % read], input=head.encode(), capture_output=True, check=True, pass_fds=(read,))
          print(head + "." + b64(signed.stdout))'); then
                echo "::error::The App token could not be minted again (JWT)."; return 1
              fi
              repo="${LOCK_APP_REPOS%%,*}"
              # Every bearer token goes to curl as a header file (-H @file, written by the printf builtin), never on its command line.
              if ! installation=$(curl -sSf -H @<(printf 'Authorization: Bearer %s\n' "${jwt}") -H "Accept: application/vnd.github+json" \
                  "${GITHUB_API_URL:-https://api.github.com}/repos/${LOCK_OWNER}/${repo}/installation" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])') \
                || ! LOCK_GH_TOKEN=$(LOCK_APP_REPOS="${LOCK_APP_REPOS}" python3 -c 'import json,os;print(json.dumps({"repositories": os.environ["LOCK_APP_REPOS"].split(","), "permissions": json.loads(os.environ["LOCK_APP_PERMISSIONS"])}))' \
                  | curl -sSf -X POST -H @<(printf 'Authorization: Bearer %s\n' "${jwt}") -H "Accept: application/vnd.github+json" --data @- \
                    "${GITHUB_API_URL:-https://api.github.com}/app/installations/${installation}/access_tokens" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])'); then
