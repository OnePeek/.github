                case "${rc}" in 0) state=held ;; 1) ;; *) state=failed ;; esac
              fi
              if [ "${state}" = "free" ]; then   # once more after the take: a freeze written meanwhile refuses it (§5.4a "Freeze and thaw")
                rc=0
                reason=$(lock_frozen_for_others) || rc=$?
                case "${rc}" in
                  0) echo "::error::The ${ENVIRONMENT} release lock is refused: ${reason}."; state=failed ;;
                  1) ;;
                  *) echo "::error::s3://${LOCK_BUCKET}/${FROZEN_KEY} is unreadable, so nothing is deployed."; state=failed ;;
