                queued) queued=$((queued + LOCK_POLL_SECONDS)) ;;
              esac
              if [ $((SECONDS - start)) -ge "${LOCK_WAIT_CAP_SECONDS}" ] || [ "${own}" -gt "${LOCK_WAIT_SECONDS}" ] || [ "${queued}" -gt "${LOCK_QUEUED_WAIT_SECONDS}" ]; then
                lock_fail_waiting "${holder}" "${scope}" "${run}"
                return 1
              fi
              case "${holder}" in
                arn:*) where="the migrate task ${holder} of run ${run}, which has not stopped" ;;
                *) where="$(lock_url "${holder}" "${run}")" ;;
              esac
              if [ "${kind}" = "queued" ]; then where="${where} (an infra release, queued or running)"; fi
