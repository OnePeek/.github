            if ! etag=$(lock_read locks/infra.json lock-infra.json); then return 2; fi
            if [ "${etag}" != "absent" ]; then
              if ! holder=$(lock_holder lock-infra.json); then return 2; fi
              read -r repo run rest <<< "${holder}"
