          import json, os, sys
          described = json.load(open("lock-revision.json"))
          td = described["taskDefinition"]
          if td.get("family") != os.environ["FAMILY"]:
              sys.exit("the description names family %r" % td.get("family"))
          if not td.get("containerDefinitions"):
              sys.exit("the description holds no container")
