                  "requiresCompatibilities", "cpu", "memory", "pidMode", "ipcMode", "proxyConfiguration", "inferenceAccelerators",
                  "ephemeralStorage", "runtimePlatform", "enableFaultInjection")
          body = {k: td[k] for k in keep if k in td and td[k] not in (None, [], {})}
          if described.get("tags"):
              body["tags"] = described["tags"]
          json.dump(body, open("lock-revision-register.json", "w"))
          print(td.get("status", ""))'); then
              echo "::error::$1 could not be put back: the description of ${2##*/} is unreadable."; return 1
            fi
            case "${status}" in
              ACTIVE) LOCK_LIVE_REVISION="$2"; return 0 ;;
              INACTIVE) ;;
              *) echo "::error::$1 could not be put back: ${2##*/} is ${status:-of no status}, neither active nor inactive."; return 1 ;;
            esac
            if ! arn=$(aws ecs register-task-definition --cli-input-json file://lock-revision-register.json --query taskDefinition.taskDefinitionArn --output text); then
              echo "::error::$1 could not be put back: ${2##*/} is inactive and could not be registered again."; return 1
            fi
            if ! [[ "${arn}" =~ ^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/${family}:[0-9]+$ ]]; then
              echo "::error::$1 could not be put back: registering ${2##*/} again answered '${arn}', not a revision of ${family}."; return 1
            fi
            echo "${2##*/} is inactive (deregistered since the release recorded it): registered again from its recorded definition as ${arn##*/}."
            LOCK_LIVE_REVISION="${arn}"
          }
          lock_put_back() {  # lock_put_back <record file>: every service in previous back to its revision (first-deploy: to 0), services-stable, the sandbox aliases, an issue
            local kind svc td fn ver stable=""
            if ! python3 -c '
          import json, re, sys
          r = json.load(open(sys.argv[1]))
          prev, lam = r.get("previous") or {}, r.get("previous_lambda") or {}
          for s, td in prev.items():
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", s):
                  sys.exit("bad previous entry: %r" % s)
              if td == "first-deploy":   # first deployed by this release: no revision to go back to, so it is scaled to 0
                  print("first", s, "-")
              elif re.fullmatch(r"arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/[A-Za-z0-9_-]+:[0-9]+", td):
                  print("service", s, td)
              else:
                  sys.exit("bad previous entry: %r" % s)
          for f, v in lam.items():
              if not (re.fullmatch(r"[A-Za-z0-9_-]+", f) and str(v).isdigit()):
                  sys.exit("bad previous_lambda entry: %r" % f)
              print("lambda", f, v)' "$1" > lock-put-back.txt; then
              echo "::error::The record's previous revisions are unreadable: nothing can be put back."; return 1
            fi
            while read -r kind svc td; do
              case "${kind}" in
                service)
                  if ! lock_live_revision "${svc}" "${td}"; then return 1; fi
                  td="${LOCK_LIVE_REVISION}"
                  if ! aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${td}" >/dev/null; then
                    echo "::error::${svc} could not be put back on ${td##*/}."; return 1
                  fi
                  echo "Put ${svc} back on ${td##*/}." ;;
                first)
                  if ! aws ecs update-service --cluster "${NAME}" --service "${svc}" --desired-count 0 >/dev/null; then
                    echo "::error::${svc}, first deployed by this release, could not be scaled to 0."; return 1
                  fi
                  echo "Scaled ${svc} to 0: this release deployed it first, so it has no revision to go back to." ;;
                *) continue ;;
              esac
              stable="${stable} ${svc}"
            done < lock-put-back.txt
            if [ -n "${stable}" ]; then
              # shellcheck disable=SC2086
              if ! aws ecs wait services-stable --cluster "${NAME}" --services ${stable} && ! aws ecs wait services-stable --cluster "${NAME}" --services ${stable}; then
                echo "::error::The services put back did not become stable in 20 minutes:${stable}."; return 1
              fi
            fi
            while read -r kind fn ver; do
              if [ "${kind}" != "lambda" ]; then continue; fi
              if ! aws lambda update-alias --function-name "${fn}" --name live --function-version "${ver}" >/dev/null; then
                echo "::error::The live alias of ${fn} could not be put back on version ${ver}."; return 1
              fi
              echo "Put the live alias of ${fn} back on version ${ver}."
            done < lock-put-back.txt
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "Release $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("commit","?"))' "$1") to ${ENVIRONMENT} put back" \
              --body "The release did not confirm an end, so every service was put back on the revision recorded before it (foundation-playbook §5.4a). Run: $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("run","?"))' "$1")" >/dev/null \
              || echo "::warning::The issue naming the put-back could not be opened."
          }
          lock_finish() {  # acts on this run's record by its phase, then unlocks; a record that is not this run's is left alone
            local key keys etag holder phase="" task="" first="" repair rc live code deadline mine=()
            if ! keys=$(lock_keys); then return 1; fi
            read -r -a keys <<< "$(lock_reverse "${keys}")"
            for key in "${keys[@]}"; do   # the scope keys first, release.json last
              if ! etag=$(lock_read "${key}" "lock-finish-${key##*/}"); then
                echo "::error::s3://${LOCK_BUCKET}/${key} is unreadable; it stays until a later release sees this run has finished."; return 1
              fi
              if [ "${etag}" = "absent" ]; then continue; fi
              if ! holder=$(lock_holder "lock-finish-${key##*/}"); then
                echo "::error::s3://${LOCK_BUCKET}/${key} holds no readable record; it is left in place."; return 1
              fi
              if ! lock_is_mine "${holder}"; then
                echo "s3://${LOCK_BUCKET}/${key} is held by $(lock_url "$(echo "${holder}" | cut -d' ' -f1)" "$(echo "${holder}" | cut -d' ' -f2)") under another token, not this call; it is left in place."
                continue
              fi
              repair=$(echo "${holder}" | cut -d' ' -f8)
              if [ "${repair}" != "-" ]; then
                echo "s3://${LOCK_BUCKET}/${key} is being repaired by run ${repair}; this run changes nothing."
                return 0
              fi
              mine+=("${key}=${etag}")
              if [ -z "${first}" ]; then first="lock-finish-${key##*/}"; phase=$(echo "${holder}" | cut -d' ' -f6); task=$(echo "${holder}" | cut -d' ' -f7); fi
            done
            if [ "${#mine[@]}" -eq 0 ]; then echo "No release lock of this run is held."; return 0; fi
            echo "The release lock of this run is in phase ${phase}."
            case "${phase}" in
              migrating)
                # The migrate task is never stopped and a migration never rolled back: wait for it, and keep the key while it runs.
                deadline=$((SECONDS + LOCK_MIGRATE_WAIT_SECONDS))
                while :; do
                  rc=0
                  live=$(lock_migrate_live "${task}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}") || rc=$?
                  if [ "${rc}" -eq 2 ]; then return 1; fi
                  if [ "${rc}" -eq 1 ]; then break; fi
                  if [ "${SECONDS}" -ge "${deadline}" ]; then
                    echo "::error::The migrate task ${live} has not stopped after ${LOCK_MIGRATE_WAIT_SECONDS} s; the key is kept while it runs (a migrate task is never stopped)."; return 1
                  fi
                  echo "Waiting for the migrate task ${live} to stop."
                  sleep "${LOCK_POLL_SECONDS}"
                done
                code=$(lock_migrate_exit "${task}")
                echo "The migrate task ${task} has stopped; exit code ${code}." | tee -a "${GITHUB_STEP_SUMMARY}" ;;
              rolling)
                echo "The rollout began and nothing confirmed an end: every service goes back to its recorded revision."
                if ! lock_put_back "${first}"; then
                  echo "::error::The put-back failed, so the key stays rolling: run cancel-release.yml in ${GITHUB_REPOSITORY} to put the services back and free it. Until cancel-release.yml exists (.github #55), the manual path: read the key with python3 .github/workspace/lock_status.py ${ENVIRONMENT}, then the founder only deletes it with the conditional delete (aws s3api delete-object --if-match <its ETag>)."; return 1
                fi ;;
            esac
            for key in "${mine[@]}"; do
              rc=0
              lock_delete "${key%%=*}" "${key#*=}" || rc=$?
              case "${rc}" in
                0) echo "Released s3://${LOCK_BUCKET}/${key%%=*}." ;;
                2) echo "::warning::s3://${LOCK_BUCKET}/${key%%=*} changed while it was being released; it is left in place." ;;
                *) return 1 ;;
              esac
            done
          }
          lock_frozen_mine() {  # lock_frozen_mine -> 0 frozen.json names this branch (LOCK_FROZEN_HEAD: its infra_head or -; LOCK_FROZEN_ETAG), 1 another branch or absent, 2 unreadable
            local branch repo ref
            LOCK_FROZEN_HEAD=""
            if ! LOCK_FROZEN_ETAG=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${LOCK_FROZEN_ETAG}" = "absent" ]; then return 1; fi
            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref LOCK_FROZEN_HEAD <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_freeze() {  # preprod-frozen (§5.4a "Freeze and thaw", §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            # 1. frozen.json without infra_head: from then on every infra take is refused, and so is every hotfix take.
            # 2. While infra.json is held by a live run, wait (the wait rules of §5.4a: the cap, the re-mint); that run keeps
            #    its keys until its own unlock. A holder whose run has finished is not waited for.
            # 3. settled() for infra (LOCK_ORDER_SCRIPT, the release order at this workflow's own commit): infra_head, the
            #    head of infra's latest successful release run, and infra_settled, true only on a clean settled verdict.
            local etag rc held holder hrepo hrun rest start tries
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            rc=0
            lock_put "${FROZEN_KEY}" lock-frozen-mine.json '*' || rc=$?
            case "${rc}" in
              0) etag="${LOCK_PUT_ETAG}"
                 echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY}); every infra take is refused from now on." ;;
              2|3)
                rc=0; lock_frozen_mine || rc=$?
                if [ "${rc}" -eq 2 ] || { [ "${rc}" -eq 1 ] && [ "${LOCK_FROZEN_ETAG}" = "absent" ]; }; then echo "::error::preprod-frozen could not be read back."; return 1; fi
                if [ "${rc}" -ne 0 ]; then return 1; fi
                if [ "${LOCK_FROZEN_HEAD}" != "-" ]; then echo "${ENVIRONMENT} is already frozen for this branch (infra_head ${LOCK_FROZEN_HEAD})."; return 0; fi
                etag="${LOCK_FROZEN_ETAG}"
                cp lock-frozen.json lock-frozen-mine.json
                echo "${ENVIRONMENT} is already frozen for this branch, without infra_head yet: this run records it." ;;
              *) return 1 ;;
            esac
            start=${SECONDS}
            while :; do
              if ! lock_remint_if_due; then return 1; fi
              rc=0; lock_frozen_mine || rc=$?
              if [ "${rc}" -ne 0 ] || [ "${LOCK_FROZEN_ETAG}" != "${etag}" ]; then
                echo "::error::preprod-frozen changed while freeze waited (thawed, or written again), so freeze stops and records nothing."; return 1
              fi
              if ! held=$(lock_read locks/infra.json lock-infra.json); then
                echo "::error::s3://${LOCK_BUCKET}/locks/infra.json is unreadable, so infra_head is not recorded and every hotfix take stays refused."; return 1
              fi
              if [ "${held}" = "absent" ]; then break; fi
              if ! holder=$(lock_holder lock-infra.json); then
                echo "::error::s3://${LOCK_BUCKET}/locks/infra.json holds no readable record, so infra_head is not recorded and every hotfix take stays refused."; return 1
              fi
              read -r hrepo hrun rest <<< "${holder}"
              if lock_run_finished "${hrepo}" "${hrun}"; then
                echo "s3://${LOCK_BUCKET}/locks/infra.json is held by $(lock_url "${hrepo}" "${hrun}"), which is not running: not waited for (the next infra take removes it)."
                break
              fi
              if [ $((SECONDS - start)) -ge "${LOCK_WAIT_CAP_SECONDS}" ]; then
                lock_fail_waiting "${hrepo}" infra "${hrun}"
                return 1
              fi
              echo "Freeze waits: s3://${LOCK_BUCKET}/locks/infra.json is held by $(lock_url "${hrepo}" "${hrun}"), a live infra release, which keeps its keys until its own unlock."
              sleep "${LOCK_POLL_SECONDS}"
            done
            # settled() for infra; a read error, or no verdict at all, records infra_settled false with the error, never true.
            if ! GH_TOKEN="${LOCK_GH_TOKEN}" python3 -c '
          import json, os, re, subprocess, sys
          script, head, settled, reason = os.environ.get("LOCK_ORDER_SCRIPT", ""), None, False, ""
          try:
              if not script or not os.path.isfile(script):
                  raise RuntimeError("no release-order script at %r" % script)
              out = subprocess.run([sys.executable, script, "settled", "--scope", "infra", "--json"], capture_output=True, text=True, timeout=900)
              lines = out.stdout.strip().splitlines()
              doc = json.loads(lines[-1]) if out.returncode == 0 and lines else None
              if not isinstance(doc, dict):
                  raise RuntimeError("settled --scope infra gave no verdict (exit %d): %s" % (out.returncode, (out.stderr or out.stdout).strip()[:300]))
              head, reason = doc.get("success_head"), str(doc.get("reason", ""))
              settled = doc.get("verdict") == "settled" and doc.get("error") is False
          except Exception as error:
              reason = "the release order could not be read: %s" % error
          if not (isinstance(head, str) and re.fullmatch(r"[0-9a-f]{40}", head)):
              print("::error::infra_head cannot be recorded (the head of the latest successful infra release run is %r; %s), so every hotfix take stays refused; re-run freeze." % (head, reason))
              sys.exit(1)
          record = json.load(open("lock-frozen-mine.json"))
          record.update(infra_head=head, infra_settled=settled, infra_settled_reason=reason)
          json.dump(record, open("lock-frozen-record.json", "w"))
          print("infra_head %s, infra_settled %s: %s" % (head, "true" if settled else "false", reason))'; then
              return 1
            fi
            tries=0
            while :; do
              rc=0
              lock_put "${FROZEN_KEY}" lock-frozen-record.json "${etag}" || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "Recorded infra_head and infra_settled in s3://${LOCK_BUCKET}/${FROZEN_KEY}."; return 0; fi
              if [ "${rc}" -eq 1 ]; then return 1; fi
              rc=0; lock_frozen_mine || rc=$?
              if [ "${rc}" -eq 0 ] && [ "${LOCK_FROZEN_HEAD}" != "-" ]; then echo "Another freeze run of this branch has recorded infra_head ${LOCK_FROZEN_HEAD}."; return 0; fi
              if [ "${rc}" -eq 0 ] && [ "${LOCK_FROZEN_ETAG}" = "${etag}" ] && [ "${tries}" -lt 3 ]; then tries=$((tries + 1)); sleep 1; continue; fi   # a 409 on an unchanged record
              echo "::error::preprod-frozen changed before infra_head could be recorded (thawed, or written again), so freeze records nothing."
              return 1
            done
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          if [ "${WATCH}" = "success" ]; then lock_write_phase "done" || exit 1; else lock_write_phase locked || exit 1; fi

  finish:
    # Rows 10 and 11 and the unlock, after every run that took the lock, whatever happened. In order: the deployment
    # record and notice; the unlock (always, only with the token the prepare job took the lock with; if this job itself
    # is lost, the next release that waits sees this run has finished and takes the lock over). No packages scope: the
    # API client publish is the api-client job after it.
    needs: [prepare, build-image, build-web, db-bootstrap, deploy, verify]
    if: ${{ always() && needs.prepare.result != 'skipped' && inputs.environment != 'prod' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    # Above the sum of its steps: migrate wait 15, put-back 20, deployment record 10, the unlock (playbook §5.4a; a named
    # TIMEOUT_EXCEPTIONS entry).
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      deployments: write
      issues: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        id: guard
        # Skipped when prepare never took the lock (for example it failed at a wait cap): nothing to record, and the only
        # failed job is the one with the re-run message.
        if: ${{ always() && needs.prepare.outputs.attempt != '' }}
        env:
          LOCKED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - name: Deployment record and the team notice in the run summary (commit, services, result, durations)
        # Row 10, after every run that got past the version, whatever the result (delivery-pipelines §12: every run
        # writes a GitHub deployment). No git tag and no GitHub release in preprod: promote.yml creates v<version>.
        if: ${{ always() && steps.guard.outcome == 'success' && !inputs.dry-run && needs.prepare.outputs.commit != '' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          NEXT_VERSION: ${{ needs.prepare.outputs.version }}
          DIGESTS: ${{ needs.build-image.outputs.digests || needs.build-web.outputs.digests }}
          SERVICES: ${{ needs.deploy.outputs.services }}
          WATCH: ${{ needs.verify.outputs.watch }}
          ROLLBACK: ${{ needs.verify.outputs.rollback }}
          STARTED: ${{ needs.prepare.outputs.started }}
          STABLE_AT: ${{ needs.deploy.outputs.stable-at }}
          MERGED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, time
          e = os.environ
          ok = e["WATCH"] == "success"
          now = int(time.time())
          def minutes(seconds):
              return "%dm %02ds" % divmod(max(seconds, 0), 60)
          merge_to_running = "not running (no stable rollout)"
          if e.get("STABLE_AT") and e.get("MERGED_AT"):
              merged = datetime.datetime.fromisoformat(e["MERGED_AT"].replace("Z", "+00:00")).timestamp()
              merge_to_running = minutes(int(e["STABLE_AT"]) - int(merged))
          run = "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"])
          result = "success" if ok else ("failure, rolled back" if e["ROLLBACK"] == "success" else "failure")
          notice = {
              "commit": e["COMMIT"], "next_version": e["NEXT_VERSION"], "environment": e["ENVIRONMENT"],
              "services": json.loads(e["SERVICES"] or "[]"), "digests": json.loads(e["DIGESTS"] or "{}"),
              "sboms": run + " (artifacts sbom-<image>; also attested on each digest)", "result": result,
              "duration": minutes(now - int(e["STARTED"])), "merge_to_running": merge_to_running, "run": run,
          }
          json.dump({"ref": e["GITHUB_SHA"], "environment": e["ENVIRONMENT"], "auto_merge": False, "required_contexts": [],
                     "description": e["COMMIT"], "payload": notice}, open("deployment.json", "w"))
          json.dump({"state": "success" if ok else "failure", "description": "%s %s" % (e["COMMIT"], result),
                     "log_url": run}, open("status.json", "w"))
          with open(e["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("Release %s to %s: %s.\n\n" % (e["COMMIT"], e["ENVIRONMENT"], result))
              for k in ("services", "digests", "duration", "merge_to_running", "sboms"):
                  v = notice[k]
                  s.write("- %s: %s\n" % (k, v if isinstance(v, str) else json.dumps(v)))
          if not ok:
              print("::error::Release %s to %s: %s." % (e["COMMIT"], e["ENVIRONMENT"], result))
          PY
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" --input deployment.json --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --input status.json >/dev/null
      - if: ${{ always() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Release the release lock
        # By the record's phase, never by cancelled() (playbook §5.4a "Rollback on cancel"): locked or done, unlock;
        # migrating, wait for the task to stop (never stop it), then unlock; rolling, put every service back on its
        # recorded revision and unlock only when that succeeded. It reads what to undo from the record, never from the
        # deploy job's outputs. Runs even when the guard failed (a re-run of only some jobs): only a record with exactly
        # this token (or, with no token, this run and attempt) is acted on.
        if: ${{ always() }}
        timeout-minutes: 40   # its migrate wait 15 and put-back 20, plus 5 for the reads and deletes (playbook §5.4a)
        env:
          LOCK_TOKEN: ${{ needs.prepare.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # Release locks per scope (foundation-playbook §5.4, §5.4a): one key per scope in s3://onepeek-<env>-deploy/locks/
          # (infra.json, backend.json, web.json, mcp.json), taken with a conditional write (If-None-Match: *) and removed with a
          # conditional delete on its ETag (If-Match). Expand step of the move off locks/release.json: every take set starts with
          # release.json, and every reader reads it too. An app takes release.json and its own scope's key; infra takes
          # release.json, then infra.json, backend.json, web.json and mcp.json in that fixed order. Every take is try-or-release:
          # when one key is held by a live run, the keys taken so far are deleted (in reverse order, each on the ETag of its own
          # write) and the run waits holding nothing, so no run ever waits while it holds a key.
          # The record names the repo, run ID, run attempt, commit, start time, a random token, the scope and the phase (locked,
          # migrating, rolling or done). Only the holder (or the one repairer that claimed it) writes it, with If-Match on the
          # ETag it read; a 412 means the key is lost, a 409 is re-read and retried up to 3 times while the ETag is unchanged. A key whose holder's run has
          # finished is taken over by its phase: locked or done, removed; migrating, removed only once the migrate task has
          # stopped; rolling, never (cancel-release.yml repairs it). Anything unreadable fails closed: no lock, no deploy.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock once freeze has recorded infra_head, every
          # other take (infra's included) fails with the reason, and every take reads it again after taking its keys.
          # Waits fit the runners (§5.4a): every wait counts towards LOCK_WAIT_CAP_SECONDS; a run of the same scope holding the key
          # is waited for at most LOCK_WAIT_SECONDS; at a limit the step fails with "waiting for <holder> (<scope>, run <id>);
          # re-run", holding nothing. Every LOCK_REMINT_SECONDS inside a wait the App token and the AWS role session are minted again.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_LEGACY_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          LOCK_OWNER="${GITHUB_REPOSITORY%%/*}"
          LOCK_MINTED=${SECONDS}
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_scope_repo() {  # lock_scope_repo <scope> -> the scope's owning repo
            case "$1" in
              infra) echo "${LOCK_OWNER}/onepeek-infra" ;;
              backend) echo "${LOCK_OWNER}/backend-service" ;;
              web) echo "${LOCK_OWNER}/onepeek-web" ;;
              mcp) echo "${LOCK_OWNER}/mcp-athena" ;;
              *) return 1 ;;
            esac
          }
          lock_repo_scope() {  # lock_repo_scope <owner/repo> -> the scope that repo owns; 1 when it owns none
            case "${1#*/}" in
              onepeek-infra) echo infra ;;
              backend-service) echo backend ;;
              onepeek-web) echo web ;;
              mcp-athena) echo mcp ;;
              *) return 1 ;;
            esac
          }
          lock_keys() {  # the take set of LOCK_SCOPE, in take order
            case "${LOCK_SCOPE:-}" in
              infra) echo "${LOCK_LEGACY_KEY} locks/infra.json locks/backend.json locks/web.json locks/mcp.json" ;;
              backend|web|mcp) echo "${LOCK_LEGACY_KEY} locks/${LOCK_SCOPE}.json" ;;
              *) echo "::error::No lock scope (LOCK_SCOPE='${LOCK_SCOPE:-}'): it must be infra, backend, web or mcp." >&2; return 1 ;;
            esac
          }
          lock_reverse() {  # lock_reverse <words> -> the words in reverse order
            local out="" w words
            read -r -a words <<< "$1"
            for w in "${words[@]}"; do out="${w} ${out}"; done
            echo "${out}"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
