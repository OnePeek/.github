          lock_fail_waiting() {  # lock_fail_waiting <holder> <scope> <run id>: the cap message; LOCK_CAPPED=1 lets a caller end at its "Wait cap reached (re-run)" step (§5.4a rule 2)
            echo "::error::waiting for $1 ($2, run $3); re-run"
