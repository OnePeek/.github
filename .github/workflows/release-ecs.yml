                  rolling)
                    echo "::error::s3://${LOCK_BUCKET}/$1 is held rolling by $(lock_url "${repo}" "${run}"), whose run has ended with its services part-way between two versions: nothing deploys until cancel-release.yml in ${repo} puts them back and frees it (delivery-pipelines UC-DEL-009). Until cancel-release.yml exists (.github #55), the manual path: read the key with python3 .github/workspace/lock_status.py ${ENVIRONMENT}, then the founder only deletes it with the conditional delete (aws s3api delete-object --if-match <its ETag>)."
