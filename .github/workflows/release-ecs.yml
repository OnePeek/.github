            # step fails (§5.4a rule 2; ruling R-S2l0-2).
            if [ -n "${LOCK_GIVEBACK_FAILED:-}" ]; then echo "::error::A key could not be given back during the wait, so this is not a clean wait cap."; return 1; fi
