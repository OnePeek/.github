              # infra run included, under the release-lock row's cap only.
              if [ "${scope}" = "${LOCK_SCOPE}" ] && [ "${LOCK_SCOPE}" != "infra" ]; then LOCK_BLOCKER="${repo} ${scope} ${run} own"; else LOCK_BLOCKER="${repo} ${scope} ${run} other"; fi
