          VERSION: "" # the version tag is added only on promotion to prod (playbook §5.2)
          ORDERS: ${{ steps.index.outputs.groups }}
          ALLOW_DROP: ${{ inputs.allow-drop }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
