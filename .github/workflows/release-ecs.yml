                --jq '[.workflow_runs[] | select(.status != "completed") | .id] | first // ""' 2>"${LOCK_ERR}"); then
              echo "::error::The infra release runs cannot be read: $(cat "${LOCK_ERR}")" >&2; return 2
            fi
