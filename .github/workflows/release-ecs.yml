              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              # Per service, not per container: a name may move between containers (the placeholder revision holds a
              # sidecar'"'"'s variables in the one container the real template splits in two). The container is context only.
              new = set().union(*(names(c, "environment") | names(c, "secrets") for c in containers))
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
          aws ecr get-login-password | cosign login "${IMAGE_REF%%/*}" --username AWS --password-stdin >/dev/null  # cosign reads the signature from ECR (first live release: 401)
          cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${IMAGE_REF}" >/dev/null
          # One line per order, lowest first: the services of that order, separated by spaces.
          echo "${ORDERS}" | python3 -c "import json,sys;print('\n'.join(' '.join(g) for g in json.load(sys.stdin)))" > groups.txt
          count=0
          while read -r group <&3; do
            for svc in ${group}; do
              mode=$(current_td "${svc}" "current-${svc}.json")
              render "${svc}" "${mode}" > "td-${svc}.json"; count=$((count + 1))
            done
          done 3< groups.txt
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: rendered ${count} task definitions; signature verified."; exit 0; fi
          while read -r group <&3; do
            for svc in ${group}; do
              arn=$(aws ecs register-task-definition --cli-input-json "file://td-${svc}.json" --query taskDefinition.taskDefinitionArn --output text)
              aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${arn}" >/dev/null
              echo "${svc} -> ${arn##*/}"
            done
            # shellcheck disable=SC2086
            if ! aws ecs wait services-stable --cluster "${NAME}" --services ${group}; then
              echo "::error::A service of ${group} did not become stable (the ECS circuit breaker has rolled it back)."; exit 1
            fi
          done 3< groups.txt
          echo "stable-at=$(date +%s)" >> "$GITHUB_OUTPUT"   # merge-to-running time in the notice (delivery-pipelines §12, §14)
      - name: Lambda sandbox functions, new version, move the live alias (only when sandbox is released)
        timeout-minutes: 10
        if: ${{ !inputs.dry-run && contains(inputs.extra-images, 'sandbox') }}
        env:
          SANDBOX_REF: ${{ env.REGISTRY }}/onepeek-${{ inputs.environment }}/sandbox@${{ fromJSON(env.DIGESTS).sandbox }}
        run: |
          for fn in parse fetch; do
            aws lambda update-function-code --function-name "${NAME}-sandbox-${fn}" \
              --image-uri "${SANDBOX_REF}" >/dev/null
            aws lambda wait function-updated --function-name "${NAME}-sandbox-${fn}"
            ver=$(aws lambda publish-version --function-name "${NAME}-sandbox-${fn}" --query Version --output text)
            aws lambda update-alias --function-name "${NAME}-sandbox-${fn}" --name live --function-version "${ver}" >/dev/null
          done
      - name: Verify, render, check the launch settings, register ops and record its revision (6b; nothing is run)
        if: ${{ inputs.image == 'backend' }}
        timeout-minutes: 10
        env:
          SIGNING_KEY: ${{ inputs.signing-key }}
          VERSION: "" # the version tag is added only on promotion to prod (playbook §5.2)
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
            aws ecs describe-task-definition --task-definition "${td}" --query taskDefinition --output json > "$2" || return 1
            echo "$2"
          }
          render() {  # render <service> <one-off | first-deploy | current task definition file> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              # Per service, not per container: a name may move between containers (the placeholder revision holds a
              # sidecar'"'"'s variables in the one container the real template splits in two). The container is context only.
              new = set().union(*(names(c, "environment") | names(c, "secrets") for c in containers))
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
          aws ecr get-login-password | cosign login "${IMAGE_REF%%/*}" --username AWS --password-stdin >/dev/null  # cosign reads the signature from ECR (first live release: 401)
          cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${IMAGE_REF}" >/dev/null
          # ops exists only when the services file names it (aws-stack §16 first preprod run: ops is out until built).
          aws s3 cp "s3://${NAME}-deploy/services.${ENVIRONMENT}.yaml" services.yaml --only-show-errors
          if ! "${RUNNER_TEMP}/tools/bin/python3" -c "import sys,yaml;sys.exit(0 if 'ops' in (yaml.safe_load(open('services.yaml')).get('services') or {}) else 1)"; then
            echo "ops is not in the services file; nothing to register."; exit 0
          fi
          # Read the file instead of head-object: this role has GetObject on run/* but no ListBucket, so head-object on a missing key says 403.
          aws s3 cp "s3://${NAME}-deploy/run/ops.json" run-ops.json --only-show-errors   # its launch settings exist
          render ops one-off > ops.json
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: ops renders and its launch settings exist."; exit 0; fi
          arn=$(aws ecs register-task-definition --cli-input-json file://ops.json --query taskDefinition.taskDefinitionArn --output text)
          aws ssm put-parameter --name "/onepeek/${ENVIRONMENT}/release/backend/one_off/ops" --type String --overwrite --value "${arn}" >/dev/null
          echo "Registered ${arn##*/} (not run)."

  verify:
    # Rows 7 to 9 in one job: smoke, the 10-minute watch, and the rollback when the rollout, the ops registration, smoke
    # or watch failed (E2, E3). It also runs after a deploy job that failed once the rollout had started (`previous`
    # recorded), and then only rolls back. Outputs: the watch and rollback outcomes, for the notice and the API client.
    needs: [prepare, build-image, build-web, deploy]
    if: ${{ !cancelled() && !inputs.dry-run && (needs.deploy.result == 'success' || (needs.deploy.result == 'failure' && needs.deploy.outputs.previous != '')) }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 60   # above the sum of its step limits (10 + 5 + 10 + 12 + 20), so a hang ends as a failed step and the rollback still runs
    permissions:
      contents: read
      id-token: write
      issues: write
    outputs:
      watch: ${{ steps.watch.outcome }}
      rollback: ${{ steps.rollback.outcome }}
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        id: guard
        env:
          LOCKED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: The deploy job finished its rollout (if it failed, only the rollback runs)
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "${DEPLOY_RESULT}" != "success" ]; then
            echo "::error::The deploy job failed after the rollout started (${DEPLOY_RESULT}): no smoke or watch; every service is put back."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline readiness through the edge (backend /api/status, web /sign-in), always
        timeout-minutes: 10
        env:
          DOMAIN: ${{ inputs.domain }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [ "${IMAGE}" = "backend" ]; then path="/api/status"; else path="/sign-in"; fi
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 10 --retry-all-errors "https://${DOMAIN}${path}" >/dev/null
      - name: Every service's task definition carries this release's image digest (describe-services; no ecs:ListTasks)
        timeout-minutes: 5
        env:
          DIGEST: ${{ needs.build-image.outputs.digest || needs.build-web.outputs.digest }}
          SERVICES: ${{ needs.deploy.outputs.services }}
        run: |
          for svc in $(echo "${SERVICES}" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            td=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text)
            # The container this release filled (the only one, or a daemon's sidecar) runs this digest.
            images=$(aws ecs describe-task-definition --task-definition "${td}" --query 'taskDefinition.containerDefinitions[].image' --output json)
            if ! IMAGES="${images}" python3 -c "import json,os,sys;sys.exit(0 if any(i.endswith('@' + os.environ['DIGEST']) for i in json.loads(os.environ['IMAGES'])) else 1)"; then
              echo "::error::${svc} runs ${images}, not digest ${DIGEST}."; exit 1
            fi
          done
      - name: The repo's own smoke checks against the domain, in addition (UC-DEL-001 row 7; @smoke journeys)
        timeout-minutes: 10
        env:
          SCRIPT: ${{ inputs.smoke-script }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          case "${SCRIPT}" in
            ""|/*|*..*) echo "::error::smoke-script must be a path inside the repository, got '${SCRIPT}'."; exit 1 ;;
          esac
          if [ ! -f "${SCRIPT}" ]; then
            echo "::warning::${SCRIPT} is not in this repository: only the baseline readiness and digest checks ran."
            echo "Warning: no ${SCRIPT} in the repository; only the baseline readiness and digest checks ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Without the deploy role's credentials or the means to request them again: black-box probes only.
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN bash "${SCRIPT}"
      - name: 10 minutes after stable, poll the rolled services' deploy alarms every 30 s
        id: watch
        timeout-minutes: 12
        env:
          SERVICES: ${{ needs.deploy.outputs.services }}
        run: |
          # aws-stack §10.4: each service has exactly two deploy alarms, onepeek-<env>-deploy-<service>-errors and
          # -latency; this release watches only those of the services it rolled (by exact name: a prefix for `api` would
          # also match `api-critical`), so a web release never fails on an api alarm. They may be switched off
          # (deploy_alarms_enabled, off until launch); then the watch cannot catch anything, which the run says out loud.
          mapfile -t names < <(printf '%s' "${SERVICES:-[]}" | NAME="${NAME}" python3 -c '
          import json, os, re, sys
          for s in json.load(sys.stdin):
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", s):
                  sys.exit(f"bad service name {s!r}")
              for kind in ("errors", "latency"):
                  print(os.environ["NAME"] + "-deploy-" + s + "-" + kind)
          ')
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::The rollout reported no services, so there is nothing to watch."
            exit 1
          fi
          poll() {  # $@: extra describe-alarms options; prints the matching alarm names on one line
            aws cloudwatch describe-alarms --alarm-names "${names[@]}" "$@" --query 'MetricAlarms[].AlarmName' --output text \
              | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//'
          }
          known=$(poll)
          if [ -z "${known}" ]; then
            echo "::warning::None of the deploy alarms ${names[*]} exists: the 10-minute watch cannot detect a regression."
            echo "Warning: none of the deploy alarms (${names[*]}) exists, so the watch could not detect a regression." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Watching: ${known}"
          fi
          end=$((SECONDS + 600))
          while [ "${SECONDS}" -lt "${end}" ]; do
            alarms=$(poll --state-value ALARM)
            if [ -n "${alarms}" ]; then echo "::error::Deploy alarms firing: ${alarms}"; exit 1; fi
            sleep 30
          done
          echo "No deploy alarm in 10 minutes."
      - name: Put every service back on the revision recorded before the rollout (versions stay aligned, E2/E3)
        id: rollback
        # On a failed rollout or ops registration (deploy failed after recording previous), smoke or watch: the
        # watch is the last check, so anything but its success rolls back. Never after a failed lock check.
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success' && steps.watch.outcome != 'success' }}
        timeout-minutes: 20
        env:
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
          HAS_SANDBOX: ${{ contains(inputs.extra-images, 'sandbox') && 'yes' || '' }}
        run: |
          if [ -z "${PREVIOUS}" ]; then echo "Nothing was recorded; the rollout never started."; exit 0; fi
          services=$(echo "${PREVIOUS}" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))")
          for svc in ${services}; do
            td=$(echo "${PREVIOUS}" | python3 -c "import json,sys;print(json.load(sys.stdin)['${svc}'])")
            if [ "${td}" = "first-deploy" ]; then   # no revision before this release: scaled to 0, as the put-back does (playbook §5.4a)
              aws ecs update-service --cluster "${NAME}" --service "${svc}" --desired-count 0 >/dev/null
              continue
            fi
            aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${td}" >/dev/null
          done
          # shellcheck disable=SC2086
          aws ecs wait services-stable --cluster "${NAME}" --services ${services}
          if [ -n "${HAS_SANDBOX}" ]; then
            for fn in parse fetch; do
              prev=$(aws lambda list-versions-by-function --function-name "${NAME}-sandbox-${fn}" --query 'Versions[-2].Version' --output text)
              aws lambda update-alias --function-name "${NAME}-sandbox-${fn}" --name live --function-version "${prev}" >/dev/null
            done
          fi
      - name: Open an issue naming the failure
        if: ${{ !cancelled() && steps.rollback.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "Release ${COMMIT} to ${ENVIRONMENT} rolled back" \
            --body "The release failed and every service was put back. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Record the end in the release lock (done after a clean watch, locked after a stable rollback)
        # Never in a cancelled run: then the record stays rolling and finish puts every service back (playbook §5.4a).
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success' && (steps.watch.outcome == 'success' || steps.rollback.outcome == 'success') }}
        env:
          WATCH: ${{ steps.watch.outcome }}
          LOCK_TOKEN: ${{ needs.prepare.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # Release locks per scope (foundation-playbook §5.4, §5.4a): one key per scope in s3://onepeek-<env>-deploy/locks/
          # (infra.json, backend.json, web.json, mcp.json), taken with a conditional write (If-None-Match: *) and removed with a
          # conditional delete on its ETag (If-Match). Expand step of the move off locks/release.json: every take set starts with
          # release.json, and every reader reads it too. An app takes release.json and its own scope's key; infra takes
          # release.json, then infra.json, backend.json, web.json and mcp.json in that fixed order. Every take is try-or-release:
          # when one key is held by a live run, the keys taken so far are deleted (in reverse order, each on the ETag of its own
          # write) and the run waits holding nothing, so no run ever waits while it holds a key.
          # The record names the repo, run ID, run attempt, commit, start time, a random token, the scope and the phase (locked,
          # migrating, rolling or done). Only the holder (or the one repairer that claimed it) writes it, with If-Match on the
          # ETag it read; a 412 means the key is lost, a 409 is re-read and retried up to 3 times while the ETag is unchanged. A key whose holder's run has
          # finished is taken over by its phase: locked or done, removed; migrating, removed only once the migrate task has
          # stopped; rolling, never (cancel-release.yml repairs it). Anything unreadable fails closed: no lock, no deploy.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock once freeze has recorded infra_head, every
          # other take (infra's included) fails with the reason, and every take reads it again after taking its keys.
          # Waits fit the runners (§5.4a): every wait counts towards LOCK_WAIT_CAP_SECONDS; a run of the same scope holding the key
          # is waited for at most LOCK_WAIT_SECONDS; at a limit the step fails with "waiting for <holder> (<scope>, run <id>);
          # re-run", holding nothing. Every LOCK_REMINT_SECONDS inside a wait the App token and the AWS role session are minted again.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_LEGACY_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          LOCK_OWNER="${GITHUB_REPOSITORY%%/*}"
          LOCK_MINTED=${SECONDS}
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_scope_repo() {  # lock_scope_repo <scope> -> the scope's owning repo
            case "$1" in
              infra) echo "${LOCK_OWNER}/onepeek-infra" ;;
              backend) echo "${LOCK_OWNER}/backend-service" ;;
              web) echo "${LOCK_OWNER}/onepeek-web" ;;
              mcp) echo "${LOCK_OWNER}/mcp-athena" ;;
              *) return 1 ;;
            esac
          }
          lock_repo_scope() {  # lock_repo_scope <owner/repo> -> the scope that repo owns; 1 when it owns none
            case "${1#*/}" in
              onepeek-infra) echo infra ;;
              backend-service) echo backend ;;
              onepeek-web) echo web ;;
              mcp-athena) echo mcp ;;
              *) return 1 ;;
            esac
          }
          lock_keys() {  # the take set of LOCK_SCOPE, in take order
            case "${LOCK_SCOPE:-}" in
              infra) echo "${LOCK_LEGACY_KEY} locks/infra.json locks/backend.json locks/web.json locks/mcp.json" ;;
              backend|web|mcp) echo "${LOCK_LEGACY_KEY} locks/${LOCK_SCOPE}.json" ;;
              *) echo "::error::No lock scope (LOCK_SCOPE='${LOCK_SCOPE:-}'): it must be infra, backend, web or mcp." >&2; return 1 ;;
            esac
          }
          lock_reverse() {  # lock_reverse <words> -> the words in reverse order
            local out="" w words
            read -r -a words <<< "$1"
            for w in "${words[@]}"; do out="${w} ${out}"; done
            echo "${out}"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token> <scope> <phase> <migrate task> <repair run>"; 1 when not a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt = record["repo"], str(record["run_id"]), str(record["run_attempt"])
              token, scope, phase = str(record.get("token", "-")), str(record.get("scope", "-")), str(record.get("phase", "locked"))
              task, repair = str(record.get("migrate_task") or "-"), str(record.get("repair_run") or "-")
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)
                  and scope in ("infra", "backend", "web", "mcp", "-") and phase in ("locked", "migrating", "rolling", "done")
                  and re.fullmatch(r"arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task/[A-Za-z0-9_/-]+|-", task) and re.fullmatch(r"[0-9]+-[0-9]+|-", repair)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token, scope, phase, task, repair)' "$1"
          }
          lock_put() {  # lock_put <key> <file> <etag | *> -> 0 written (LOCK_PUT_ETAG is the new ETag), 2 lost (412, or gone), 3 conflict (409), 1 any other answer
            local msg cond=(--if-match "$3")
            LOCK_PUT_ETAG=""
            if [ "$3" = "*" ]; then cond=(--if-none-match '*'); fi
            # No encryption flags: the bucket default applies (aws-stack §16).
