            done
          }
          lock_edge_busy() {  # 0 while infra.json is held by a live run or an infra release run is queued or running (LOCK_BLOCKER set), 1 not, 2 unreadable
            local live etag holder repo run rest infra
            infra=$(lock_scope_repo infra)
