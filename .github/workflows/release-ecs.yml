                echo "The migrate task ${task} has stopped; exit code ${code}." | tee -a "${GITHUB_STEP_SUMMARY}" ;;
              rolling)
                echo "The rollout began and nothing confirmed an end: every service goes back to its recorded revision."
                if ! lock_put_back "${first}"; then
                  echo "::error::The put-back failed, so the key stays rolling: run cancel-release.yml in ${GITHUB_REPOSITORY} to put the services back and free it. Until cancel-release.yml exists (.github #55), the manual path: read the key with python3 .github/workspace/lock_status.py ${ENVIRONMENT}, then the founder only deletes it with the conditional delete (aws s3api delete-object --if-match <its ETag>)."; return 1
                fi ;;
            esac
            for key in "${mine[@]}"; do
              rc=0
              lock_delete "${key%%=*}" "${key#*=}" || rc=$?
              case "${rc}" in
                0) echo "Released s3://${LOCK_BUCKET}/${key%%=*}." ;;
                2) echo "::warning::s3://${LOCK_BUCKET}/${key%%=*} changed while it was being released; it is left in place." ;;
                *) return 1 ;;
              esac
            done
          }
          lock_frozen_mine() {  # lock_frozen_mine -> 0 frozen.json names this branch (LOCK_FROZEN_HEAD: its infra_head or -; LOCK_FROZEN_ETAG), 1 another branch or absent, 2 unreadable
            local branch repo ref
            LOCK_FROZEN_HEAD=""
            if ! LOCK_FROZEN_ETAG=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${LOCK_FROZEN_ETAG}" = "absent" ]; then return 1; fi
            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref LOCK_FROZEN_HEAD <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_freeze() {  # preprod-frozen (§5.4a "Freeze and thaw", §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            # 1. frozen.json without infra_head: from then on every infra take is refused, and so is every hotfix take.
            # 2. While infra.json is held by a live run, wait (the wait rules of §5.4a: the cap, the re-mint); that run keeps
            #    its keys until its own unlock. A holder whose run has finished is not waited for.
            # 3. settled() for infra (LOCK_ORDER_SCRIPT, the release order at this workflow's own commit): infra_head, the
            #    head of infra's latest successful release run, and infra_settled, true only on a clean settled verdict.
            local etag rc held holder hrepo hrun rest start tries
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            rc=0
            lock_put "${FROZEN_KEY}" lock-frozen-mine.json '*' || rc=$?
            case "${rc}" in
              0) etag="${LOCK_PUT_ETAG}"
                 echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY}); every infra take is refused from now on." ;;
              2|3)
                rc=0; lock_frozen_mine || rc=$?
                if [ "${rc}" -eq 2 ] || { [ "${rc}" -eq 1 ] && [ "${LOCK_FROZEN_ETAG}" = "absent" ]; }; then echo "::error::preprod-frozen could not be read back."; return 1; fi
                if [ "${rc}" -ne 0 ]; then return 1; fi
                if [ "${LOCK_FROZEN_HEAD}" != "-" ]; then echo "${ENVIRONMENT} is already frozen for this branch (infra_head ${LOCK_FROZEN_HEAD})."; return 0; fi
                etag="${LOCK_FROZEN_ETAG}"
                cp lock-frozen.json lock-frozen-mine.json
                echo "${ENVIRONMENT} is already frozen for this branch, without infra_head yet: this run records it." ;;
              *) return 1 ;;
            esac
            start=${SECONDS}
            while :; do
              if ! lock_remint_if_due; then return 1; fi
              rc=0; lock_frozen_mine || rc=$?
              if [ "${rc}" -ne 0 ] || [ "${LOCK_FROZEN_ETAG}" != "${etag}" ]; then
                echo "::error::preprod-frozen changed while freeze waited (thawed, or written again), so freeze stops and records nothing."; return 1
              fi
              if ! held=$(lock_read locks/infra.json lock-infra.json); then
                echo "::error::s3://${LOCK_BUCKET}/locks/infra.json is unreadable, so infra_head is not recorded and every hotfix take stays refused."; return 1
              fi
              if [ "${held}" = "absent" ]; then break; fi
              if ! holder=$(lock_holder lock-infra.json); then
                echo "::error::s3://${LOCK_BUCKET}/locks/infra.json holds no readable record, so infra_head is not recorded and every hotfix take stays refused."; return 1
              fi
              read -r hrepo hrun rest <<< "${holder}"
              if lock_run_finished "${hrepo}" "${hrun}"; then
                echo "s3://${LOCK_BUCKET}/locks/infra.json is held by $(lock_url "${hrepo}" "${hrun}"), which is not running: not waited for (the next infra take removes it)."
                break
              fi
              if [ $((SECONDS - start)) -ge "${LOCK_WAIT_CAP_SECONDS}" ]; then
                lock_fail_waiting "${hrepo}" infra "${hrun}"
                return 1
              fi
              echo "Freeze waits: s3://${LOCK_BUCKET}/locks/infra.json is held by $(lock_url "${hrepo}" "${hrun}"), a live infra release, which keeps its keys until its own unlock."
              sleep "${LOCK_POLL_SECONDS}"
            done
            # settled() for infra; a read error, or no verdict at all, records infra_settled false with the error, never true.
            if ! GH_TOKEN="${LOCK_GH_TOKEN}" python3 -c '
          import json, os, re, subprocess, sys
          script, head, settled, reason = os.environ.get("LOCK_ORDER_SCRIPT", ""), None, False, ""
          try:
              if not script or not os.path.isfile(script):
                  raise RuntimeError("no release-order script at %r" % script)
              out = subprocess.run([sys.executable, script, "settled", "--scope", "infra", "--json"], capture_output=True, text=True, timeout=900)
              lines = out.stdout.strip().splitlines()
              doc = json.loads(lines[-1]) if out.returncode == 0 and lines else None
              if not isinstance(doc, dict):
                  raise RuntimeError("settled --scope infra gave no verdict (exit %d): %s" % (out.returncode, (out.stderr or out.stdout).strip()[:300]))
              head, reason = doc.get("success_head"), str(doc.get("reason", ""))
              settled = doc.get("verdict") == "settled" and doc.get("error") is False
          except Exception as error:
              reason = "the release order could not be read: %s" % error
          if not (isinstance(head, str) and re.fullmatch(r"[0-9a-f]{40}", head)):
              print("::error::infra_head cannot be recorded (the head of the latest successful infra release run is %r; %s), so every hotfix take stays refused; re-run freeze." % (head, reason))
              sys.exit(1)
          record = json.load(open("lock-frozen-mine.json"))
          record.update(infra_head=head, infra_settled=settled, infra_settled_reason=reason)
          json.dump(record, open("lock-frozen-record.json", "w"))
          print("infra_head %s, infra_settled %s: %s" % (head, "true" if settled else "false", reason))'; then
              return 1
            fi
            tries=0
            while :; do
              rc=0
              lock_put "${FROZEN_KEY}" lock-frozen-record.json "${etag}" || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "Recorded infra_head and infra_settled in s3://${LOCK_BUCKET}/${FROZEN_KEY}."; return 0; fi
              if [ "${rc}" -eq 1 ]; then return 1; fi
              rc=0; lock_frozen_mine || rc=$?
              if [ "${rc}" -eq 0 ] && [ "${LOCK_FROZEN_HEAD}" != "-" ]; then echo "Another freeze run of this branch has recorded infra_head ${LOCK_FROZEN_HEAD}."; return 0; fi
              if [ "${rc}" -eq 0 ] && [ "${LOCK_FROZEN_ETAG}" = "${etag}" ] && [ "${tries}" -lt 3 ]; then tries=$((tries + 1)); sleep 1; continue; fi   # a 409 on an unchanged record
              echo "::error::preprod-frozen changed before infra_head could be recorded (thawed, or written again), so freeze records nothing."
              return 1
            done
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          # A random token names this take; unlock gets it through the job outputs and releases only on a match.
          LOCK_TOKEN=$(python3 -c "import secrets;print(secrets.token_hex(16))")
          echo "token=${LOCK_TOKEN}" >> "$GITHUB_OUTPUT"
          lock_take
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      # The take may have waited up to the cap (120 minutes) and renewed its session only inside its own shell, so every
      # later step gets a fresh role session (playbook §5.4a "Waits that fit the runners" rule 4).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Order. A newer commit already running makes this release a skip (playbook §5.4)
        id: order
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # The commit of what runs is each service's task-definition `commit` tag. When this commit is its ancestor,
          # an older run must never undo a newer one: everything after this job is skipped and unlock releases the lock.
          aws s3 cp "s3://${NAME}-deploy/taskdef/index.json" index.json --only-show-errors
          services=$(python3 -c '
          import json, os
          index = json.load(open("index.json"))
          print(" ".join(e["service"] for e in index.values() if isinstance(e, dict) and e.get("image") == os.environ["IMAGE"] and e.get("kind") != "one-off"))')
          mine="sha-${GITHUB_SHA::12}"
          skip=false
          for svc in ${services}; do
            td=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text)
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then continue; fi   # not deployed yet
            running=$(aws ecs describe-task-definition --task-definition "${td}" --include TAGS --query "tags[?key=='commit'].value | [0]" --output text)
            if [ -z "${running}" ] || [ "${running}" = "None" ] || [ "${running}" = "${mine}" ]; then continue; fi
            if ! [[ "${running}" =~ ^sha-[0-9a-f]{12}$ ]]; then
              echo "::error::${svc} carries the commit tag '${running}', not sha-<12>; the order cannot be checked, so nothing is deployed."; exit 1
            fi
            if ! full=$(git rev-parse --verify --quiet "${running#sha-}^{commit}"); then
              echo "::error::${svc} runs ${running}, which is not in this repository's history; the order cannot be checked, so nothing is deployed."; exit 1
            fi
            rc=0
            git merge-base --is-ancestor "${GITHUB_SHA}" "${full}" || rc=$?
            case "${rc}" in
              0) skip=true
                 echo "::notice::${svc} already runs ${running}, which includes this commit (${mine}): this release is a skip and changes nothing."
                 echo "Skipped: ${svc} already runs ${running}, which includes ${mine}." >> "$GITHUB_STEP_SUMMARY"
                 break ;;
              1) ;;
              *) echo "::error::git merge-base failed (${rc}); the order cannot be checked, so nothing is deployed."; exit 1 ;;
            esac
          done
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
      - name: Refuse at once a migrating release with no db-bootstrap role
        if: ${{ steps.order.outputs.skip != 'true' }}
        env:
          MIGRATE: ${{ inputs.migrate }}
          DRY_RUN: ${{ inputs.dry-run }}
          ROLE: ${{ inputs.db-bootstrap-role }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          if [ "${MIGRATE}" = "true" ] && [ "${DRY_RUN}" != "true" ] && [ -z "${ROLE}" ]; then
            upper=$(echo "${ENVIRONMENT_NAME}" | tr '[:lower:]' '[:upper:]')
            echo "::error::db-bootstrap-role is empty. Set the backend repository variable AWS_DB_BOOTSTRAP_ROLE_${upper} to the onepeek-${ENVIRONMENT_NAME}-db-bootstrap role ARN and pass it as db-bootstrap-role."
            exit 1
          fi
      - name: Record the commit sha-<12>, and read the next version as image metadata only
        id: v
        if: ${{ steps.order.outputs.skip != 'true' }}
        env:
          IMAGE: ${{ inputs.image }}
          EXTRA: ${{ inputs.extra-images }}
        run: |
          # No version-tag check here: preprod deploys carry only the commit, and promote.yml refuses a version whose
          # tag exists (delivery-pipelines UC-DEL-001 row 1).
          commit="sha-${GITHUB_SHA::12}"
          version=$(python3 -c "import json;print(json.load(open('${VERSION_FILE}'))['.'])")
          if [ -z "${version}" ]; then echo "::error::No version in ${VERSION_FILE}."; exit 1; fi
          images=$(python3 -c "import json,os;print(json.dumps([os.environ['IMAGE']]+[x for x in os.environ['EXTRA'].replace(',',' ').split() if x]))")
          { echo "version=${version}"; echo "commit=${commit}"; echo "images=${images}"; echo "started=$(date +%s)"; } >> "$GITHUB_OUTPUT"
          echo "Release of ${commit} (next version ${version}) to ${ENVIRONMENT} started." >> "$GITHUB_STEP_SUMMARY"

  build-image:
    # Rows 2 to 4 and the digest record in one job: build and push sha-<12>, scan, SBOM and sign, then read back the
    # signed digest recorded in SSM and verify its signature; the later jobs use only these outputs. In a dry run only
    # the read-back runs: the digests are those of the latest release. Every image but web. arm-build class: the hosted
    # fallback stays ubuntu-latest with QEMU (today's behaviour) instead of ubuntu-24.04-arm until hosted ARM is proven
    # on a private repo (ci-runners.md section 5.3 lists ubuntu-24.04-arm). Its token has no packages scope: only the web
    # build reads @onepeek packages (least privilege, foundation-playbook §12a slice 2), which is why the web build is a
    # second job with the same steps; one of the two is always skipped and takes no runner.
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' && inputs.image != 'web' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs: &build-outputs
      digests: ${{ steps.record.outputs.digests }}
      digest: ${{ steps.record.outputs.digest }}
      image-ref: ${{ steps.record.outputs.image-ref }}
      registry: ${{ steps.record.outputs.registry }}
      commit: ${{ steps.record.outputs.commit }}
    steps: &build-steps
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ !inputs.dry-run && runner.arch != 'ARM64' }}
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !inputs.dry-run }}
      - name: Build for ARM64 and push sha-<12>
        id: push
        if: ${{ !inputs.dry-run }}
        timeout-minutes: 20
        env:
          IMAGE: ${{ inputs.image }}
          EXTRA: ${{ inputs.extra-images }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          NPM_TOKEN: ${{ inputs.image == 'web' && github.token || '' }} # web only; packages: read on build-web, each package grants this repo Actions read access
        run: |
          if [ -n "$(echo "${EXTRA:-}" | tr -d ' ,')" ]; then
            echo "::error::No Dockerfile location is defined for the extra images '${EXTRA}' (delivery-pipelines §16: the sandbox image waits for document parsing)."
            exit 1
          fi
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          repo="${registry}/${NAME}/${IMAGE}"
          # A re-run of this commit: sha-<12> is immutable in ECR and names this commit's build, so the image already
          # there is reused (UC-DEL-001 row 2). It is scanned again, and signed if it was never recorded.
          ecr_error=$(mktemp)   # outside the workspace: it is the Docker build context
          if found=$(aws ecr describe-images --repository-name "${NAME}/${IMAGE}" --image-ids "imageTag=${COMMIT}" --query 'imageDetails[0].imageDigest' --output text 2>"${ecr_error}"); then
            echo "Reusing ${IMAGE}:${COMMIT} (${found}): this commit was built before."
            echo "digest=${found}" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}=${found}" > "digest-${IMAGE}.txt"
            exit 0
          elif ! grep -q ImageNotFoundException "${ecr_error}"; then
            cat "${ecr_error}" >&2
            exit 1
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          # Both tags are immutable in ECR. The ':buildcache' tag cannot be written twice in an immutable repository,
          # so the cache is read always and written best effort (ignore-error); see the gap noted in the pull request.
          # The next version is metadata only, as SemVer build metadata on the commit: <next>+sha-<12> (playbook §5.2).
          label="${VERSION}+${COMMIT}"
          args=(--platform linux/arm64 --provenance=false
            --label "org.opencontainers.image.version=${label}" --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --cache-from "type=registry,ref=${repo}:buildcache"
            --cache-to "type=registry,ref=${repo}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            --tag "${repo}:${COMMIT}"
            --metadata-file meta.json --push)
          # Baked into the image, never a start-up variable (aws-stack §16 "Image commit"): the backend's
          # ONEPEEK_COMMIT, VERSION and REVISION; the web image's RELEASE (its WEB_RELEASE), which names its assets folder.
          case "${IMAGE}" in
            backend) args+=(--build-arg "ONEPEEK_COMMIT=${GITHUB_SHA}" --build-arg "VERSION=${label}" --build-arg "REVISION=${GITHUB_SHA}") ;;
            web) args+=(--build-arg "RELEASE=${COMMIT}") ;;
          esac
          if [ -n "${NPM_TOKEN}" ]; then
            args+=(--secret "id=npm_token,env=NPM_TOKEN")   # a BuildKit secret, never a build argument or layer
          fi
          docker buildx build "${args[@]}" .
          digest=$(python3 -c "import json;print(json.load(open('meta.json'))['containerimage.digest'])")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}=${digest}" > "digest-${IMAGE}.txt"
      - name: The scanned image reference (registry, repository and digest)
        id: login
        if: ${{ !inputs.dry-run }}
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          digest=$(cut -d= -f2 "digest-${IMAGE}.txt")
          echo "ref=${registry}/${NAME}/${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
      - name: The waiver file, only if the repository has one
        id: waiver
        if: ${{ !inputs.dry-run }}
        run: |
          if [ -f .trivyignore.yaml ]; then echo "file=.trivyignore.yaml" >> "$GITHUB_OUTPUT"; else echo "file=" >> "$GITHUB_OUTPUT"; fi
      - name: Trivy, a critical finding blocks (DP5). Waivers only in .trivyignore.yaml, with a reason and an expiry date
        if: ${{ !inputs.dry-run }}
        timeout-minutes: 15
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login.outputs.ref }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: ${{ steps.waiver.outputs.file }}
          version: v0.76.1
        env:
          TRIVY_PLATFORM: linux/arm64
          # No registry password: Trivy reads the AWS credentials configure-aws-credentials exported (ecr:GetAuthorizationToken).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Cache the verified syft archive (the checksum is checked again on every use)
        if: ${{ !inputs.dry-run }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-tools/syft
          key: syft-${{ env.SYFT_VERSION }}-${{ runner.arch }}-${{ env.SYFT_SHA256_A }}-${{ env.SYFT_SHA256_B }}
      - name: Install syft (pinned, checksum verified)
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ env.SYFT_VERSION }}
          SHA256_A: ${{ env.SYFT_SHA256_A }}
          SHA256_B: ${{ env.SYFT_SHA256_B }}
        run: |
          case "${RUNNER_ARCH}" in
            X64) asset=amd64; sha="${SHA256_A}" ;;
            ARM64) asset=arm64; sha="${SHA256_B}" ;;
            *) echo "::error::Unsupported runner architecture ${RUNNER_ARCH}."; exit 1 ;;
          esac
          dir="${RUNNER_TEMP}/release-tools/syft"; mkdir -p "${dir}"
          archive="${dir}/syft_${VERSION}_linux_${asset}.tar.gz"
          url="https://github.com/anchore/syft/releases/download/v${VERSION}/syft_${VERSION}_linux_${asset}.tar.gz"
          # A cached archive is never trusted: it is checked like a fresh download, and a bad one is discarded (F125).
          if [ -f "${archive}" ] && ! echo "${sha}  ${archive}" | sha256sum -c --quiet -; then
            echo "::warning::The cached syft archive failed its checksum; discarding it."
            rm -f "${archive}"
          fi
          if [ ! -f "${archive}" ]; then
            # Retries with a delay ride out a download-host outage (504 for two hours: F125); the checksum below still decides.
            if ! curl -sSfL --connect-timeout 15 --max-time 90 --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 300 -o "${archive}.part" "${url}"; then
              rm -f "${archive}.part"
              echo "::error::Could not download syft from github.com after retries (${url})."
              exit 1
            fi
            mv "${archive}.part" "${archive}"
          fi
          if ! echo "${sha}  ${archive}" | sha256sum -c -; then
            rm -f "${archive}"
            echo "::error::The syft archive does not match its pinned SHA-256; not using it."
            exit 1
          fi
          tar -xzf "${archive}" syft
      - name: Syft SPDX SBOM, then sign and attest (no public transparency log; OCI 1.1 referrers)
        if: ${{ !inputs.dry-run }}
        timeout-minutes: 15
        env:
          IMAGE: ${{ inputs.image }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          digest=$(cut -d= -f2 "digest-${IMAGE}.txt")
          ref="${registry}/${NAME}/${IMAGE}@${digest}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          ./syft "registry:${ref}" -o spdx-json=sbom.spdx.json
          # A reused image was signed and attested before its digest was recorded; the record step verifies the signature again.
          recorded_digest=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/digest" --query Parameter.Value --output text 2>/dev/null || true)
          recorded_commit=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/commit" --query Parameter.Value --output text 2>/dev/null || true)
          if [ "${recorded_digest}" = "${digest}" ] && [ "${recorded_commit}" = "${COMMIT}" ]; then
            echo "${IMAGE} ${COMMIT} is already signed and recorded."
          else
            # cosign v2.6.5 has --registry-referrers-mode on sign only; attest stores its OCI 1.1 referrer with --new-bundle-format (delivery-pipelines §4 row 4).
            cosign sign --yes --tlog-upload=false --registry-referrers-mode=oci-1-1 --key "${SIGNING_KEY}" "${ref}"
            cosign attest --yes --tlog-upload=false --new-bundle-format --type spdxjson \
              --predicate sbom.spdx.json --key "${SIGNING_KEY}" "${ref}"
          fi
          aws ssm put-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/digest" --type String --overwrite --value "${digest}" >/dev/null
          aws ssm put-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/commit" --type String --overwrite --value "${COMMIT}" >/dev/null
          mv sbom.spdx.json "sbom-${IMAGE}.spdx.json"
      - if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.image }}
          path: sbom-${{ inputs.image }}.spdx.json
          retention-days: 7
      - name: Read the recorded digests and verify each signature
        id: record
        timeout-minutes: 10
        env:
          IMAGES: ${{ needs.prepare.outputs.images }}
          MAIN_IMAGE: ${{ inputs.image }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          digests='{}'
          for image in $(echo "${IMAGES}" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            digest=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${image}/digest" --query Parameter.Value --output text)
            recorded=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${image}/commit" --query Parameter.Value --output text)
            if [ "${DRY_RUN}" != "true" ] && [ "${recorded}" != "${RELEASE_COMMIT}" ]; then
              echo "::error::${image}: SSM records commit ${recorded}, this release is ${RELEASE_COMMIT}."; exit 1
            fi
            cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${registry}/${NAME}/${image}@${digest}" >/dev/null
            digests=$(echo "${digests}" | python3 -c "import json,sys;d=json.load(sys.stdin);d['${image}']='${digest}';print(json.dumps(d))")
          done
          commit="${RELEASE_COMMIT}"
          if [ "${DRY_RUN}" = "true" ]; then commit=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${MAIN_IMAGE}/commit" --query Parameter.Value --output text); fi
          main=$(echo "${digests}" | python3 -c "import json,sys;print(json.load(sys.stdin)['${MAIN_IMAGE}'])")
          { echo "digests=${digests}"; echo "registry=${registry}"; echo "commit=${commit}"; echo "digest=${main}"
            echo "image-ref=${registry}/${NAME}/${MAIN_IMAGE}@${main}"; } >> "$GITHUB_OUTPUT"

  build-web:
    # The web image: the same steps and outputs as build-image, and the only job whose token reads packages (@onepeek/*
    # from GitHub Packages, a BuildKit secret in the build). Same runner class as build-image.
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' && inputs.image == 'web' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: read # @onepeek/* from GitHub Packages for the web build
    outputs: *build-outputs
    steps: *build-steps

  db-bootstrap:
    # Step 4b (decision 148). Infra's reviewed workflow on its release branch registers and runs db-bootstrap with this
    # signed digest under the onepeek-<env>-deploy-db-bootstrap role, never this repo's deploy role: it creates only missing
    # logins and first values, and changes nothing once they exist. A failure stops the release before migrate.
    # Pinned to infra's release branch on purpose: the role trusts only job_workflow_ref
    # OnePeek/onepeek-infra/.github/workflows/db-bootstrap.yml@refs/heads/release (aws-stack §12).
    # Only in the attempt that took the release lock: a re-run of only some jobs skips it, and deploy is then skipped too.
    # One of build-image and build-web is always skipped, so this job (and every later one) calls a status function.
    needs: [prepare, build-image, build-web]
    if: ${{ !cancelled() && (needs.build-image.result == 'success' || needs.build-web.result == 'success') && inputs.migrate && !inputs.dry-run && needs.prepare.outputs.attempt == format('{0}', github.run_attempt) }}
    permissions:
      contents: read
      id-token: write
    uses: OnePeek/onepeek-infra/.github/workflows/db-bootstrap.yml@release # zizmor: ignore[unpinned-uses] the role's trust names this ref
    with:
      environment: ${{ inputs.environment }}
      digest: ${{ needs.build-image.outputs.digest || needs.build-web.outputs.digest }}
      version: ${{ needs.build-image.outputs.commit || needs.build-web.outputs.commit }} # the commit sha-<12>: preprod artefacts carry no version (playbook §5.2)
      role-to-assume: ${{ inputs.db-bootstrap-role }}
      signing-key: ${{ inputs.signing-key }}
    secrets:
      AGENTS_APP_CLIENT_ID: ${{ secrets.AGENTS_APP_CLIENT_ID }}
      AGENTS_APP_PRIVATE_KEY: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}

  deploy:
    # Rows 5, 6 and 6b (and UC-DEL-005's assets) in one job, each a step with its own time limit: migrate (backend), the
    # web assets (web), the rollout, then the ops registration (backend; migrate is registered by its own step,
    # db-bootstrap by infra's db-bootstrap workflow, 4b, and db-rotate only by ci-apply). A failed step stops every step
    # after it, as a failed job stopped the jobs after it; the verify job rolls back once `previous` is recorded.
    needs: [prepare, build-image, build-web, db-bootstrap]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-image.result == 'success' || needs.build-web.result == 'success') && (!inputs.migrate || inputs.dry-run || needs.db-bootstrap.result == 'success') }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 110   # above the sum of its step limits (99): a hang ends as a failed step, so verify still rolls back (a job timeout is 'cancelled' and it would not)
    permissions:
      contents: read
      id-token: write
    env:
      # The digest the build job signed, recorded and verified (its record step); every render fills this image.
      IMAGE_REF: ${{ needs.build-image.outputs.image-ref || needs.build-web.outputs.image-ref }}
      REGISTRY: ${{ needs.build-image.outputs.registry || needs.build-web.outputs.registry }}
      DIGESTS: ${{ needs.build-image.outputs.digests || needs.build-web.outputs.digests }}
      COMMIT: ${{ needs.build-image.outputs.commit || needs.build-web.outputs.commit }}
    outputs:
      previous: ${{ steps.previous.outputs.previous }}
      services: ${{ steps.index.outputs.services }}
      stable-at: ${{ steps.roll.outputs.stable-at }}
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Pinned tools (PyYAML for the services file and ops, uv for the gateway routes) in a virtual environment
        timeout-minutes: 5
        run: |
          python3 -m venv "${RUNNER_TEMP}/tools"
          "${RUNNER_TEMP}/tools/bin/pip" install --quiet pyyaml==6.0.3 uv==0.12.0
          echo "${RUNNER_TEMP}/tools/bin" >> "$GITHUB_PATH"
      - name: Verify, render, register and run the migrate task (the running version is untouched on failure)
        if: ${{ inputs.migrate }}
        timeout-minutes: 15
        env:
          SIGNING_KEY: ${{ inputs.signing-key }}
          VERSION: "" # the version tag is added only on promotion to prod (playbook §5.2)
          DRY_RUN: ${{ inputs.dry-run }}
          LOCK_TOKEN: ${{ needs.prepare.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # Release locks per scope (foundation-playbook §5.4, §5.4a): one key per scope in s3://onepeek-<env>-deploy/locks/
          # (infra.json, backend.json, web.json, mcp.json), taken with a conditional write (If-None-Match: *) and removed with a
          # conditional delete on its ETag (If-Match). Expand step of the move off locks/release.json: every take set starts with
          # release.json, and every reader reads it too. An app takes release.json and its own scope's key; infra takes
          # release.json, then infra.json, backend.json, web.json and mcp.json in that fixed order. Every take is try-or-release:
          # when one key is held by a live run, the keys taken so far are deleted (in reverse order, each on the ETag of its own
          # write) and the run waits holding nothing, so no run ever waits while it holds a key.
          # The record names the repo, run ID, run attempt, commit, start time, a random token, the scope and the phase (locked,
          # migrating, rolling or done). Only the holder (or the one repairer that claimed it) writes it, with If-Match on the
          # ETag it read; a 412 means the key is lost, a 409 is re-read and retried up to 3 times while the ETag is unchanged. A key whose holder's run has
          # finished is taken over by its phase: locked or done, removed; migrating, removed only once the migrate task has
          # stopped; rolling, never (cancel-release.yml repairs it). Anything unreadable fails closed: no lock, no deploy.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock once freeze has recorded infra_head, every
          # other take (infra's included) fails with the reason, and every take reads it again after taking its keys.
          # Waits fit the runners (§5.4a): every wait counts towards LOCK_WAIT_CAP_SECONDS; a run of the same scope holding the key
          # is waited for at most LOCK_WAIT_SECONDS; at a limit the step fails with "waiting for <holder> (<scope>, run <id>);
          # re-run", holding nothing. Every LOCK_REMINT_SECONDS inside a wait the App token and the AWS role session are minted again.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_LEGACY_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          LOCK_OWNER="${GITHUB_REPOSITORY%%/*}"
          LOCK_MINTED=${SECONDS}
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_scope_repo() {  # lock_scope_repo <scope> -> the scope's owning repo
            case "$1" in
              infra) echo "${LOCK_OWNER}/onepeek-infra" ;;
              backend) echo "${LOCK_OWNER}/backend-service" ;;
              web) echo "${LOCK_OWNER}/onepeek-web" ;;
              mcp) echo "${LOCK_OWNER}/mcp-athena" ;;
              *) return 1 ;;
            esac
          }
          lock_repo_scope() {  # lock_repo_scope <owner/repo> -> the scope that repo owns; 1 when it owns none
            case "${1#*/}" in
              onepeek-infra) echo infra ;;
              backend-service) echo backend ;;
              onepeek-web) echo web ;;
              mcp-athena) echo mcp ;;
              *) return 1 ;;
            esac
          }
          lock_keys() {  # the take set of LOCK_SCOPE, in take order
            case "${LOCK_SCOPE:-}" in
              infra) echo "${LOCK_LEGACY_KEY} locks/infra.json locks/backend.json locks/web.json locks/mcp.json" ;;
              backend|web|mcp) echo "${LOCK_LEGACY_KEY} locks/${LOCK_SCOPE}.json" ;;
              *) echo "::error::No lock scope (LOCK_SCOPE='${LOCK_SCOPE:-}'): it must be infra, backend, web or mcp." >&2; return 1 ;;
            esac
          }
          lock_reverse() {  # lock_reverse <words> -> the words in reverse order
            local out="" w words
            read -r -a words <<< "$1"
            for w in "${words[@]}"; do out="${w} ${out}"; done
            echo "${out}"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token> <scope> <phase> <migrate task> <repair run>"; 1 when not a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt = record["repo"], str(record["run_id"]), str(record["run_attempt"])
              token, scope, phase = str(record.get("token", "-")), str(record.get("scope", "-")), str(record.get("phase", "locked"))
              task, repair = str(record.get("migrate_task") or "-"), str(record.get("repair_run") or "-")
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)
                  and scope in ("infra", "backend", "web", "mcp", "-") and phase in ("locked", "migrating", "rolling", "done")
                  and re.fullmatch(r"arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task/[A-Za-z0-9_/-]+|-", task) and re.fullmatch(r"[0-9]+-[0-9]+|-", repair)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token, scope, phase, task, repair)' "$1"
          }
          lock_put() {  # lock_put <key> <file> <etag | *> -> 0 written (LOCK_PUT_ETAG is the new ETag), 2 lost (412, or gone), 3 conflict (409), 1 any other answer
            local msg cond=(--if-match "$3")
            LOCK_PUT_ETAG=""
            if [ "$3" = "*" ]; then cond=(--if-none-match '*'); fi
            # No encryption flags: the bucket default applies (aws-stack §16).
            if LOCK_PUT_ETAG=$(aws s3api put-object --bucket "${LOCK_BUCKET}" --key "$1" --body "$2" "${cond[@]}" \
              --content-type application/json --query ETag --output text 2>"${LOCK_ERR}"); then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in
              *"(PreconditionFailed)"*|*"(NoSuchKey)"*) return 2 ;;
              *"(ConditionalRequestConflict)"*) return 3 ;;
            esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be written: ${msg}"
            return 1
          }
          lock_delete() {  # lock_delete <key> <etag> -> 0 removed, 2 changed or gone meanwhile (read it again), 1 any other answer
            local msg
            if aws s3api delete-object --bucket "${LOCK_BUCKET}" --key "$1" --if-match "$2" >/dev/null 2>"${LOCK_ERR}"; then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*|*"(NoSuchKey)"*) return 2 ;; esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be removed: ${msg}"
            return 1
          }
          lock_run_finished() {  # lock_run_finished <repo> <run id> -> 0 only when GitHub reports the run completed
            local status
            if ! status=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/$1/actions/runs/$2" --jq .status 2>"${LOCK_ERR}"); then
              echo "::warning::Cannot read the state of $(lock_url "$1" "$2"), so it counts as running: $(cat "${LOCK_ERR}")" >&2
              return 1
            fi
            [ "${status}" = "completed" ]
          }
          lock_record() {  # lock_record <file> [token]: this run's record (with a token: a lock record of LOCK_SCOPE, phase locked)
            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", ""), "ref": e.get("GITHUB_REF", "")}
          if len(sys.argv) > 2:
              record.update(token=sys.argv[2], scope=e["LOCK_SCOPE"], phase="locked")
              del record["who"], record["why"], record["ref"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
          }
          lock_is_mine() {  # lock_is_mine <holder line> -> 0 when the record is this run's own: its token, or (no token at hand) its run and attempt
            local repo run attempt token rest
            read -r repo run attempt token rest <<< "$1"
            if [ -n "${LOCK_TOKEN:-}" ]; then [ "${token}" = "${LOCK_TOKEN}" ]; return; fi
            [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" = "${GITHUB_RUN_ATTEMPT}" ]
          }
          lock_frozen_branch() {  # lock_frozen_branch <file> -> "<repo> <ref> <infra_head | ->" of a preprod-frozen record ("-": freeze has not recorded it yet); 1 when it is not one
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, ref = record["repo"], record["ref"]
              head, settled = record.get("infra_head"), record.get("infra_settled")
          except Exception as error:
              sys.exit("not a preprod-frozen record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and re.fullmatch(r"refs/heads/hotfix/[A-Za-z0-9_./-]+", ref)):
              sys.exit("not a preprod-frozen record: " + json.dumps(record))
          # Once recorded, infra_head is a commit SHA and infra_settled a boolean (§5.4a "Freeze and thaw"); anything else fails closed.
          if head is not None and not (isinstance(head, str) and re.fullmatch(r"[0-9a-f]{40}", head) and isinstance(settled, bool)):
              sys.exit("not a preprod-frozen record (infra_head or infra_settled): " + json.dumps(record))
          print(repo, ref, head or "-")' "$1"
          }
          lock_frozen_for_others() {  # 0 when preprod-frozen refuses this run (the reason is printed): it names another branch, or this branch before freeze recorded infra_head; 1 when not frozen for us, 2 unreadable
            local etag branch repo ref head
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${etag}" = "absent" ]; then return 1; fi
            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref head <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF:-}" ]; then
              if [ "${head}" != "-" ]; then return 1; fi
              # §5.4a "Freeze and thaw": a hotfix take refuses while frozen.json has no infra_head yet.
              echo "preprod is frozen for this hotfix branch ${repo} ${ref}, but freeze has not recorded infra_head yet (it waits while a live infra release holds infra.json); re-run once freeze has finished"
              return 0
            fi
            python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));print("preprod is frozen by %s (%s) for the hotfix branch %s %s, first frozen by %s" % (r.get("who","?"), r.get("why","?"), r["repo"], r["ref"], r.get("run","?")))' lock-frozen.json
            return 0
          }
          lock_remint() {  # a new App installation token and a new role session (the same permissions, repositories, role and session name)
            local jwt installation repo creds
            if [ -n "${LOCK_APP_CLIENT_ID:-}" ] && [ -n "${LOCK_APP_PRIVATE_KEY:-}" ]; then
              # The key stays in this step's environment: it is signed from a file descriptor and never printed.
              if ! jwt=$(LOCK_APP_PRIVATE_KEY="${LOCK_APP_PRIVATE_KEY}" python3 -c '
          import base64, json, os, subprocess, time
          b64 = lambda raw: base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          head = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + "." + b64(json.dumps({"iat": now - 60, "exp": now + 540, "iss": os.environ["LOCK_APP_CLIENT_ID"]}).encode())
          read, write = os.pipe()
          os.write(write, os.environ["LOCK_APP_PRIVATE_KEY"].encode())
          os.close(write)
          signed = subprocess.run(["openssl", "dgst", "-sha256", "-sign", "/dev/fd/%d" % read], input=head.encode(), capture_output=True, check=True, pass_fds=(read,))
          print(head + "." + b64(signed.stdout))'); then
                echo "::error::The App token could not be minted again (JWT)."; return 1
              fi
              repo="${LOCK_APP_REPOS%%,*}"
              # Every bearer token goes to curl as a header file (-H @file, written by the printf builtin), never on its command line.
              if ! installation=$(curl -sSf -H @<(printf 'Authorization: Bearer %s\n' "${jwt}") -H "Accept: application/vnd.github+json" \
                  "${GITHUB_API_URL:-https://api.github.com}/repos/${LOCK_OWNER}/${repo}/installation" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])') \
                || ! LOCK_GH_TOKEN=$(LOCK_APP_REPOS="${LOCK_APP_REPOS}" python3 -c 'import json,os;print(json.dumps({"repositories": os.environ["LOCK_APP_REPOS"].split(","), "permissions": json.loads(os.environ["LOCK_APP_PERMISSIONS"])}))' \
                  | curl -sSf -X POST -H @<(printf 'Authorization: Bearer %s\n' "${jwt}") -H "Accept: application/vnd.github+json" --data @- \
                    "${GITHUB_API_URL:-https://api.github.com}/app/installations/${installation}/access_tokens" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])'); then
                echo "::error::The App token could not be minted again."; return 1
              fi
              echo "::add-mask::${LOCK_GH_TOKEN}"
              echo "Minted a new App token."
            fi
            if [ -n "${LOCK_ROLE_ARN:-}" ]; then
              if ! jwt=$(curl -sSf -H @<(printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])') \
                || ! creds=$(aws sts assume-role-with-web-identity --role-arn "${LOCK_ROLE_ARN}" --role-session-name "${LOCK_ROLE_SESSION}" \
                  --web-identity-token "${jwt}" --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>"${LOCK_ERR}"); then
                echo "::error::The role ${LOCK_ROLE_ARN} could not be assumed again: $(cat "${LOCK_ERR}")"; return 1
              fi
              read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< "${creds}"
              echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
              echo "::add-mask::${AWS_SESSION_TOKEN}"
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              echo "Assumed ${LOCK_ROLE_ARN} again (session ${LOCK_ROLE_SESSION})."
            fi
          }
          lock_remint_if_due() {  # every LOCK_REMINT_SECONDS after the last mint
