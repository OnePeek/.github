            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref LOCK_FROZEN_HEAD <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_freeze() {  # preprod-frozen (§5.4a "Freeze and thaw", §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            # 1. frozen.json without infra_head: from then on every infra take is refused, and so is every hotfix take.
            # 2. While infra.json is held by a live run, wait (the wait rules of §5.4a: the cap, the re-mint); that run keeps
            #    its keys until its own unlock. A holder whose run has finished is not waited for.
            # 3. settled() for infra (LOCK_ORDER_SCRIPT, the release order at this workflow's own commit): infra_head, the
            #    head of infra's latest successful release run, and infra_settled, true only on a clean settled verdict.
            local etag rc held holder hrepo hrun rest start tries
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            rc=0
            lock_put "${FROZEN_KEY}" lock-frozen-mine.json '*' || rc=$?
            case "${rc}" in
              0) etag="${LOCK_PUT_ETAG}"
                 echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY}); every infra take is refused from now on." ;;
              2|3)
                rc=0; lock_frozen_mine || rc=$?
                if [ "${rc}" -eq 2 ] || { [ "${rc}" -eq 1 ] && [ "${LOCK_FROZEN_ETAG}" = "absent" ]; }; then echo "::error::preprod-frozen could not be read back."; return 1; fi
                if [ "${rc}" -ne 0 ]; then return 1; fi
                if [ "${LOCK_FROZEN_HEAD}" != "-" ]; then echo "${ENVIRONMENT} is already frozen for this branch (infra_head ${LOCK_FROZEN_HEAD})."; return 0; fi
                etag="${LOCK_FROZEN_ETAG}"
                cp lock-frozen.json lock-frozen-mine.json
                echo "${ENVIRONMENT} is already frozen for this branch, without infra_head yet: this run records it." ;;
              *) return 1 ;;
            esac
            start=${SECONDS}
            while :; do
              if ! lock_remint_if_due; then return 1; fi
              rc=0; lock_frozen_mine || rc=$?
              if [ "${rc}" -ne 0 ] || [ "${LOCK_FROZEN_ETAG}" != "${etag}" ]; then
                echo "::error::preprod-frozen changed while freeze waited (thawed, or written again), so freeze stops and records nothing."; return 1
              fi
              if ! held=$(lock_read locks/infra.json lock-infra.json); then
                echo "::error::s3://${LOCK_BUCKET}/locks/infra.json is unreadable, so infra_head is not recorded and every hotfix take stays refused."; return 1
              fi
              if [ "${held}" = "absent" ]; then break; fi
              if ! holder=$(lock_holder lock-infra.json); then
                echo "::error::s3://${LOCK_BUCKET}/locks/infra.json holds no readable record, so infra_head is not recorded and every hotfix take stays refused."; return 1
              fi
              read -r hrepo hrun rest <<< "${holder}"
              if lock_run_finished "${hrepo}" "${hrun}"; then
                echo "s3://${LOCK_BUCKET}/locks/infra.json is held by $(lock_url "${hrepo}" "${hrun}"), which is not running: not waited for (the next infra take removes it)."
                break
              fi
              if [ $((SECONDS - start)) -ge "${LOCK_WAIT_CAP_SECONDS}" ]; then
                lock_fail_waiting "${hrepo}" infra "${hrun}"
                return 1
              fi
              echo "Freeze waits: s3://${LOCK_BUCKET}/locks/infra.json is held by $(lock_url "${hrepo}" "${hrun}"), a live infra release, which keeps its keys until its own unlock."
              sleep "${LOCK_POLL_SECONDS}"
            done
            # settled() for infra; a read error, or no verdict at all, records infra_settled false with the error, never true.
            if ! GH_TOKEN="${LOCK_GH_TOKEN}" python3 -c '
          import json, os, re, subprocess, sys
          script, head, settled, reason = os.environ.get("LOCK_ORDER_SCRIPT", ""), None, False, ""
          try:
              if not script or not os.path.isfile(script):
                  raise RuntimeError("no release-order script at %r" % script)
              out = subprocess.run([sys.executable, script, "settled", "--scope", "infra", "--json"], capture_output=True, text=True, timeout=900)
              lines = out.stdout.strip().splitlines()
              doc = json.loads(lines[-1]) if out.returncode == 0 and lines else None
              if not isinstance(doc, dict):
                  raise RuntimeError("settled --scope infra gave no verdict (exit %d): %s" % (out.returncode, (out.stderr or out.stdout).strip()[:300]))
              head, reason = doc.get("success_head"), str(doc.get("reason", ""))
              settled = doc.get("verdict") == "settled" and doc.get("error") is False
          except Exception as error:
              reason = "the release order could not be read: %s" % error
          if not (isinstance(head, str) and re.fullmatch(r"[0-9a-f]{40}", head)):
              print("::error::infra_head cannot be recorded (the head of the latest successful infra release run is %r; %s), so every hotfix take stays refused; re-run freeze." % (head, reason))
              sys.exit(1)
          record = json.load(open("lock-frozen-mine.json"))
          record.update(infra_head=head, infra_settled=settled, infra_settled_reason=reason)
          json.dump(record, open("lock-frozen-record.json", "w"))
          print("infra_head %s, infra_settled %s: %s" % (head, "true" if settled else "false", reason))'; then
              return 1
            fi
            tries=0
            while :; do
              rc=0
              lock_put "${FROZEN_KEY}" lock-frozen-record.json "${etag}" || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "Recorded infra_head and infra_settled in s3://${LOCK_BUCKET}/${FROZEN_KEY}."; return 0; fi
              if [ "${rc}" -eq 1 ]; then return 1; fi
              rc=0; lock_frozen_mine || rc=$?
              if [ "${rc}" -eq 0 ] && [ "${LOCK_FROZEN_HEAD}" != "-" ]; then echo "Another freeze run of this branch has recorded infra_head ${LOCK_FROZEN_HEAD}."; return 0; fi
              if [ "${rc}" -eq 0 ] && [ "${LOCK_FROZEN_ETAG}" = "${etag}" ] && [ "${tries}" -lt 3 ]; then tries=$((tries + 1)); sleep 1; continue; fi   # a 409 on an unchanged record
              echo "::error::preprod-frozen changed before infra_head could be recorded (thawed, or written again), so freeze records nothing."
              return 1
            done
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
            aws ecs describe-task-definition --task-definition "${td}" --query taskDefinition --output json > "$2" || return 1
            echo "$2"
          }
          render() {  # render <service> <one-off | first-deploy | current task definition file> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              # Per service, not per container: a name may move between containers (the placeholder revision holds a
              # sidecar'"'"'s variables in the one container the real template splits in two). The container is context only.
              new = set().union(*(names(c, "environment") | names(c, "secrets") for c in containers))
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
          aws ecr get-login-password | cosign login "${IMAGE_REF%%/*}" --username AWS --password-stdin >/dev/null  # cosign reads the signature from ECR (first live release: 401)
          cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${IMAGE_REF}" >/dev/null
          render migrate one-off > migrate.json
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: migrate renders and its signature verifies."; exit 0; fi
          arn=$(aws ecs register-task-definition --cli-input-json file://migrate.json --query taskDefinition.taskDefinitionArn --output text)
          # Phase migrating, with no ARN yet, before run-task (playbook §5.4a "Rollback on cancel"): a key whose run is lost
          # here is never taken over while a task started by <run id>-<run attempt> has not stopped. A failed write means
          # this run has lost the key: it stops and changes nothing more.
          lock_write_phase migrating '{"migrate_task": null}' || exit 1
          task=$(aws ecs run-task --cluster "${NAME}" --task-definition "${arn}" --started-by "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "${task}" ] || [ "${task}" = "None" ]; then echo "::error::run-task started no migrate task."; exit 1; fi
          lock_write_phase migrating "{\"migrate_task\": \"${task}\"}" || exit 1
          echo "Started migrate (${task##*/}); waiting."
          aws ecs wait tasks-stopped --cluster "${NAME}" --tasks "${task}"
          lock_write_phase locked || exit 1   # the task has stopped: nothing to wait for
          code=$(aws ecs describe-tasks --cluster "${NAME}" --tasks "${task}" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "${code}" = "None" ]; then   # the container never ran (image pull, placement, role): no exit code exists
            code="none (the container did not run)"
          fi
          if [ "${code}" != "0" ]; then
            if [ "${code}" = "3" ]; then
              echo "::error::migrate exited 3 (login_missing_run_bootstrap): db-bootstrap did not create the login."
            else
              echo "::error::migrate exited ${code}. The running version is untouched."
            fi
            # migrate logs with awslogs to /onepeek/<env>/one-off, which this role may read (aws-stack §16 "One-off tasks").
            echo "migrate task ${task##*/}: exit code ${code}"
            aws ecs describe-tasks --cluster "${NAME}" --tasks "${task}" \
              --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containerReason:containers[0].reason,lastStatus:lastStatus}' --output json
            log_group="/onepeek/${ENVIRONMENT}/one-off"
            log_stream="migrate/migrate/${task##*/}"   # awslogs: <stream prefix>/<container name>/<task id>
            echo "Output of migrate (${log_group}, ${log_stream}):"
            aws logs get-log-events --log-group-name "${log_group}" --log-stream-name "${log_stream}" --limit 200 \
              --query 'events[].[message]' --output text || echo "No output could be read: the container may never have started."
            exit 1
          fi
      - name: Copy /app/dist/assets to web-assets/sha-<12>/ (never overwrite) and prune old folders
        if: ${{ inputs.assets }}
        timeout-minutes: 15
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          bucket="${NAME}-web-assets"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY}"
          docker pull --platform linux/arm64 "${IMAGE_REF}" >/dev/null
          id=$(docker create --platform linux/arm64 "${IMAGE_REF}")
          docker cp "${id}:/app/dist/assets" ./assets-out
          docker rm "${id}" >/dev/null
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: $(find assets-out -type f | wc -l) asset files extracted; nothing uploaded."; exit 0; fi
          if [ -n "$(aws s3api list-objects-v2 --bucket "${bucket}" --prefix "${COMMIT}/" --max-keys 1 --query 'Contents[0].Key' --output text | grep -v '^None$' || true)" ]; then
            echo "web-assets/${COMMIT}/ already exists; assets are never overwritten (a re-run is a no-op)."
          else
            # No encryption flags: the bucket default applies (aws-stack §16). `--sse aws:kms` alone would ask for the AWS-managed key.
            aws s3 sync ./assets-out "s3://${bucket}/${COMMIT}/" --cache-control "public, max-age=31536000, immutable" --only-show-errors
          fi
          # Delete folders that are both beyond the last 10 releases and older than 90 days.
          python3 - <<'PY'
          import datetime, json, os, subprocess
          bucket = os.environ["NAME"] + "-web-assets"
          out = subprocess.run(["aws", "s3api", "list-objects-v2", "--bucket", bucket, "--output", "json"],
                               check=True, capture_output=True, text=True).stdout
          objects = (json.loads(out) or {}).get("Contents", []) if out.strip() not in ("", "null") else []
          folders = {}
          for o in objects:
              folder = o["Key"].split("/", 1)[0]
              when = datetime.datetime.fromisoformat(o["LastModified"].replace("Z", "+00:00"))
              folders[folder] = max(folders.get(folder, when), when)
          newest_first = sorted(folders, key=lambda f: folders[f], reverse=True)
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=90)
          for folder in newest_first[10:]:
              if folders[folder] < cutoff:
                  subprocess.run(["aws", "s3", "rm", "s3://%s/%s/" % (bucket, folder), "--recursive", "--only-show-errors"], check=True)
                  print("Deleted old assets folder", folder)
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ inputs.image == 'backend' && runner.arch != 'ARM64' }}
        with:
          platforms: arm64
      - name: The services file's services for this image, for E7
        timeout-minutes: 2
        id: file
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # The one services file a release uses: the copy infra's last apply published (delivery-pipelines §13, decision 153).
          aws s3 cp "s3://${NAME}-deploy/services.${ENVIRONMENT}.yaml" services.yaml --only-show-errors
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          import yaml
          doc = yaml.safe_load(open("services.yaml"))
          defaults = doc.get("defaults", {})
          rolled = {"request", "connection", "event", "job", "workflow", "schedule"}
          names = []
          for name, svc in doc["services"].items():
              if svc.get("image", defaults.get("image")) == os.environ["IMAGE"] and rolled & set(svc.get("triggers", [])):
                  names.append(name)
          print("services=" + json.dumps(names))
          PY
      - name: E7. The services file must only name services the image can run (backend only)
        timeout-minutes: 10
        if: ${{ inputs.image == 'backend' }}
        env:
          SERVICES: ${{ steps.file.outputs.services }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY}"
          docker pull --platform linux/arm64 "${IMAGE_REF}" >/dev/null
          listed=$(docker run --rm --platform linux/arm64 "${IMAGE_REF}" --list)
          LISTED="${listed}" python3 -c "
          import json, os
          can = set(json.loads(os.environ['LISTED'])['services'])
          missing = [s for s in json.loads(os.environ['SERVICES']) if s.replace('-', '_') not in can and s not in can]
          if missing:
              raise SystemExit('The services file names services this image cannot run: ' + ', '.join(missing))"
      - name: The families this image rolls, in order (taskdef/index.json, aws-stack §6.3 "Task definition index")
        timeout-minutes: 2
        id: index
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # Every family whose image is this one, never a one-off; lowest order first (the daemons pgbouncer and valkey at 0
          # for the backend, then the services). Each order is rolled and stable before the next.
          aws s3 cp "s3://${NAME}-deploy/taskdef/index.json" index.json --only-show-errors
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          index = json.load(open("index.json"))
          kinds = {"service", "daemon", "one-off"}
          name = re.compile(r"^[a-z0-9-]+$")
          def valid(e):
              return (isinstance(e, dict) and e.get("kind") in kinds and type(e.get("order")) is int
                      and isinstance(e.get("service"), str) and name.fullmatch(e["service"]) is not None)
          bad = sorted(f for f, e in index.items() if not valid(e) or not name.fullmatch(f))
          if bad:
              raise SystemExit("taskdef/index.json entries without a valid kind, order and service: " + ", ".join(bad))
          services = [e["service"] for e in index.values()]
          dupes = sorted({s for s in services if services.count(s) > 1})
          if dupes:
              raise SystemExit("taskdef/index.json names a service twice: " + ", ".join(dupes))
          rolled = [e for e in index.values() if e.get("image") == os.environ["IMAGE"] and e["kind"] != "one-off"]
          groups = [[e["service"] for e in rolled if e["order"] == order] for order in sorted({e["order"] for e in rolled})]
          if not groups:
              raise SystemExit("taskdef/index.json names no family with image " + os.environ["IMAGE"])
          print("groups=" + json.dumps(groups))
          print("services=" + json.dumps([s for g in groups for s in g]))
          PY
      - name: The gateway routes (backend only, additive within a release; the gateway reloads within 30 s)
        timeout-minutes: 5
        if: ${{ inputs.image == 'backend' && !inputs.dry-run }}
        run: |
          # `app api routes` reads the same services file the release read above (platform/api.md §16 `--services-file`).
          uv run --frozen --no-dev app api routes --env "${ENVIRONMENT}" --services-file services.yaml --out gateway-routes.json
          # No encryption flags: the bucket default applies (aws-stack §16). `--sse aws:kms` alone would ask for the AWS-managed key.
          aws s3 cp gateway-routes.json "s3://${NAME}-deploy/gateway-routes.json" --only-show-errors
      - name: Record every service's current task definition and the sandbox live versions, then phase rolling (for the put-back)
        timeout-minutes: 5
        id: previous
        env:
          SERVICES: ${{ steps.index.outputs.services }}
          HAS_SANDBOX: ${{ contains(inputs.extra-images, 'sandbox') && 'yes' || '' }}
          DRY_RUN: ${{ inputs.dry-run }}
          LOCK_TOKEN: ${{ needs.prepare.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # Release locks per scope (foundation-playbook §5.4, §5.4a): one key per scope in s3://onepeek-<env>-deploy/locks/
          # (infra.json, backend.json, web.json, mcp.json), taken with a conditional write (If-None-Match: *) and removed with a
          # conditional delete on its ETag (If-Match). Expand step of the move off locks/release.json: every take set starts with
          # release.json, and every reader reads it too. An app takes release.json and its own scope's key; infra takes
          # release.json, then infra.json, backend.json, web.json and mcp.json in that fixed order. Every take is try-or-release:
          # when one key is held by a live run, the keys taken so far are deleted (in reverse order, each on the ETag of its own
          # write) and the run waits holding nothing, so no run ever waits while it holds a key.
          # The record names the repo, run ID, run attempt, commit, start time, a random token, the scope and the phase (locked,
          # migrating, rolling or done). Only the holder (or the one repairer that claimed it) writes it, with If-Match on the
          # ETag it read; a 412 means the key is lost, a 409 is re-read and retried up to 3 times while the ETag is unchanged. A key whose holder's run has
          # finished is taken over by its phase: locked or done, removed; migrating, removed only once the migrate task has
          # stopped; rolling, never (cancel-release.yml repairs it). Anything unreadable fails closed: no lock, no deploy.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock once freeze has recorded infra_head, every
          # other take (infra's included) fails with the reason, and every take reads it again after taking its keys.
          # Waits fit the runners (§5.4a): every wait counts towards LOCK_WAIT_CAP_SECONDS; a run of the same scope holding the key
          # is waited for at most LOCK_WAIT_SECONDS; at a limit the step fails with "waiting for <holder> (<scope>, run <id>);
          # re-run", holding nothing. Every LOCK_REMINT_SECONDS inside a wait the App token and the AWS role session are minted again.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_LEGACY_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          LOCK_OWNER="${GITHUB_REPOSITORY%%/*}"
          LOCK_MINTED=${SECONDS}
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_scope_repo() {  # lock_scope_repo <scope> -> the scope's owning repo
            case "$1" in
              infra) echo "${LOCK_OWNER}/onepeek-infra" ;;
              backend) echo "${LOCK_OWNER}/backend-service" ;;
              web) echo "${LOCK_OWNER}/onepeek-web" ;;
              mcp) echo "${LOCK_OWNER}/mcp-athena" ;;
              *) return 1 ;;
            esac
          }
          lock_repo_scope() {  # lock_repo_scope <owner/repo> -> the scope that repo owns; 1 when it owns none
            case "${1#*/}" in
              onepeek-infra) echo infra ;;
              backend-service) echo backend ;;
              onepeek-web) echo web ;;
              mcp-athena) echo mcp ;;
              *) return 1 ;;
            esac
          }
          lock_keys() {  # the take set of LOCK_SCOPE, in take order
            case "${LOCK_SCOPE:-}" in
              infra) echo "${LOCK_LEGACY_KEY} locks/infra.json locks/backend.json locks/web.json locks/mcp.json" ;;
              backend|web|mcp) echo "${LOCK_LEGACY_KEY} locks/${LOCK_SCOPE}.json" ;;
              *) echo "::error::No lock scope (LOCK_SCOPE='${LOCK_SCOPE:-}'): it must be infra, backend, web or mcp." >&2; return 1 ;;
            esac
          }
          lock_reverse() {  # lock_reverse <words> -> the words in reverse order
            local out="" w words
            read -r -a words <<< "$1"
            for w in "${words[@]}"; do out="${w} ${out}"; done
            echo "${out}"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token> <scope> <phase> <migrate task> <repair run>"; 1 when not a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt = record["repo"], str(record["run_id"]), str(record["run_attempt"])
              token, scope, phase = str(record.get("token", "-")), str(record.get("scope", "-")), str(record.get("phase", "locked"))
              task, repair = str(record.get("migrate_task") or "-"), str(record.get("repair_run") or "-")
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)
                  and scope in ("infra", "backend", "web", "mcp", "-") and phase in ("locked", "migrating", "rolling", "done")
                  and re.fullmatch(r"arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task/[A-Za-z0-9_/-]+|-", task) and re.fullmatch(r"[0-9]+-[0-9]+|-", repair)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token, scope, phase, task, repair)' "$1"
