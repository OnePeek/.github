# Shared release workflow (onepeek-docs architecture/lld/infra/delivery-pipelines.md UC-DEL-001, UC-DEL-005, §5).
# Called by backend-service and onepeek-web on a push to the branch their preprod deploy runs from (release until launch,
# dev after the switch-over; playbook §5.4); prod is promote-only (promote.yml, UC-DEL-003), so this workflow refuses
# environment prod. The caller only passes inputs. Jobs, in order:
# lock (the cross-repo release lock and the order check, playbook §5.4), version, build (build-image, or build-web for web,
# joined by build), scan, sbom-sign, record-digest, db-bootstrap, migrate, assets, rollout, register-one-offs, smoke,
# watch, rollback (only on failure), notify, unlock (always), api-client. Nobody deploys from a laptop.
# Every preprod artefact is keyed on the commit, sha-<12> (foundation-playbook §5.2, decision 159): the image tag, the
# web-assets folder, the SSM release record and the task-definition tags. The release-please version is image metadata
# only; the v<version> tag, the git tag and the GitHub release are made on promotion (promote.yml, UC-DEL-003).
#
# Provisional (delivery-pipelines §16 "Decided before building"): ARM64 images are built with QEMU on GitHub's
# standard runners (Q1), natively on ARM64 runners when the runner input picks them (ci-runners.md section 5.3); team notices go to the run summary and the GitHub deployment record until Q2 picks a channel (preprod has no release page, playbook §5.2).
# `dry-run: true` (§15) renders every task definition and checks every signature, and changes nothing.
name: release-ecs

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github
      environment:
        description: Environment; resources are named onepeek-<environment>.
        type: string
        required: true
      image:
        description: The main image, backend or web.
        type: string
        required: true
      extra-images:
        description: Further images built in the same run (sandbox). Empty until the sandbox image exists.
        type: string
        default: ""
      migrate:
        description: Run the migrate task before the rollout (backend only).
        type: boolean
        default: false
      assets:
        description: Copy the web build's assets to the web-assets bucket before the rollout (web only, UC-DEL-005).
        type: boolean
        default: false
      domain:
        description: The environment's public host name, for the smoke checks.
        type: string
        required: true
      role-to-assume:
        description: The repo's deploy role (onepeek-<env>-deploy-<repo>).
        type: string
        required: true
      signing-key:
        description: The cosign key reference, for example awskms:///alias/onepeek-preprod-image-signing.
        type: string
        required: true
      dry-run:
        description: Render every task definition and verify every signature; register, run, update and tag nothing.
        type: boolean
        default: false
      db-bootstrap-role:
        description: The onepeek-<env>-deploy-db-bootstrap role that infra's reusable db-bootstrap workflow assumes (backend only, with migrate; decision 148).
        type: string
        default: ""
      smoke-script:
        description: The caller repo's smoke checks against https://<domain>, run in addition to the shared baseline readiness check (delivery-pipelines UC-DEL-001 row 7), without AWS credentials, with DOMAIN set. Absent = a visible warning.
        type: string
        default: smoke.sh
      deploy-from-dev:
        description: Allow a release triggered from refs/heads/dev. Off until the launch switch-over makes dev preprod (foundation-playbook §5.4; until launch release is preprod).
        type: boolean
        default: false
      allow-drop:
        description: Reviewed setting and secret names allowed to disappear from a service in this release (the contract step of an expand/contract change; delivery-pipelines §5 step 4). Space or comma separated; a name applies to every container.
        type: string
        default: ""
    secrets:
      NPM_READ_TOKEN:
        description: Retired and ignored (foundation-playbook §12a slice 3). The build reads @onepeek packages with the run's GITHUB_TOKEN (packages read). Kept optional only so a caller that still passes it does not fail; delete it once onepeek-web stops passing it.
        required: false
      AGENTS_APP_CLIENT_ID:
        description: The agents' GitHub App (playbook §5.3, §5.4). Required. Its token, with Actions read, lets a waiting run see that another repo's lock holder has finished; without it such a lock could never be taken over.
        required: true
      AGENTS_APP_PRIVATE_KEY:
        description: The agents' GitHub App private key (with AGENTS_APP_CLIENT_ID). Required.
        required: true

permissions: {}

env:
  COSIGN_EXPERIMENTAL: "1" # required by the OCI 1.1 referrers mode (delivery-pipelines §5)
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  NAME: onepeek-${{ inputs.environment }}
  ENVIRONMENT: ${{ inputs.environment }}
  VERSION_FILE: .release-please-manifest.json
  LOCK_WAIT_SECONDS: "1800" # waits up to 30 minutes for the release lock (playbook §5.4)
  LOCK_POLL_SECONDS: "30" # polling every 30 s

jobs:
  lock:
    # The cross-repo release lock (foundation-playbook §5.4; UC-DEL-001; E5), taken by the first job, before any build:
    # one release per environment at a time across infra, backend, web and MCP. No `concurrency` group: GitHub keeps
    # one pending run per group and cancels the older one (playbook §5.1 step 7). The unlock job releases it, always.
    # Then the order check: a release of a commit older than what runs is a skip.
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      attempt: ${{ steps.take.outputs.attempt }}
      token: ${{ steps.take.outputs.token }}
      skip: ${{ steps.order.outputs.skip }}
    steps:
      - name: Prod is promote-only (promote.yml, UC-DEL-003); this workflow deploys preprod
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          if [ "${ENVIRONMENT_NAME}" = "prod" ]; then
            echo "::error::release-ecs never deploys prod: prod promotes the digests recorded for the merged dev commit (promote.yml)."
            exit 1
          fi
      - name: Deploy from dev is off until the launch switch-over (foundation-playbook §5.4)
        env:
          DEPLOY_FROM_DEV: ${{ inputs.deploy-from-dev }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/dev" ] && [ "${DEPLOY_FROM_DEV}" != "true" ]; then
            echo "::error::deploy from dev is disabled until the launch switch-over (foundation-playbook §5.4)"
            exit 1
          fi
      - name: The agents' GitHub App secrets are set (required, playbook §5.4)
        env:
          HAS_APP: ${{ secrets.AGENTS_APP_CLIENT_ID != '' && secrets.AGENTS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_APP}" != "true" ]; then
            echo "::error::AGENTS_APP_CLIENT_ID and AGENTS_APP_PRIVATE_KEY must be passed: without the App token a lock left by another repo's finished run could never be taken over (playbook §5.4)."
            exit 1
          fi
      - name: The agents' GitHub App token (Actions read), to see whether another repo's lock holder has finished
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend-service,onepeek-web,onepeek-infra,mcp-athena # the repos that take the lock (playbook §5.4)
          permission-actions: read
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Take the release lock
        id: take
        env:
          LOCK_GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # The cross-repo release lock (foundation-playbook §5.4): one per environment, s3://onepeek-<env>-deploy/locks/release.json,
          # taken with a conditional write (If-None-Match: *) and removed with a conditional delete on its ETag (If-Match). The
          # record names the repo, run ID, run attempt, commit, start time and a random token; only the holder of the token
          # releases it. Anything unreadable fails closed: no lock, no deploy. A lock is never removed while its run is still
          # running: only its token's holder, or a waiter that GitHub shows the holder's run has finished, removes it.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock, every other take fails with the reason.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token>"; 1 when the file is not such a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt, token = record["repo"], str(record["run_id"]), str(record["run_attempt"]), str(record.get("token", "-"))
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token)' "$1"
          }
          lock_delete() {  # lock_delete <key> <etag> -> 0 removed, 2 changed or gone meanwhile (read it again), 1 any other answer
            local msg
            if aws s3api delete-object --bucket "${LOCK_BUCKET}" --key "$1" --if-match "$2" >/dev/null 2>"${LOCK_ERR}"; then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*|*"(NoSuchKey)"*) return 2 ;; esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be removed: ${msg}"
            return 1
          }
          lock_run_finished() {  # lock_run_finished <repo> <run id> -> 0 only when GitHub reports the run completed
            local status
            if ! status=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/$1/actions/runs/$2" --jq .status 2>"${LOCK_ERR}"); then
              echo "::warning::Cannot read the state of $(lock_url "$1" "$2"), so it counts as running: $(cat "${LOCK_ERR}")"
              return 1
            fi
            [ "${status}" = "completed" ]
          }
          lock_record() {  # lock_record <file> [token]: this run's record
            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", ""), "ref": e.get("GITHUB_REF", "")}
          if len(sys.argv) > 2:
              record["token"] = sys.argv[2]
              del record["who"], record["why"], record["ref"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
          }
          lock_frozen_branch() {  # lock_frozen_branch <file> -> "<repo> <ref>" of a preprod-frozen record; 1 when it is not one
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, ref = record["repo"], record["ref"]
          except Exception as error:
              sys.exit("not a preprod-frozen record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and re.fullmatch(r"refs/heads/hotfix/[A-Za-z0-9_./-]+", ref)):
              sys.exit("not a preprod-frozen record: " + json.dumps(record))
          print(repo, ref)' "$1"
          }
          lock_frozen_for_others() {  # 0 when preprod-frozen names another branch (the reason is printed), 1 when not frozen for us, 2 unreadable
            local etag branch repo ref
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${etag}" = "absent" ]; then return 1; fi
            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF:-}" ]; then return 1; fi
            python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));print("preprod is frozen by %s (%s) for the hotfix branch %s %s, first frozen by %s" % (r.get("who","?"), r.get("why","?"), r["repo"], r["ref"], r.get("run","?")))' lock-frozen.json
            return 0
          }
          lock_take() {  # waits up to LOCK_WAIT_SECONDS, polling every LOCK_POLL_SECONDS, then fails naming the holder's run
            local msg etag holder repo run attempt token rc deadline reason
            if [ -z "${LOCK_TOKEN:-}" ]; then echo "::error::No lock token."; return 1; fi
            lock_record lock-mine.json "${LOCK_TOKEN}"
            deadline=$((SECONDS + LOCK_WAIT_SECONDS))
            while :; do
              rc=0
              reason=$(lock_frozen_for_others) || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "::error::The ${ENVIRONMENT} release lock is refused: ${reason}."; return 1; fi
              if [ "${rc}" -eq 2 ]; then echo "::error::s3://${LOCK_BUCKET}/${FROZEN_KEY} is unreadable, so nothing is deployed."; return 1; fi
              # No encryption flags: the bucket default applies (aws-stack §16).
              if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${LOCK_KEY}" --body lock-mine.json --if-none-match '*' \
                --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
                echo "Took the ${ENVIRONMENT} release lock (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 0
              fi
              msg=$(cat "${LOCK_ERR}")
              case "${msg}" in
                *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;;   # held, or another write at the same moment: see who holds it
                *) echo "::error::The release lock could not be written, so nothing is deployed: ${msg}"; return 1 ;;
              esac
              if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
                echo "::error::The release lock is unreadable, so nothing is deployed."
                return 1
              fi
              if [ "${etag}" = "absent" ]; then   # released between the write and the read: write again
                if [ "${SECONDS}" -ge "${deadline}" ]; then echo "::error::The release lock could not be taken in ${LOCK_WAIT_SECONDS} s."; return 1; fi
                sleep 1
                continue
              fi
              if ! holder=$(lock_holder lock-held.json); then
                echo "::error::The release lock holds no readable record, so nothing is deployed (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 1
              fi
              read -r repo run attempt token <<< "${holder}"
              if { [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" -lt "${GITHUB_RUN_ATTEMPT}" ]; } \
                || lock_run_finished "${repo}" "${run}"; then
                # An earlier attempt of this run (one attempt runs at a time), or a finished run that never released it.
                echo "The release lock is held by $(lock_url "${repo}" "${run}") (attempt ${attempt}), which is not running; taking it over."
                rc=0
                lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
                if [ "${rc}" -eq 1 ]; then return 1; fi
                continue
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::The ${ENVIRONMENT} release lock is still held after ${LOCK_WAIT_SECONDS} s by $(lock_url "${repo}" "${run}")."
                return 1
              fi
              echo "Waiting for the ${ENVIRONMENT} release lock, held by $(lock_url "${repo}" "${run}")."
              sleep "${LOCK_POLL_SECONDS}"
            done
          }
          lock_release() {  # removes the lock only when its token is LOCK_TOKEN (handed over by the lock job's outputs)
            local etag holder repo run attempt token rc
            if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
              echo "::error::The release lock is unreadable; it stays until a later release sees this run has finished."
              return 1
            fi
            if [ "${etag}" = "absent" ]; then echo "No release lock is held."; return 0; fi
            if ! holder=$(lock_holder lock-held.json); then
              echo "::error::The release lock holds no readable record; it is left in place."
              return 1
            fi
            read -r repo run attempt token <<< "${holder}"
            if [ -z "${LOCK_TOKEN:-}" ] || [ "${token}" != "${LOCK_TOKEN}" ]; then
              echo "The release lock is held by $(lock_url "${repo}" "${run}") under another token, not this call; it is left in place."
              return 0
            fi
            rc=0
            lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Released the ${ENVIRONMENT} release lock." ;;
              2) echo "::warning::The release lock changed while it was being released; it is left in place." ;;
              *) return 1 ;;
            esac
          }
          lock_freeze() {  # preprod-frozen (§5.4, §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            local msg etag branch repo ref
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${FROZEN_KEY}" --body lock-frozen-mine.json --if-none-match '*' \
              --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
              echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY})."
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;; *) echo "::error::preprod-frozen could not be written: ${msg}"; return 1 ;; esac
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json) || [ "${etag}" = "absent" ] || ! branch=$(lock_frozen_branch lock-frozen.json); then
              echo "::error::preprod-frozen could not be read back."
              return 1
            fi
            read -r repo ref <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then echo "${ENVIRONMENT} is already frozen for this branch."; return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          # A random token names this take; unlock gets it through the job outputs and releases only on a match.
          LOCK_TOKEN=$(python3 -c "import secrets;print(secrets.token_hex(16))")
          echo "token=${LOCK_TOKEN}" >> "$GITHUB_OUTPUT"
          lock_take
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Order. A newer commit already running makes this release a skip (playbook §5.4)
        id: order
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # The commit of what runs is each service's task-definition `commit` tag. When this commit is its ancestor,
          # an older run must never undo a newer one: everything after this job is skipped and unlock releases the lock.
          aws s3 cp "s3://${NAME}-deploy/taskdef/index.json" index.json --only-show-errors
          services=$(python3 -c '
          import json, os
          index = json.load(open("index.json"))
          print(" ".join(e["service"] for e in index.values() if isinstance(e, dict) and e.get("image") == os.environ["IMAGE"] and e.get("kind") != "one-off"))')
          mine="sha-${GITHUB_SHA::12}"
          skip=false
          for svc in ${services}; do
            td=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text)
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then continue; fi   # not deployed yet
            running=$(aws ecs describe-task-definition --task-definition "${td}" --include TAGS --query "tags[?key=='commit'].value | [0]" --output text)
            if [ -z "${running}" ] || [ "${running}" = "None" ] || [ "${running}" = "${mine}" ]; then continue; fi
            if ! [[ "${running}" =~ ^sha-[0-9a-f]{12}$ ]]; then
              echo "::error::${svc} carries the commit tag '${running}', not sha-<12>; the order cannot be checked, so nothing is deployed."; exit 1
            fi
            if ! full=$(git rev-parse --verify --quiet "${running#sha-}^{commit}"); then
              echo "::error::${svc} runs ${running}, which is not in this repository's history; the order cannot be checked, so nothing is deployed."; exit 1
            fi
            rc=0
            git merge-base --is-ancestor "${GITHUB_SHA}" "${full}" || rc=$?
            case "${rc}" in
              0) skip=true
                 echo "::notice::${svc} already runs ${running}, which includes this commit (${mine}): this release is a skip and changes nothing."
                 echo "Skipped: ${svc} already runs ${running}, which includes ${mine}." >> "$GITHUB_STEP_SUMMARY"
                 break ;;
              1) ;;
              *) echo "::error::git merge-base failed (${rc}); the order cannot be checked, so nothing is deployed."; exit 1 ;;
            esac
          done
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  version:
    needs: lock
    if: ${{ needs.lock.outputs.skip != 'true' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      images: ${{ steps.v.outputs.images }}
      started: ${{ steps.v.outputs.started }}
    steps:
      - name: Refuse at once a migrating release with no db-bootstrap role
        env:
          MIGRATE: ${{ inputs.migrate }}
          DRY_RUN: ${{ inputs.dry-run }}
          ROLE: ${{ inputs.db-bootstrap-role }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          if [ "${MIGRATE}" = "true" ] && [ "${DRY_RUN}" != "true" ] && [ -z "${ROLE}" ]; then
            upper=$(echo "${ENVIRONMENT_NAME}" | tr '[:lower:]' '[:upper:]')
            echo "::error::db-bootstrap-role is empty. Set the backend repository variable AWS_DB_BOOTSTRAP_ROLE_${upper} to the onepeek-${ENVIRONMENT_NAME}-db-bootstrap role ARN and pass it as db-bootstrap-role."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the commit sha-<12>, and read the next version as image metadata only
        id: v
        env:
          IMAGE: ${{ inputs.image }}
          EXTRA: ${{ inputs.extra-images }}
        run: |
          # No version-tag check here: preprod deploys carry only the commit, and promote.yml refuses a version whose
          # tag exists (delivery-pipelines UC-DEL-001 row 1).
          commit="sha-${GITHUB_SHA::12}"
          version=$(python3 -c "import json;print(json.load(open('${VERSION_FILE}'))['.'])")
          if [ -z "${version}" ]; then echo "::error::No version in ${VERSION_FILE}."; exit 1; fi
          images=$(python3 -c "import json,os;print(json.dumps([os.environ['IMAGE']]+[x for x in os.environ['EXTRA'].replace(',',' ').split() if x]))")
          { echo "version=${version}"; echo "commit=${commit}"; echo "images=${images}"; echo "started=$(date +%s)"; } >> "$GITHUB_OUTPUT"
          echo "Release of ${commit} (next version ${version}) to ${ENVIRONMENT} started." >> "$GITHUB_STEP_SUMMARY"

  build-image:
    # Every image but web. arm-build class: the hosted fallback stays ubuntu-latest with QEMU (today's behaviour) instead
    # of ubuntu-24.04-arm until hosted ARM is proven on a private repo (ci-runners.md section 5.3 lists ubuntu-24.04-arm).
    # Its token has no packages scope: only the web build reads @onepeek packages (least privilege).
    needs: version
    if: ${{ !inputs.dry-run && inputs.image != 'web' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ runner.arch != 'ARM64' }}
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for ARM64 and push sha-<12>
        id: push
        env:
          IMAGE: ${{ matrix.image }}
          MAIN: ${{ inputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          NPM_TOKEN: ${{ matrix.image == 'web' && github.token || '' }} # web only; packages: read on build-web, each package grants this repo Actions read access
        run: |
          if [ "${IMAGE}" != "${MAIN}" ]; then
            echo "::error::No Dockerfile location is defined for the extra image '${IMAGE}' (delivery-pipelines §16: the sandbox image waits for document parsing)."
            exit 1
          fi
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          repo="${registry}/${NAME}/${IMAGE}"
          # A re-run of this commit: sha-<12> is immutable in ECR and names this commit's build, so the image already
          # there is reused (UC-DEL-001 row 2). It is scanned again, and sbom-sign signs it if it was never recorded.
          ecr_error=$(mktemp)   # outside the workspace: it is the Docker build context
          if found=$(aws ecr describe-images --repository-name "${NAME}/${IMAGE}" --image-ids "imageTag=${COMMIT}" --query 'imageDetails[0].imageDigest' --output text 2>"${ecr_error}"); then
            echo "Reusing ${IMAGE}:${COMMIT} (${found}): this commit was built before."
            echo "digest=${found}" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}=${found}" > "digest-${IMAGE}.txt"
            exit 0
          elif ! grep -q ImageNotFoundException "${ecr_error}"; then
            cat "${ecr_error}" >&2
            exit 1
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          # Both tags are immutable in ECR. The ':buildcache' tag cannot be written twice in an immutable repository,
          # so the cache is read always and written best effort (ignore-error); see the gap noted in the pull request.
          # The next version is metadata only, as SemVer build metadata on the commit: <next>+sha-<12> (playbook §5.2).
          label="${VERSION}+${COMMIT}"
          args=(--platform linux/arm64 --provenance=false
            --label "org.opencontainers.image.version=${label}" --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --cache-from "type=registry,ref=${repo}:buildcache"
            --cache-to "type=registry,ref=${repo}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            --tag "${repo}:${COMMIT}"
            --metadata-file meta.json --push)
          # Baked into the image, never a start-up variable (aws-stack §16 "Image commit"): the backend's
          # ONEPEEK_COMMIT, VERSION and REVISION; the web image's RELEASE (its WEB_RELEASE), which names its assets folder.
          case "${IMAGE}" in
            backend) args+=(--build-arg "ONEPEEK_COMMIT=${GITHUB_SHA}" --build-arg "VERSION=${label}" --build-arg "REVISION=${GITHUB_SHA}") ;;
            web) args+=(--build-arg "RELEASE=${COMMIT}") ;;
          esac
          if [ -n "${NPM_TOKEN}" ]; then
            args+=(--secret "id=npm_token,env=NPM_TOKEN")   # a BuildKit secret, never a build argument or layer
          fi
          docker buildx build "${args[@]}" .
          digest=$(python3 -c "import json;print(json.load(open('meta.json'))['containerimage.digest'])")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}=${digest}" > "digest-${IMAGE}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt
          retention-days: 1

  build-web:
    # The web image: the same steps as build-image, and the only job whose token reads packages (@onepeek/* from
    # GitHub Packages, a BuildKit secret in the build). Same runner class as build-image.
    needs: version
    if: ${{ !inputs.dry-run && inputs.image == 'web' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: read # @onepeek/* from GitHub Packages for the web build
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps: *build-steps

  build:
    # Joins build-image and build-web so the later jobs need one name: it passes only when exactly one of them ran and
    # succeeded, and fails otherwise (a failed or cancelled build stops the release here).
    needs: [build-image, build-web]
    if: ${{ !inputs.dry-run && !cancelled() }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Exactly one build job succeeded
        env:
          IMAGE_RESULT: ${{ needs.build-image.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
        run: |
          case "${IMAGE_RESULT}/${WEB_RESULT}" in
            success/skipped|skipped/success) echo "Build done (build-image ${IMAGE_RESULT}, build-web ${WEB_RESULT})." ;;
            *) echo "::error::The build did not succeed (build-image ${IMAGE_RESULT}, build-web ${WEB_RESULT})."; exit 1 ;;
          esac

  scan:
    needs: [version, build]
    # One of build-image and build-web is always skipped, and GitHub skips every job below a skipped one unless its
    # condition calls a status function, so this job (and sbom-sign) checks the joined build result itself.
    if: ${{ !cancelled() && !inputs.dry-run && needs.build.result == 'success' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Registry login for the scanner
        id: login
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          digest=$(cut -d= -f2 "digest-${IMAGE}.txt")
          echo "ref=${registry}/${NAME}/${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          password=$(aws ecr get-login-password)
          echo "::add-mask::${password}"
          { echo "TRIVY_USERNAME=AWS"; echo "TRIVY_PASSWORD=${password}"; } >> "$GITHUB_ENV"
      - name: The waiver file, only if the repository has one
        id: waiver
        run: |
          if [ -f .trivyignore.yaml ]; then echo "file=.trivyignore.yaml" >> "$GITHUB_OUTPUT"; else echo "file=" >> "$GITHUB_OUTPUT"; fi
      - name: Trivy, a critical finding blocks (DP5). Waivers only in .trivyignore.yaml, with a reason and an expiry date
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login.outputs.ref }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: ${{ steps.waiver.outputs.file }}
          version: v0.76.1
        env:
          TRIVY_PLATFORM: linux/arm64

  sbom-sign:
    needs: [lock, version, build, scan]
    if: ${{ !cancelled() && !inputs.dry-run && needs.build.result == 'success' && needs.scan.result == 'success' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Syft SPDX SBOM, then sign and attest (no public transparency log; OCI 1.1 referrers)
        env:
          IMAGE: ${{ matrix.image }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          digest=$(cut -d= -f2 "digest-${IMAGE}.txt")
          ref="${registry}/${NAME}/${IMAGE}@${digest}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          # Pinned by architecture (both SHA-256 values; syft v1.55.0): the runner may be x64 or ARM64.
          case "${RUNNER_ARCH}" in
            X64) syft_arch=amd64; syft_sha=bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d ;;
            ARM64) syft_arch=arm64; syft_sha=929bd163db2d7cd2255d3bcb8967208079813d7b46b0c952f7b794d8e2c7d304 ;;
            *) echo "::error::Unsupported runner architecture ${RUNNER_ARCH}."; exit 1 ;;
          esac
          curl -sSfL -o syft.tgz "https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_${syft_arch}.tar.gz"
          echo "${syft_sha}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft
          ./syft "registry:${ref}" -o spdx-json=sbom.spdx.json
          # A reused image was signed and attested before its digest was recorded; record-digest verifies the signature again.
          recorded_digest=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/digest" --query Parameter.Value --output text 2>/dev/null || true)
          recorded_commit=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/commit" --query Parameter.Value --output text 2>/dev/null || true)
          if [ "${recorded_digest}" = "${digest}" ] && [ "${recorded_commit}" = "${COMMIT}" ]; then
            echo "${IMAGE} ${COMMIT} is already signed and recorded."
          else
            # cosign v2.6.5 has --registry-referrers-mode on sign only; attest stores its OCI 1.1 referrer with --new-bundle-format (delivery-pipelines §4 row 4).
            cosign sign --yes --tlog-upload=false --registry-referrers-mode=oci-1-1 --key "${SIGNING_KEY}" "${ref}"
            cosign attest --yes --tlog-upload=false --new-bundle-format --type spdxjson \
              --predicate sbom.spdx.json --key "${SIGNING_KEY}" "${ref}"
          fi
          aws ssm put-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/digest" --type String --overwrite --value "${digest}" >/dev/null
          aws ssm put-parameter --name "/onepeek/${ENVIRONMENT}/release/${IMAGE}/commit" --type String --overwrite --value "${COMMIT}" >/dev/null
          mv sbom.spdx.json "sbom-${IMAGE}.spdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 7

  record-digest:
    # Reads back the signed digest that step 4 recorded in SSM and checks its signature. Every later job uses these
    # digests; in a dry run they are simply the digests of the latest release. Nothing is registered here.
    needs: [version, build, scan, sbom-sign]
    # Outside a dry run the image must have been signed in this run, or there is no recorded digest to read back.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (inputs.dry-run || needs.sbom-sign.result == 'success') }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      digests: ${{ steps.read.outputs.digests }}
      registry: ${{ steps.read.outputs.registry }}
      commit: ${{ steps.read.outputs.commit }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Read the recorded digests and verify each signature
        id: read
        env:
          IMAGES: ${{ needs.version.outputs.images }}
          MAIN_IMAGE: ${{ inputs.image }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          digests='{}'
          for image in $(echo "${IMAGES}" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            digest=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${image}/digest" --query Parameter.Value --output text)
            recorded=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${image}/commit" --query Parameter.Value --output text)
            if [ "${DRY_RUN}" != "true" ] && [ "${recorded}" != "${RELEASE_COMMIT}" ]; then
              echo "::error::${image}: SSM records commit ${recorded}, this release is ${RELEASE_COMMIT}."; exit 1
            fi
            cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${registry}/${NAME}/${image}@${digest}" >/dev/null
            digests=$(echo "${digests}" | python3 -c "import json,sys;d=json.load(sys.stdin);d['${image}']='${digest}';print(json.dumps(d))")
          done
          commit="${RELEASE_COMMIT}"
          if [ "${DRY_RUN}" = "true" ]; then commit=$(aws ssm get-parameter --name "/onepeek/${ENVIRONMENT}/release/${MAIN_IMAGE}/commit" --query Parameter.Value --output text); fi
          { echo "digests=${digests}"; echo "registry=${registry}"; echo "commit=${commit}"; } >> "$GITHUB_OUTPUT"

  db-bootstrap:
    # Step 4b (decision 148). Infra's reviewed workflow on its release branch registers and runs db-bootstrap with this
    # signed digest under the onepeek-<env>-deploy-db-bootstrap role, never this repo's deploy role: it creates only missing
    # logins and first values, and changes nothing once they exist. A failure stops the release before migrate.
    # Pinned to infra's release branch on purpose: the role trusts only job_workflow_ref
    # OnePeek/onepeek-infra/.github/workflows/db-bootstrap.yml@refs/heads/release (aws-stack §12).
    # Only in the attempt that took the release lock: a re-run of only some jobs skips it, and migrate and rollout then
    # fail on their own lock check.
    needs: [lock, version, record-digest]
    if: ${{ !cancelled() && needs.record-digest.result == 'success' && inputs.migrate && !inputs.dry-run && needs.lock.outputs.attempt == format('{0}', github.run_attempt) }}
    permissions:
      contents: read
      id-token: write
    uses: OnePeek/onepeek-infra/.github/workflows/db-bootstrap.yml@release # zizmor: ignore[unpinned-uses] the role's trust names this ref
    with:
      environment: ${{ inputs.environment }}
      digest: ${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
      version: ${{ needs.record-digest.outputs.commit }} # the commit sha-<12>: preprod artefacts carry no version (playbook §5.2)
      role-to-assume: ${{ inputs.db-bootstrap-role }}
      signing-key: ${{ inputs.signing-key }}
    secrets:
      AGENTS_APP_CLIENT_ID: ${{ secrets.AGENTS_APP_CLIENT_ID }}
      AGENTS_APP_PRIVATE_KEY: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}

  migrate:
    needs: [lock, version, record-digest, db-bootstrap]
    if: ${{ !cancelled() && needs.record-digest.result == 'success' && inputs.migrate && (needs.db-bootstrap.result == 'success' || inputs.dry-run) }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Verify, render, register and run the migrate task (the running version is untouched on failure)
        env:
          IMAGE_REF: ${{ needs.record-digest.outputs.registry }}/onepeek-${{ inputs.environment }}/${{ inputs.image }}@${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          COMMIT: ${{ needs.record-digest.outputs.commit }}
          VERSION: "" # the version tag is added only on promotion to prod (playbook §5.2)
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
            aws ecs describe-task-definition --task-definition "${td}" --query taskDefinition --output json > "$2" || return 1
            echo "$2"
          }
          render() {  # render <service> <one-off | first-deploy | current task definition file> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              # Per service, not per container: a name may move between containers (the placeholder revision holds a
              # sidecar'"'"'s variables in the one container the real template splits in two). The container is context only.
              new = set().union(*(names(c, "environment") | names(c, "secrets") for c in containers))
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
          aws ecr get-login-password | cosign login "${IMAGE_REF%%/*}" --username AWS --password-stdin >/dev/null  # cosign reads the signature from ECR (first live release: 401)
          cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${IMAGE_REF}" >/dev/null
          render migrate one-off > migrate.json
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: migrate renders and its signature verifies."; exit 0; fi
          arn=$(aws ecs register-task-definition --cli-input-json file://migrate.json --query taskDefinition.taskDefinitionArn --output text)
          task=$(aws ecs run-task --cluster "${NAME}" --task-definition "${arn}" --started-by "release-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started migrate (${task##*/}); waiting."
          aws ecs wait tasks-stopped --cluster "${NAME}" --tasks "${task}"
          code=$(aws ecs describe-tasks --cluster "${NAME}" --tasks "${task}" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "${code}" = "None" ]; then   # the container never ran (image pull, placement, role): no exit code exists
            code="none (the container did not run)"
          fi
          if [ "${code}" != "0" ]; then
            if [ "${code}" = "3" ]; then
              echo "::error::migrate exited 3 (login_missing_run_bootstrap): db-bootstrap did not create the login."
            else
              echo "::error::migrate exited ${code}. The running version is untouched."
            fi
            # migrate logs with awslogs to /onepeek/<env>/one-off, which this role may read (aws-stack §16 "One-off tasks").
            echo "migrate task ${task##*/}: exit code ${code}"
            aws ecs describe-tasks --cluster "${NAME}" --tasks "${task}" \
              --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containerReason:containers[0].reason,lastStatus:lastStatus}' --output json
            log_group="/onepeek/${ENVIRONMENT}/one-off"
            log_stream="migrate/migrate/${task##*/}"   # awslogs: <stream prefix>/<container name>/<task id>
            echo "Output of migrate (${log_group}, ${log_stream}):"
            aws logs get-log-events --log-group-name "${log_group}" --log-stream-name "${log_stream}" --limit 200 \
              --query 'events[].[message]' --output text || echo "No output could be read: the container may never have started."
            exit 1
          fi

  assets:
    # UC-DEL-005: between sbom-sign and rollout. The files are the exact bytes of the built image.
    needs: [lock, version, record-digest]
    if: ${{ !cancelled() && needs.record-digest.result == 'success' && inputs.assets }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Copy /app/dist/assets to web-assets/sha-<12>/ (never overwrite) and prune old folders
        env:
          IMAGE_REF: ${{ needs.record-digest.outputs.registry }}/onepeek-${{ inputs.environment }}/${{ inputs.image }}@${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
          REGISTRY: ${{ needs.record-digest.outputs.registry }}
          COMMIT: ${{ needs.record-digest.outputs.commit }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          bucket="${NAME}-web-assets"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY}"
          docker pull --platform linux/arm64 "${IMAGE_REF}" >/dev/null
          id=$(docker create --platform linux/arm64 "${IMAGE_REF}")
          docker cp "${id}:/app/dist/assets" ./assets-out
          docker rm "${id}" >/dev/null
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: $(find assets-out -type f | wc -l) asset files extracted; nothing uploaded."; exit 0; fi
          if [ -n "$(aws s3api list-objects-v2 --bucket "${bucket}" --prefix "${COMMIT}/" --max-keys 1 --query 'Contents[0].Key' --output text | grep -v '^None$' || true)" ]; then
            echo "web-assets/${COMMIT}/ already exists; assets are never overwritten (a re-run is a no-op)."
          else
            # No encryption flags: the bucket default applies (aws-stack §16). `--sse aws:kms` alone would ask for the AWS-managed key.
            aws s3 sync ./assets-out "s3://${bucket}/${COMMIT}/" --cache-control "public, max-age=31536000, immutable" --only-show-errors
          fi
          # Delete folders that are both beyond the last 10 releases and older than 90 days.
          python3 - <<'PY'
          import datetime, json, os, subprocess
          bucket = os.environ["NAME"] + "-web-assets"
          out = subprocess.run(["aws", "s3api", "list-objects-v2", "--bucket", bucket, "--output", "json"],
                               check=True, capture_output=True, text=True).stdout
          objects = (json.loads(out) or {}).get("Contents", []) if out.strip() not in ("", "null") else []
          folders = {}
          for o in objects:
              folder = o["Key"].split("/", 1)[0]
              when = datetime.datetime.fromisoformat(o["LastModified"].replace("Z", "+00:00"))
              folders[folder] = max(folders.get(folder, when), when)
          newest_first = sorted(folders, key=lambda f: folders[f], reverse=True)
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=90)
          for folder in newest_first[10:]:
              if folders[folder] < cutoff:
                  subprocess.run(["aws", "s3", "rm", "s3://%s/%s/" % (bucket, folder), "--recursive", "--only-show-errors"], check=True)
                  print("Deleted old assets folder", folder)
          PY

  rollout:
    needs: [lock, version, record-digest, db-bootstrap, migrate, assets]
    if: ${{ !cancelled() && needs.record-digest.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      previous: ${{ steps.previous.outputs.previous }}
      services: ${{ steps.index.outputs.services }}
      stable-at: ${{ steps.roll.outputs.stable-at }}
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Pinned tools (PyYAML for the services file, uv for the gateway routes) in a virtual environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/tools"
          "${RUNNER_TEMP}/tools/bin/pip" install --quiet pyyaml==6.0.3 uv==0.12.0
          echo "${RUNNER_TEMP}/tools/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ inputs.image == 'backend' && runner.arch != 'ARM64' }}
        with:
          platforms: arm64
      - name: The services file's services for this image, for E7
        id: file
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # The one services file a release uses: the copy infra's last apply published (delivery-pipelines §13, decision 153).
          aws s3 cp "s3://${NAME}-deploy/services.${ENVIRONMENT}.yaml" services.yaml --only-show-errors
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          import yaml
          doc = yaml.safe_load(open("services.yaml"))
          defaults = doc.get("defaults", {})
          rolled = {"request", "connection", "event", "job", "workflow", "schedule"}
          names = []
          for name, svc in doc["services"].items():
              if svc.get("image", defaults.get("image")) == os.environ["IMAGE"] and rolled & set(svc.get("triggers", [])):
                  names.append(name)
          print("services=" + json.dumps(names))
          PY
      - name: E7. The services file must only name services the image can run (backend only)
        if: ${{ inputs.image == 'backend' }}
        env:
          IMAGE_REF: ${{ needs.record-digest.outputs.registry }}/onepeek-${{ inputs.environment }}/${{ inputs.image }}@${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
          SERVICES: ${{ steps.file.outputs.services }}
          REGISTRY: ${{ needs.record-digest.outputs.registry }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY}"
          docker pull --platform linux/arm64 "${IMAGE_REF}" >/dev/null
          listed=$(docker run --rm --platform linux/arm64 "${IMAGE_REF}" --list)
          LISTED="${listed}" python3 -c "
          import json, os
          can = set(json.loads(os.environ['LISTED'])['services'])
          missing = [s for s in json.loads(os.environ['SERVICES']) if s.replace('-', '_') not in can and s not in can]
          if missing:
              raise SystemExit('The services file names services this image cannot run: ' + ', '.join(missing))"
      - name: The families this image rolls, in order (taskdef/index.json, aws-stack §6.3 "Task definition index")
        id: index
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # Every family whose image is this one, never a one-off; lowest order first (the daemons pgbouncer and valkey at 0
          # for the backend, then the services). Each order is rolled and stable before the next.
          aws s3 cp "s3://${NAME}-deploy/taskdef/index.json" index.json --only-show-errors
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          index = json.load(open("index.json"))
          kinds = {"service", "daemon", "one-off"}
          name = re.compile(r"^[a-z0-9-]+$")
          def valid(e):
              return (isinstance(e, dict) and e.get("kind") in kinds and type(e.get("order")) is int
                      and isinstance(e.get("service"), str) and name.fullmatch(e["service"]) is not None)
          bad = sorted(f for f, e in index.items() if not valid(e) or not name.fullmatch(f))
          if bad:
              raise SystemExit("taskdef/index.json entries without a valid kind, order and service: " + ", ".join(bad))
          services = [e["service"] for e in index.values()]
          dupes = sorted({s for s in services if services.count(s) > 1})
          if dupes:
              raise SystemExit("taskdef/index.json names a service twice: " + ", ".join(dupes))
          rolled = [e for e in index.values() if e.get("image") == os.environ["IMAGE"] and e["kind"] != "one-off"]
          groups = [[e["service"] for e in rolled if e["order"] == order] for order in sorted({e["order"] for e in rolled})]
          if not groups:
              raise SystemExit("taskdef/index.json names no family with image " + os.environ["IMAGE"])
          print("groups=" + json.dumps(groups))
          print("services=" + json.dumps([s for g in groups for s in g]))
          PY
      - name: The gateway routes (backend only, additive within a release; the gateway reloads within 30 s)
        if: ${{ inputs.image == 'backend' && !inputs.dry-run }}
        run: |
          # `app api routes` reads the same services file the release read above (platform/api.md §16 `--services-file`).
          uv run --frozen --no-dev app api routes --env "${ENVIRONMENT}" --services-file services.yaml --out gateway-routes.json
          # No encryption flags: the bucket default applies (aws-stack §16). `--sse aws:kms` alone would ask for the AWS-managed key.
          aws s3 cp gateway-routes.json "s3://${NAME}-deploy/gateway-routes.json" --only-show-errors
      - name: Record every service's current task definition (for the rollback)
        id: previous
        env:
          SERVICES: ${{ steps.index.outputs.services }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          prev = {}
          for svc in json.loads(os.environ["SERVICES"]):
              out = subprocess.run(["aws", "ecs", "describe-services", "--cluster", os.environ["NAME"], "--services", svc,
                                    "--query", "services[0].taskDefinition", "--output", "text"], check=True, capture_output=True, text=True).stdout.strip()
              prev[svc] = out
          print("previous=" + json.dumps(prev))
          PY
      - name: Verify, render, register and update each order's services in parallel, waiting for each order to be stable
        id: roll
        env:
          IMAGE_REF: ${{ needs.record-digest.outputs.registry }}/onepeek-${{ inputs.environment }}/${{ inputs.image }}@${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          COMMIT: ${{ needs.record-digest.outputs.commit }}
          VERSION: "" # the version tag is added only on promotion to prod (playbook §5.2)
          ORDERS: ${{ steps.index.outputs.groups }}
          ALLOW_DROP: ${{ inputs.allow-drop }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
            aws ecs describe-task-definition --task-definition "${td}" --query taskDefinition --output json > "$2" || return 1
            echo "$2"
          }
          render() {  # render <service> <one-off | first-deploy | current task definition file> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              # Per service, not per container: a name may move between containers (the placeholder revision holds a
              # sidecar'"'"'s variables in the one container the real template splits in two). The container is context only.
              new = set().union(*(names(c, "environment") | names(c, "secrets") for c in containers))
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
          aws ecr get-login-password | cosign login "${IMAGE_REF%%/*}" --username AWS --password-stdin >/dev/null  # cosign reads the signature from ECR (first live release: 401)
          cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${IMAGE_REF}" >/dev/null
          # One line per order, lowest first: the services of that order, separated by spaces.
          echo "${ORDERS}" | python3 -c "import json,sys;print('\n'.join(' '.join(g) for g in json.load(sys.stdin)))" > groups.txt
          count=0
          while read -r group <&3; do
            for svc in ${group}; do
              mode=$(current_td "${svc}" "current-${svc}.json")
              render "${svc}" "${mode}" > "td-${svc}.json"; count=$((count + 1))
            done
          done 3< groups.txt
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: rendered ${count} task definitions; signature verified."; exit 0; fi
          while read -r group <&3; do
            for svc in ${group}; do
              arn=$(aws ecs register-task-definition --cli-input-json "file://td-${svc}.json" --query taskDefinition.taskDefinitionArn --output text)
              aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${arn}" >/dev/null
              echo "${svc} -> ${arn##*/}"
            done
            # shellcheck disable=SC2086
            if ! aws ecs wait services-stable --cluster "${NAME}" --services ${group}; then
              echo "::error::A service of ${group} did not become stable (the ECS circuit breaker has rolled it back)."; exit 1
            fi
          done 3< groups.txt
          echo "stable-at=$(date +%s)" >> "$GITHUB_OUTPUT"   # merge-to-running time in the notice (delivery-pipelines §12, §14)
      - name: Lambda sandbox functions, new version, move the live alias (only when sandbox is released)
        if: ${{ !inputs.dry-run && contains(inputs.extra-images, 'sandbox') }}
        env:
          SANDBOX_REF: ${{ needs.record-digest.outputs.registry }}/onepeek-${{ inputs.environment }}/sandbox@${{ fromJSON(needs.record-digest.outputs.digests).sandbox }}
        run: |
          for fn in parse fetch; do
            aws lambda update-function-code --function-name "${NAME}-sandbox-${fn}" \
              --image-uri "${SANDBOX_REF}" >/dev/null
            aws lambda wait function-updated --function-name "${NAME}-sandbox-${fn}"
            ver=$(aws lambda publish-version --function-name "${NAME}-sandbox-${fn}" --query Version --output text)
            aws lambda update-alias --function-name "${NAME}-sandbox-${fn}" --name live --function-version "${ver}" >/dev/null
          done

  register-one-offs:
    # 6b. The ops family only. Nothing is run. migrate is registered in its own job, db-bootstrap by infra's db-bootstrap workflow (4b), db-rotate only by ci-apply.
    needs: [lock, version, record-digest, rollout]
    if: ${{ !cancelled() && needs.rollout.result == 'success' && inputs.image == 'backend' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Pinned PyYAML in a virtual environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/tools"
          "${RUNNER_TEMP}/tools/bin/pip" install --quiet pyyaml==6.0.3
      - name: Verify, render, check the launch settings, register ops and record its revision
        env:
          IMAGE_REF: ${{ needs.record-digest.outputs.registry }}/onepeek-${{ inputs.environment }}/${{ inputs.image }}@${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
          SIGNING_KEY: ${{ inputs.signing-key }}
          COMMIT: ${{ needs.record-digest.outputs.commit }}
          VERSION: "" # the version tag is added only on promotion to prod (playbook §5.2)
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # --- render-taskdef begin (identical in release-ecs.yml and operate.yml; checked by scripts/check_service_list.py) ---
          # The service's currently registered task definition, for drop protection (delivery-pipelines §5 step 4):
          # prints the file it wrote, or first-deploy when the service has none yet. Any AWS error fails closed.
          current_td() {  # current_td <service> <file>
            local td
            td=$(aws ecs describe-services --cluster "${NAME}" --services "$1" --query 'services[0].taskDefinition' --output text) || return 1
            if [ -z "${td}" ] || [ "${td}" = "None" ]; then echo first-deploy; return 0; fi
            aws ecs describe-task-definition --task-definition "${td}" --query taskDefinition --output json > "$2" || return 1
            echo "$2"
          }
          render() {  # render <service> <one-off | first-deploy | current task definition file> -> task definition JSON on stdout
            aws s3 cp "s3://${NAME}-deploy/taskdef/$1.json" - \
              | IMAGE_REF="${IMAGE_REF}" COMMIT="${COMMIT}" VERSION="${VERSION:-}" RUN_ID="${GITHUB_RUN_ID}" \
                MODE="$2" ALLOW_DROP="${ALLOW_DROP:-}" python3 -c '
          import json, os, re, sys
          text = sys.stdin.read()
          left = sorted(set(re.findall(r"__[A-Z0-9_]+__", text)))
          if left:
              sys.exit("placeholders left in the template: " + ", ".join(left))
          doc = json.loads(text)
          containers = doc["containerDefinitions"]
          if not containers:
              sys.exit("a task template holds no container")
          # Every container without an image gets this release image: the only container of a service template, or the
          # sidecar of a two-container template (PgBouncer, Valkey), whose main container keeps the image Terraform set.
          for container in containers:
              if not container.get("image"):
                  container["image"] = os.environ["IMAGE_REF"]
          empty = [str(c.get("name", "?")) for c in containers if not (isinstance(c["image"], str) and c["image"].strip())]
          if empty:
              sys.exit("containers with no image after rendering: " + ", ".join(empty))
          if not os.environ["COMMIT"]:
              sys.exit("no commit to tag the task definition with")
          # Tags (delivery-pipelines §5 step 3): commit=sha-<12> and release-run always; version=<semver> only on promotion.
          doc["tags"] = [{"key": "commit", "value": os.environ["COMMIT"]}, {"key": "release-run", "value": os.environ["RUN_ID"]}]
          if os.environ["VERSION"]:
              doc["tags"].append({"key": "version", "value": os.environ["VERSION"]})
          # Drop protection (§5 step 4), for services only: no name in both settings and secrets, and no setting or secret
          # name of the registered revision disappears unless the caller reviewed it in allow-drop (the contract step).
          mode = os.environ["MODE"]
          if mode not in ("one-off", "first-deploy") and not os.path.isfile(mode):
              sys.exit("render needs one-off, first-deploy or the current task definition file, got: " + mode)
          def names(c, key):
              return {e["name"] for e in (c.get(key) or [])}
          if mode != "one-off":
              both = sorted("%s/%s" % (c.get("name", "?"), n) for c in containers for n in names(c, "environment") & names(c, "secrets"))
              if both:
                  sys.exit("drop protection: names that are both a setting and a secret: " + ", ".join(both))
          if mode not in ("one-off", "first-deploy"):
              current = json.load(open(mode))
              allowed = set(os.environ["ALLOW_DROP"].replace(",", " ").split())
              # Per service, not per container: a name may move between containers (the placeholder revision holds a
              # sidecar'"'"'s variables in the one container the real template splits in two). The container is context only.
              new = set().union(*(names(c, "environment") | names(c, "secrets") for c in containers))
              gone = sorted("%s/%s" % (c.get("name", "?"), n) for c in current.get("containerDefinitions", [])
                            for n in (names(c, "environment") | names(c, "secrets")) - new - allowed)
              if gone:
                  sys.exit("drop protection: names in the registered revision that this render would drop (list them in allow-drop "
                           "only for the contract step of an expand/contract change): " + ", ".join(gone))
          print(json.dumps(doc))'
          }
          # --- render-taskdef end ---
          aws ecr get-login-password | cosign login "${IMAGE_REF%%/*}" --username AWS --password-stdin >/dev/null  # cosign reads the signature from ECR (first live release: 401)
          cosign verify --experimental-oci11 --insecure-ignore-tlog=true --key "${SIGNING_KEY}" "${IMAGE_REF}" >/dev/null
          # ops exists only when the services file names it (aws-stack §16 first preprod run: ops is out until built).
          aws s3 cp "s3://${NAME}-deploy/services.${ENVIRONMENT}.yaml" services.yaml --only-show-errors
          if ! "${RUNNER_TEMP}/tools/bin/python3" -c "import sys,yaml;sys.exit(0 if 'ops' in (yaml.safe_load(open('services.yaml')).get('services') or {}) else 1)"; then
            echo "ops is not in the services file; nothing to register."; exit 0
          fi
          # Read the file instead of head-object: this role has GetObject on run/* but no ListBucket, so head-object on a missing key says 403.
          aws s3 cp "s3://${NAME}-deploy/run/ops.json" run-ops.json --only-show-errors   # its launch settings exist
          render ops one-off > ops.json
          if [ "${DRY_RUN}" = "true" ]; then echo "Dry run: ops renders and its launch settings exist."; exit 0; fi
          arn=$(aws ecs register-task-definition --cli-input-json file://ops.json --query taskDefinition.taskDefinitionArn --output text)
          aws ssm put-parameter --name "/onepeek/${ENVIRONMENT}/release/backend/one_off/ops" --type String --overwrite --value "${arn}" >/dev/null
          echo "Registered ${arn##*/} (not run)."

  smoke:
    needs: [version, record-digest, rollout, register-one-offs]
    if: ${{ !cancelled() && !inputs.dry-run && needs.rollout.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Baseline readiness through the edge (backend /api/status, web /sign-in), always
        env:
          DOMAIN: ${{ inputs.domain }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [ "${IMAGE}" = "backend" ]; then path="/api/status"; else path="/sign-in"; fi
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 10 --retry-all-errors "https://${DOMAIN}${path}" >/dev/null
      - name: Every service's task definition carries this release's image digest (describe-services; no ecs:ListTasks)
        env:
          DIGEST: ${{ fromJSON(needs.record-digest.outputs.digests)[inputs.image] }}
          SERVICES: ${{ needs.rollout.outputs.services }}
        run: |
          for svc in $(echo "${SERVICES}" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            td=$(aws ecs describe-services --cluster "${NAME}" --services "${svc}" --query 'services[0].taskDefinition' --output text)
            # The container this release filled (the only one, or a daemon's sidecar) runs this digest.
            images=$(aws ecs describe-task-definition --task-definition "${td}" --query 'taskDefinition.containerDefinitions[].image' --output json)
            if ! IMAGES="${images}" python3 -c "import json,os,sys;sys.exit(0 if any(i.endswith('@' + os.environ['DIGEST']) for i in json.loads(os.environ['IMAGES'])) else 1)"; then
              echo "::error::${svc} runs ${images}, not digest ${DIGEST}."; exit 1
            fi
          done
      - name: The repo's own smoke checks against the domain, in addition (UC-DEL-001 row 7; @smoke journeys)
        env:
          SCRIPT: ${{ inputs.smoke-script }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          case "${SCRIPT}" in
            ""|/*|*..*) echo "::error::smoke-script must be a path inside the repository, got '${SCRIPT}'."; exit 1 ;;
          esac
          if [ ! -f "${SCRIPT}" ]; then
            echo "::warning::${SCRIPT} is not in this repository: only the baseline readiness and digest checks ran."
            echo "Warning: no ${SCRIPT} in the repository; only the baseline readiness and digest checks ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Without the deploy role's credentials or the means to request them again: black-box probes only.
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN bash "${SCRIPT}"

  watch:
    needs: [version, rollout, smoke]
    if: ${{ !cancelled() && needs.smoke.result == 'success' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: 10 minutes after stable, poll the rolled services' deploy alarms every 30 s
        env:
          SERVICES: ${{ needs.rollout.outputs.services }}
        run: |
          # aws-stack §10.4: each service has exactly two deploy alarms, onepeek-<env>-deploy-<service>-errors and
          # -latency; this release watches only those of the services it rolled (by exact name: a prefix for `api` would
          # also match `api-critical`), so a web release never fails on an api alarm. They may be switched off
          # (deploy_alarms_enabled, off until launch); then the watch cannot catch anything, which the run says out loud.
          mapfile -t names < <(printf '%s' "${SERVICES:-[]}" | NAME="${NAME}" python3 -c '
          import json, os, re, sys
          for s in json.load(sys.stdin):
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", s):
                  sys.exit(f"bad service name {s!r}")
              for kind in ("errors", "latency"):
                  print(os.environ["NAME"] + "-deploy-" + s + "-" + kind)
          ')
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::The rollout reported no services, so there is nothing to watch."
            exit 1
          fi
          poll() {  # $@: extra describe-alarms options; prints the matching alarm names on one line
            aws cloudwatch describe-alarms --alarm-names "${names[@]}" "$@" --query 'MetricAlarms[].AlarmName' --output text \
              | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//'
          }
          known=$(poll)
          if [ -z "${known}" ]; then
            echo "::warning::None of the deploy alarms ${names[*]} exists: the 10-minute watch cannot detect a regression."
            echo "Warning: none of the deploy alarms (${names[*]}) exists, so the watch could not detect a regression." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Watching: ${known}"
          fi
          end=$((SECONDS + 600))
          while [ "${SECONDS}" -lt "${end}" ]; do
            alarms=$(poll --state-value ALARM)
            if [ -n "${alarms}" ]; then echo "::error::Deploy alarms firing: ${alarms}"; exit 1; fi
            sleep 30
          done
          echo "No deploy alarm in 10 minutes."

  rollback:
    needs: [lock, version, record-digest, rollout, register-one-offs, smoke, watch]
    if: ${{ always() && !inputs.dry-run && (needs.rollout.result == 'failure' || needs.register-one-offs.result == 'failure' || needs.smoke.result == 'failure' || needs.watch.result == 'failure') }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Put every service back on the revision recorded before the rollout (versions stay aligned, E2/E3)
        env:
          PREVIOUS: ${{ needs.rollout.outputs.previous }}
          HAS_SANDBOX: ${{ contains(inputs.extra-images, 'sandbox') && 'yes' || '' }}
        run: |
          if [ -z "${PREVIOUS}" ]; then echo "Nothing was recorded; the rollout never started."; exit 0; fi
          services=$(echo "${PREVIOUS}" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))")
          for svc in ${services}; do
            td=$(echo "${PREVIOUS}" | python3 -c "import json,sys;print(json.load(sys.stdin)['${svc}'])")
            aws ecs update-service --cluster "${NAME}" --service "${svc}" --task-definition "${td}" >/dev/null
          done
          # shellcheck disable=SC2086
          aws ecs wait services-stable --cluster "${NAME}" --services ${services}
          if [ -n "${HAS_SANDBOX}" ]; then
            for fn in parse fetch; do
              prev=$(aws lambda list-versions-by-function --function-name "${NAME}-sandbox-${fn}" --query 'Versions[-2].Version' --output text)
              aws lambda update-alias --function-name "${NAME}-sandbox-${fn}" --name live --function-version "${prev}" >/dev/null
            done
          fi
      - name: Open an issue naming the failure
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "Release ${COMMIT} to ${ENVIRONMENT} rolled back" \
            --body "The release failed and every service was put back. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  notify:
    # Step 10, after every run that got past `version`, whatever the result (delivery-pipelines §12: every run writes a
    # GitHub deployment). No git tag and no GitHub release in preprod: promote.yml creates v<version> (playbook §5.2).
    needs: [lock, version, record-digest, rollout, smoke, watch, rollback]
    if: ${{ always() && !inputs.dry-run && needs.version.result == 'success' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: This run attempt holds the release lock (a re-run of only some jobs does not)
        env:
          LOCKED_ATTEMPT: ${{ needs.lock.outputs.attempt }}
        run: |
          if [ "${LOCKED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} did not take the release lock (attempt '${LOCKED_ATTEMPT}' did). Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - name: Deployment record and the team notice in the run summary (commit, services, result, durations)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.version.outputs.commit }}
          NEXT_VERSION: ${{ needs.version.outputs.version }}
          DIGESTS: ${{ needs.record-digest.outputs.digests }}
          SERVICES: ${{ needs.rollout.outputs.services }}
          WATCH: ${{ needs.watch.result }}
          ROLLBACK: ${{ needs.rollback.result }}
          STARTED: ${{ needs.version.outputs.started }}
          STABLE_AT: ${{ needs.rollout.outputs.stable-at }}
          MERGED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, time
          e = os.environ
          ok = e["WATCH"] == "success"
          now = int(time.time())
          def minutes(seconds):
              return "%dm %02ds" % divmod(max(seconds, 0), 60)
          merge_to_running = "not running (no stable rollout)"
          if e.get("STABLE_AT") and e.get("MERGED_AT"):
              merged = datetime.datetime.fromisoformat(e["MERGED_AT"].replace("Z", "+00:00")).timestamp()
              merge_to_running = minutes(int(e["STABLE_AT"]) - int(merged))
          run = "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"])
          result = "success" if ok else ("failure, rolled back" if e["ROLLBACK"] == "success" else "failure")
          notice = {
              "commit": e["COMMIT"], "next_version": e["NEXT_VERSION"], "environment": e["ENVIRONMENT"],
              "services": json.loads(e["SERVICES"] or "[]"), "digests": json.loads(e["DIGESTS"] or "{}"),
              "sboms": run + " (artifacts sbom-<image>; also attested on each digest)", "result": result,
              "duration": minutes(now - int(e["STARTED"])), "merge_to_running": merge_to_running, "run": run,
          }
          json.dump({"ref": e["GITHUB_SHA"], "environment": e["ENVIRONMENT"], "auto_merge": False, "required_contexts": [],
                     "description": e["COMMIT"], "payload": notice}, open("deployment.json", "w"))
          json.dump({"state": "success" if ok else "failure", "description": "%s %s" % (e["COMMIT"], result),
                     "log_url": run}, open("status.json", "w"))
          with open(e["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("Release %s to %s: %s.\n\n" % (e["COMMIT"], e["ENVIRONMENT"], result))
              for k in ("services", "digests", "duration", "merge_to_running", "sboms"):
                  v = notice[k]
                  s.write("- %s: %s\n" % (k, v if isinstance(v, str) else json.dumps(v)))
          if not ok:
              print("::error::Release %s to %s: %s." % (e["COMMIT"], e["ENVIRONMENT"], result))
          PY
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" --input deployment.json --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --input status.json >/dev/null

  unlock:
    # Releases the release lock whatever happened, only with the token the lock job took it with (playbook §5.4); never
    # for prod, which the lock job refuses. If this job itself is lost, the next release that waits sees this run has
    # finished and takes the lock over.
    needs: [lock, version, build-image, build-web, build, scan, sbom-sign, record-digest, db-bootstrap, migrate, assets, rollout, register-one-offs, smoke, watch, rollback, notify]
    if: ${{ always() && needs.lock.result != 'skipped' && inputs.environment != 'prod' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64-od' || inputs.runner == 'canary' && 'onepeek-arm64-od' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
      - name: Release the release lock
        env:
          LOCK_TOKEN: ${{ needs.lock.outputs.token }}
        run: |
          # --- release-lock begin (identical in release-ecs.yml, operate.yml and release-lock.yml; checked by scripts/check_service_list.py) ---
          # The cross-repo release lock (foundation-playbook §5.4): one per environment, s3://onepeek-<env>-deploy/locks/release.json,
          # taken with a conditional write (If-None-Match: *) and removed with a conditional delete on its ETag (If-Match). The
          # record names the repo, run ID, run attempt, commit, start time and a random token; only the holder of the token
          # releases it. Anything unreadable fails closed: no lock, no deploy. A lock is never removed while its run is still
          # running: only its token's holder, or a waiter that GitHub shows the holder's run has finished, removes it.
          # preprod-frozen: while s3://onepeek-<env>-deploy/locks/frozen.json exists (written from a hotfix/* branch, §5.6), it
          # names that branch (repo and ref): any run from it may take the lock, every other take fails with the reason.
          LOCK_BUCKET="${NAME}-deploy"
          LOCK_KEY="locks/release.json"
          FROZEN_KEY="locks/frozen.json"
          LOCK_ERR=$(mktemp)
          lock_url() {  # lock_url <repo> <run id>
            echo "${GITHUB_SERVER_URL}/$1/actions/runs/$2"
          }
          lock_read() {  # lock_read <key> <file> -> the ETag (the object is written to <file>), or "absent"; 1 on any other answer
            local etag msg
            if etag=$(aws s3api get-object --bucket "${LOCK_BUCKET}" --key "$1" "$2" --query ETag --output text 2>"${LOCK_ERR}"); then
              if [ -z "${etag}" ] || [ "${etag}" = "None" ]; then echo "s3://${LOCK_BUCKET}/$1 has no ETag." >&2; return 1; fi
              echo "${etag}"
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            # Only NoSuchKey means absent. AccessDenied (for example without s3:ListBucket on locks/*) and every other answer fail closed.
            case "${msg}" in *"(NoSuchKey)"*) echo absent; return 0 ;; esac
            echo "${msg}" >&2
            return 1
          }
          lock_holder() {  # lock_holder <file> -> "<repo> <run id> <run attempt> <token>"; 1 when the file is not such a record
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, run, attempt, token = record["repo"], str(record["run_id"]), str(record["run_attempt"]), str(record.get("token", "-"))
          except Exception as error:
              sys.exit("not a release lock record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and run.isdigit() and attempt.isdigit() and re.fullmatch(r"[0-9a-f]{32}|-", token)):
              sys.exit("not a release lock record: " + json.dumps(record))
          print(repo, run, attempt, token)' "$1"
          }
          lock_delete() {  # lock_delete <key> <etag> -> 0 removed, 2 changed or gone meanwhile (read it again), 1 any other answer
            local msg
            if aws s3api delete-object --bucket "${LOCK_BUCKET}" --key "$1" --if-match "$2" >/dev/null 2>"${LOCK_ERR}"; then
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*|*"(NoSuchKey)"*) return 2 ;; esac
            echo "::error::s3://${LOCK_BUCKET}/$1 could not be removed: ${msg}"
            return 1
          }
          lock_run_finished() {  # lock_run_finished <repo> <run id> -> 0 only when GitHub reports the run completed
            local status
            if ! status=$(GH_TOKEN="${LOCK_GH_TOKEN}" gh api "repos/$1/actions/runs/$2" --jq .status 2>"${LOCK_ERR}"); then
              echo "::warning::Cannot read the state of $(lock_url "$1" "$2"), so it counts as running: $(cat "${LOCK_ERR}")"
              return 1
            fi
            [ "${status}" = "completed" ]
          }
          lock_record() {  # lock_record <file> [token]: this run's record
            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", ""), "ref": e.get("GITHUB_REF", "")}
          if len(sys.argv) > 2:
              record["token"] = sys.argv[2]
              del record["who"], record["why"], record["ref"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
          }
          lock_frozen_branch() {  # lock_frozen_branch <file> -> "<repo> <ref>" of a preprod-frozen record; 1 when it is not one
            python3 -c '
          import json, re, sys
          try:
              record = json.load(open(sys.argv[1]))
              repo, ref = record["repo"], record["ref"]
          except Exception as error:
              sys.exit("not a preprod-frozen record: %r" % error)
          if not (re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and re.fullmatch(r"refs/heads/hotfix/[A-Za-z0-9_./-]+", ref)):
              sys.exit("not a preprod-frozen record: " + json.dumps(record))
          print(repo, ref)' "$1"
          }
          lock_frozen_for_others() {  # 0 when preprod-frozen names another branch (the reason is printed), 1 when not frozen for us, 2 unreadable
            local etag branch repo ref
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then return 2; fi
            if [ "${etag}" = "absent" ]; then return 1; fi
            if ! branch=$(lock_frozen_branch lock-frozen.json); then return 2; fi
            read -r repo ref <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF:-}" ]; then return 1; fi
            python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));print("preprod is frozen by %s (%s) for the hotfix branch %s %s, first frozen by %s" % (r.get("who","?"), r.get("why","?"), r["repo"], r["ref"], r.get("run","?")))' lock-frozen.json
            return 0
          }
          lock_take() {  # waits up to LOCK_WAIT_SECONDS, polling every LOCK_POLL_SECONDS, then fails naming the holder's run
            local msg etag holder repo run attempt token rc deadline reason
            if [ -z "${LOCK_TOKEN:-}" ]; then echo "::error::No lock token."; return 1; fi
            lock_record lock-mine.json "${LOCK_TOKEN}"
            deadline=$((SECONDS + LOCK_WAIT_SECONDS))
            while :; do
              rc=0
              reason=$(lock_frozen_for_others) || rc=$?
              if [ "${rc}" -eq 0 ]; then echo "::error::The ${ENVIRONMENT} release lock is refused: ${reason}."; return 1; fi
              if [ "${rc}" -eq 2 ]; then echo "::error::s3://${LOCK_BUCKET}/${FROZEN_KEY} is unreadable, so nothing is deployed."; return 1; fi
              # No encryption flags: the bucket default applies (aws-stack §16).
              if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${LOCK_KEY}" --body lock-mine.json --if-none-match '*' \
                --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
                echo "Took the ${ENVIRONMENT} release lock (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 0
              fi
              msg=$(cat "${LOCK_ERR}")
              case "${msg}" in
                *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;;   # held, or another write at the same moment: see who holds it
                *) echo "::error::The release lock could not be written, so nothing is deployed: ${msg}"; return 1 ;;
              esac
              if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
                echo "::error::The release lock is unreadable, so nothing is deployed."
                return 1
              fi
              if [ "${etag}" = "absent" ]; then   # released between the write and the read: write again
                if [ "${SECONDS}" -ge "${deadline}" ]; then echo "::error::The release lock could not be taken in ${LOCK_WAIT_SECONDS} s."; return 1; fi
                sleep 1
                continue
              fi
              if ! holder=$(lock_holder lock-held.json); then
                echo "::error::The release lock holds no readable record, so nothing is deployed (s3://${LOCK_BUCKET}/${LOCK_KEY})."
                return 1
              fi
              read -r repo run attempt token <<< "${holder}"
              if { [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" -lt "${GITHUB_RUN_ATTEMPT}" ]; } \
                || lock_run_finished "${repo}" "${run}"; then
                # An earlier attempt of this run (one attempt runs at a time), or a finished run that never released it.
                echo "The release lock is held by $(lock_url "${repo}" "${run}") (attempt ${attempt}), which is not running; taking it over."
                rc=0
                lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
                if [ "${rc}" -eq 1 ]; then return 1; fi
                continue
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::The ${ENVIRONMENT} release lock is still held after ${LOCK_WAIT_SECONDS} s by $(lock_url "${repo}" "${run}")."
                return 1
              fi
              echo "Waiting for the ${ENVIRONMENT} release lock, held by $(lock_url "${repo}" "${run}")."
              sleep "${LOCK_POLL_SECONDS}"
            done
          }
          lock_release() {  # removes the lock only when its token is LOCK_TOKEN (handed over by the lock job's outputs)
            local etag holder repo run attempt token rc
            if ! etag=$(lock_read "${LOCK_KEY}" lock-held.json); then
              echo "::error::The release lock is unreadable; it stays until a later release sees this run has finished."
              return 1
            fi
            if [ "${etag}" = "absent" ]; then echo "No release lock is held."; return 0; fi
            if ! holder=$(lock_holder lock-held.json); then
              echo "::error::The release lock holds no readable record; it is left in place."
              return 1
            fi
            read -r repo run attempt token <<< "${holder}"
            if [ -z "${LOCK_TOKEN:-}" ] || [ "${token}" != "${LOCK_TOKEN}" ]; then
              echo "The release lock is held by $(lock_url "${repo}" "${run}") under another token, not this call; it is left in place."
              return 0
            fi
            rc=0
            lock_delete "${LOCK_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Released the ${ENVIRONMENT} release lock." ;;
              2) echo "::warning::The release lock changed while it was being released; it is left in place." ;;
              *) return 1 ;;
            esac
          }
          lock_freeze() {  # preprod-frozen (§5.4, §5.6): only a hotfix/* run writes it, naming its branch (repo and ref)
            local msg etag branch repo ref
            case "${GITHUB_REF:-}" in refs/heads/hotfix/*) ;; *) echo "::error::Only a hotfix/* run freezes ${ENVIRONMENT} (playbook §5.6), not ${GITHUB_REF:-?}."; return 1 ;; esac
            lock_record lock-frozen-mine.json
            if aws s3api put-object --bucket "${LOCK_BUCKET}" --key "${FROZEN_KEY}" --body lock-frozen-mine.json --if-none-match '*' \
              --content-type application/json >/dev/null 2>"${LOCK_ERR}"; then
              echo "Froze ${ENVIRONMENT} for ${GITHUB_REPOSITORY} ${GITHUB_REF} (s3://${LOCK_BUCKET}/${FROZEN_KEY})."
              return 0
            fi
            msg=$(cat "${LOCK_ERR}")
            case "${msg}" in *"(PreconditionFailed)"*|*"(ConditionalRequestConflict)"*) ;; *) echo "::error::preprod-frozen could not be written: ${msg}"; return 1 ;; esac
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json) || [ "${etag}" = "absent" ] || ! branch=$(lock_frozen_branch lock-frozen.json); then
              echo "::error::preprod-frozen could not be read back."
              return 1
            fi
            read -r repo ref <<< "${branch}"
            if [ "${repo}" = "${GITHUB_REPOSITORY}" ] && [ "${ref}" = "${GITHUB_REF}" ]; then echo "${ENVIRONMENT} is already frozen for this branch."; return 0; fi
            echo "::error::${ENVIRONMENT} is already frozen for ${repo} ${ref}."
            return 1
          }
          lock_thaw() {  # removes preprod-frozen (the push that merges release back into dev, §5.6)
            local etag rc
            if ! etag=$(lock_read "${FROZEN_KEY}" lock-frozen.json); then echo "::error::preprod-frozen is unreadable; it is left in place."; return 1; fi
            if [ "${etag}" = "absent" ]; then echo "${ENVIRONMENT} is not frozen."; return 0; fi
            rc=0
            lock_delete "${FROZEN_KEY}" "${etag}" || rc=$?
            case "${rc}" in
              0) echo "Thawed ${ENVIRONMENT}." ;;
              2) echo "::error::preprod-frozen changed while it was being removed; it is left in place."; return 1 ;;
              *) return 1 ;;
            esac
          }
          # --- release-lock end ---
          lock_release

  api-client:
    # Backend only: publish @onepeek/api-client, generated from the committed OpenAPI file, to GitHub Packages, as the
    # prerelease <next>-dev.<sha7> under the next dist-tag (UC-DEL-001 row 11); promote.yml publishes <version> under latest.
    needs: [version, watch, notify]
    if: ${{ !cancelled() && !inputs.dry-run && inputs.image == 'backend' && needs.watch.result == 'success' }}
    runs-on: ${{ inputs.environment == 'prod' && 'ubuntu-latest' || inputs.runner == 'onepeek' && 'onepeek-arm64' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: clients/typescript/.node-version
          cache: pnpm
          cache-dependency-path: clients/typescript/pnpm-lock.yaml
      - name: Install, generate and build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          pnpm build
      - name: Publish the prerelease under next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="${VERSION}-dev.${GITHUB_SHA::7}"
          name=$(npm pkg get name | tr -d '"')
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published (a re-run of this commit); nothing to do."; exit 0
          fi
          npm pkg set version="${version}"
          pnpm publish --tag next --no-git-checks --access restricted
