            python3 -c '
          import datetime, json, os, sys
          e = os.environ
          record = {"repo": e["GITHUB_REPOSITORY"], "run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                    "commit": "sha-" + e["GITHUB_SHA"][:12], "started": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                    "run": "%s/%s/actions/runs/%s" % (e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["GITHUB_RUN_ID"]),
                    "who": e.get("GITHUB_ACTOR", ""), "why": "hotfix " + e.get("GITHUB_REF_NAME", ""), "ref": e.get("GITHUB_REF", "")}
          if len(sys.argv) > 2:
              record.update(token=sys.argv[2], scope=e["LOCK_SCOPE"], phase="locked")
              del record["who"], record["why"], record["ref"]
          json.dump(record, open(sys.argv[1], "w"))' "$@"
