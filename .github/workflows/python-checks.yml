# Shared: Python checks (ruff lint and format, pytest). Called by Python repos.
name: python-checks

on:
  workflow_call:
    inputs:
      full:
        description: "Accepted for callers; the release-only slower suites were removed, so it changes nothing."
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUFF_VERSION: 0.17.1
  PYTEST_VERSION: 9.1.1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Lint
        run: uvx "ruff@${RUFF_VERSION}" check .

      - name: Format
        run: uvx "ruff@${RUFF_VERSION}" format --check .

      - name: Unit tests
        # No tests collected (pytest exit code 5) fails: a repo with no tests has no passing check.
        run: uv run --with "pytest==${PYTEST_VERSION}" pytest -q
