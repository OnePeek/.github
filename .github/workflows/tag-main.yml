# Cut a version tag on every merge to dev (the trunk, decision 176), so consumers pinned by commit SHA see a new
# version to bump to (their Dependabot reads the tags). Reuses release-tag; the tag is protected by a ruleset
# (settings, not code).
# The file and workflow keep the name tag-main: Vanguard's merge tool names it in its no-tag message.
name: tag-main

on:
  push:
    branches: [dev]  # decision 176: one trunk, dev

concurrency:
  group: tag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    # Only the trunk cuts a tag: if the trigger ever lists a second branch, creating or pushing it would re-tag the same
    # commit as the next patch version (.github#90 B1, pitfall 70), so the default branch guard stays.
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/release-tag.yml
    with:
      first-version: v1.0.0 # after the old moving tag v1; this repo is not a pre-launch product repo
