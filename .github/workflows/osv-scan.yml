# Shared: scan the caller's lockfiles against the OSV database (foundation-playbook §12a slice 4 item 1). Called by every
# OnePeek repo that has a lockfile, on every pull request; it replaces `pnpm audit` and the backend's own dependency scan.
# Blocks on a high or critical finding, or any finding with a fix. Waivers go in the caller's osv-scanner.toml as
# [[IgnoredVulns]] with id, reason and ignoreUntil (a date); an expired or reasonless waiver fails.
# The decision script below is a verbatim copy of scripts/check_osv_results.py (a test keeps them identical), so the
# check runs exactly at the commit the caller pinned. The scanner is Google's osv-scanner image (the one
# google/osv-scanner-action v2.7.0 runs, published 2026-10-12, over 7 days old: code-guidelines section 10), run
# directly and pinned by digest: the action runs that image by tag and hides the scanner's exit code, which the decision
# needs (0 nothing found, 1 findings, anything else a failed scan, which fails). The weekly ci-image-bump.yml moves the
# digest of the `image:` line below like any CI image; a new scanner version is a change of the tag in its comment.
name: osv-scan

on:
  workflow_call:
    inputs:
      runner:
        description: "onepeek, canary or github. Callers pass their repository's RUNNER setting, or github. The job's class and this value choose runs-on (ci-runners.md section 5.3)."
        type: string
        default: github

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ${{ inputs.runner == 'onepeek' && 'onepeek-arm64-small' || inputs.runner == 'canary' && 'onepeek-arm64-canary' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the lockfiles
        id: scan
        # osv-scanner exits 1 when it finds anything; its exit code goes to the next step, which decides.
        env:
          image: ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 # v2.7.0
        run: |
          set +e
          docker run --rm -v "${PWD}:/src" -w /src --entrypoint osv-scanner "${image}" \
            --format=json --output=osv-results.json --recursive ./
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Block on a failed scan, on high or critical, or on any finding with a fix; check the waivers
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit }}
        run: |
          cat > "$RUNNER_TEMP/check.py" <<'PY'
          """Decide an OSV scan (foundation-playbook §12a slice 4 item 1): read osv-scanner's JSON results and the caller's waivers.

          Blocks on: a finding of high or critical severity (CVSS 7.0 or more, or the database's HIGH/CRITICAL), or any finding
          with an available fix (an affected range that names a `fixed` version). Waivers live in the caller's `osv-scanner.toml`
          (osv-scanner itself skips a waived id) as `[[IgnoredVulns]]` with `id`, `ignoreUntil` (a date) and `reason`; a waiver
          with no reason, no valid date, or a date in the past fails, so a waiver always ends. A missing results file fails: a
          scan that wrote none did not run. So does a scanner exit other than 0 (nothing found) or 1 (findings), passed as
          `--scan-exit` (127, a general error; 128, no lockfile found): its results cannot be trusted.

          A finding's fix is looked up in the affected entries for its own package only (names compared case-blind, and for PyPI
          with runs of `-`, `_` and `.` as one `-`, PEP 503); another package's fix never counts.

          Usage: check_osv_results.py --scan-exit N [--results osv-results.json] [--today YYYY-MM-DD] [ROOT]
          Exit status 1 when anything blocks.
          """
          from __future__ import annotations

          import argparse
          import datetime
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          SKIP_DIRS = {"node_modules", ".git"}
          HIGH = 7.0
          CRITICAL = 9.0


          def waiver_errors(root: Path, today: datetime.date) -> list[str]:
              errors: list[str] = []
              for path in sorted(root.rglob("osv-scanner.toml")):
                  if SKIP_DIRS.intersection(path.parts):
                      continue
                  try:
                      doc = tomllib.loads(path.read_text(encoding="utf-8"))
                  except (OSError, tomllib.TOMLDecodeError) as e:
                      errors.append(f"{path}: cannot read the waivers ({type(e).__name__}).")
                      continue
                  for entry in doc.get("IgnoredVulns") or []:
                      who = f"{path}: waiver {entry.get('id', '?')}"
                      if not str(entry.get("id") or "").strip():
                          errors.append(f"{who}: needs an id.")
                      if not str(entry.get("reason") or "").strip():
                          errors.append(f"{who}: needs a reason.")
                      until = entry.get("ignoreUntil")
                      if isinstance(until, datetime.datetime):
                          until = until.date()
                      if not isinstance(until, datetime.date):
                          errors.append(f"{who}: needs an ignoreUntil date (YYYY-MM-DD).")
                      elif until < today:
                          errors.append(f"{who}: expired on {until}; fix the finding or renew the waiver with a new reason and date.")
              return errors


          def _score(value: object) -> float | None:
              try:
                  return float(value)  # type: ignore[arg-type]
              except (TypeError, ValueError):
                  return None


          def severity(vuln: dict, group_scores: dict[str, float]) -> str:
              """critical, high or other, from the group's max CVSS score (osv-scanner) or the database's severity word."""
              ids = [vuln.get("id"), *(vuln.get("aliases") or [])]
              score = max([group_scores[i] for i in ids if i in group_scores], default=None)
              word = str((vuln.get("database_specific") or {}).get("severity") or "").upper()
              if word == "CRITICAL" or (score is not None and score >= CRITICAL):
                  return "critical"
              if word == "HIGH" or (score is not None and score >= HIGH):
                  return "high"
              return "other"


          def package_name(package: dict) -> str:
              name = str(package.get("name") or "").lower()
              return re.sub(r"[-_.]+", "-", name) if str(package.get("ecosystem") or "").lower() == "pypi" else name


          def has_fix(vuln: dict, package: dict) -> bool:
              name = package_name(package)
              mine = [a for a in vuln.get("affected") or [] if package_name(
                  {"ecosystem": package.get("ecosystem"), **(a.get("package") or {})}) == name]
              return any("fixed" in event for a in mine for r in a.get("ranges") or [] for event in r.get("events") or [])


          def findings(results: dict) -> list[str]:
              blocked: list[str] = []
              for result in results.get("results") or []:
                  source = (result.get("source") or {}).get("path", "?")
                  for pkg in result.get("packages") or []:
                      package = pkg.get("package") or {}
                      scores: dict[str, float] = {}
                      for group in pkg.get("groups") or []:
                          score = _score(group.get("max_severity"))
                          if score is not None:
                              for i in [*(group.get("ids") or []), *(group.get("aliases") or [])]:
                                  scores[i] = max(score, scores.get(i, 0.0))
                      for vuln in pkg.get("vulnerabilities") or []:
                          level, fix = severity(vuln, scores), has_fix(vuln, package)
                          if level != "other" or fix:
                              why = ", ".join(filter(None, [level if level != "other" else "", "a fix is available" if fix else ""]))
                              blocked.append(f"{source}: {package.get('name')}@{package.get('version')} {vuln.get('id')} ({why})")
              return blocked


          def main(argv: list[str] | None = None) -> int:
              ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              ap.add_argument("--scan-exit", type=int, required=True, help="osv-scanner's exit code")
              ap.add_argument("--results", type=Path, default=Path("osv-results.json"))
              ap.add_argument("--today", type=datetime.date.fromisoformat, default=datetime.date.today())
              ap.add_argument("root", nargs="?", type=Path, default=Path("."))
              a = ap.parse_args(argv)
              errors = waiver_errors(a.root, a.today)
              if a.scan_exit not in (0, 1):
                  errors.append(f"osv-scanner exited {a.scan_exit} (0 is nothing found, 1 is findings): the scan failed, so its "
                                "results cannot be trusted (128: no lockfile found; see the scan step).")
              if not a.results.is_file():
                  errors.append(f"{a.results}: osv-scanner wrote no results, so the scan did not run (is there a lockfile? see the scan step).")
                  blocked: list[str] = []
              else:
                  blocked = findings(json.loads(a.results.read_text(encoding="utf-8")))
              for line in errors:
                  print(f"::error::{line}")
              for line in blocked:
                  print(f"::error::{line}: fix it, or waive it in osv-scanner.toml with a reason and an expiry date.")
              if not errors and not blocked:
                  print("osv: no blocking findings")
              return 1 if errors or blocked else 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 "$RUNNER_TEMP/check.py" --scan-exit "${SCAN_EXIT}" --results osv-results.json .

      - name: Job usage (CPU, memory, disk and instance type, as a notice; S0 runner sizes)
        # Measurement only: scripts/job_usage.py verbatim (scripts/test_job_usage.py), never fails or slows the job.
        if: ${{ always() && runner.environment != 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          RUNNER_CLASS: light
          RUNNER_INPUT: ${{ inputs.runner }}
        shell: python3 -I {0}
        run: |
          """Job usage: one JSON line with what a job on our own runners used (S0 of the infra stabilization plan, runner sizes).

          Run as the last step of every shared-workflow job that can run on our runners (`if: always()`, continue-on-error).
          It reads the job's cgroup totals (no start step needed): CPU seconds (cgroup v2 cpu.stat usage_usec, else cgroup v1
          cpuacct.usage, else /proc/stat since boot), peak memory (memory.peak, else memory.max_usage_in_bytes), the job's wall
          time (from the start of the runner's per-job Runner.Worker process), average vCPU (CPU seconds over wall seconds),
          disk used on / and on the workspace's filesystem at job end, and the instance type (IMDSv2, link-local, 1 s budget).
          A value it cannot read is "unavailable" ("unknown" for the instance type). It prints `::notice::job-usage {json}` (read
          back from the job's annotations by the API, no artifact) and appends the JSON line to the step summary. It never fails
          the job: every read is guarded and it always exits 0. On GitHub-hosted runners it does nothing.
          Workflows run a verbatim copy of this file (scripts/test_job_usage.py keeps the copies identical).
          """
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.request

          NA = "unavailable"
          LIMIT = 65536  # bytes read from any one file
          IMDS = "http://169.254.169.254"
          IMDS_BUDGET = 1.0  # seconds for the whole instance-type lookup
          WORKER = "Runner.Worker"  # the runner's per-job process; its start is the job's start


          def _read(path):
              try:
                  with open(path, "rb") as f:
                      return f.read(LIMIT).decode("ascii")
              except (OSError, UnicodeDecodeError, ValueError):
                  return None


          def _int(text):
              try:
                  value = int(text.strip())
              except (AttributeError, ValueError):
                  return None
              return value if value >= 0 else None


          def cgroups(proc):
              """{"v2": path} or {controller: path} for cgroup v1, from <proc>/self/cgroup; {} when unreadable."""
              found = {}
              for line in (_read(os.path.join(proc, "self", "cgroup")) or "").splitlines():
                  parts = line.split(":", 2)
                  if len(parts) != 3 or not parts[2].startswith("/"):
                      continue
                  if parts[0] == "0" and parts[1] == "":
                      found["v2"] = parts[2]
                  for controller in parts[1].split(","):
                      if controller:
                          found[controller] = parts[2]
              return found


          def _under(sysfs, *parts):
              return os.path.join(sysfs, *[p.lstrip("/") for p in parts])


          def cpu_seconds(proc, sysfs, groups):
              """(seconds, source), or (NA, NA)."""
              if "v2" in groups:
                  for line in (_read(_under(sysfs, groups["v2"], "cpu.stat")) or "").splitlines():
                      key, _, value = line.partition(" ")
                      if key == "usage_usec" and _int(value) is not None:
                          return round(_int(value) / 1e6, 3), "cgroup"
              if "cpuacct" in groups:
                  value = _int(_read(_under(sysfs, "cpuacct", groups["cpuacct"], "cpuacct.usage")))
                  if value is not None:
                      return round(value / 1e9, 3), "cgroup_v1"
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  fields = line.split()
                  if fields[:1] == ["cpu"] and len(fields) >= 9:
                      ticks = [_int(fields[i]) for i in (1, 2, 3, 6, 7, 8)]  # user nice system irq softirq steal
                      if None not in ticks:
                          return round(sum(ticks) / os.sysconf("SC_CLK_TCK"), 3), "proc_stat_since_boot"
              return NA, NA


          def memory_peak(sysfs, groups):
              """(bytes, source), or (NA, NA)."""
              if "v2" in groups:
                  value = _int(_read(_under(sysfs, groups["v2"], "memory.peak")))
                  if value is not None:
                      return value, "cgroup"
              if "memory" in groups:
                  value = _int(_read(_under(sysfs, "memory", groups["memory"], "memory.max_usage_in_bytes")))
                  if value is not None:
                      return value, "cgroup_v1"
              return NA, NA


          def _stat(proc, pid):
              """(comm, ppid, starttime in clock ticks after boot) of a process, or None."""
              text = _read(os.path.join(proc, str(pid), "stat"))
              if not text or "(" not in text or ")" not in text:
                  return None
              comm = text[text.index("(") + 1:text.rindex(")")]
              fields = text[text.rindex(")") + 1:].split()
              if len(fields) < 20 or _int(fields[1]) is None or _int(fields[19]) is None:
                  return None
              return comm, _int(fields[1]), _int(fields[19])


          def wall_seconds(proc, now, pid):
              """Seconds since the nearest Runner.Worker ancestor started, or NA."""
              btime = None
              for line in (_read(os.path.join(proc, "stat")) or "").splitlines():
                  if line.startswith("btime "):
                      btime = _int(line[6:])
              if btime is None:
                  return NA
              for _ in range(64):
                  info = _stat(proc, pid)
                  if info is None:
                      return NA
                  comm, ppid, start = info
                  if comm == WORKER:
                      wall = now - (btime + start / os.sysconf("SC_CLK_TCK"))
                      return round(wall, 1) if wall > 0 else NA
                  if ppid in (None, 0) or ppid == pid:
                      return NA
                  pid = ppid
              return NA


          def disk_used(path):
              try:
                  st = os.statvfs(path)
              except (OSError, TypeError, ValueError):
                  return NA
              return (st.f_blocks - st.f_bfree) * st.f_frsize


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def _imds(base, out):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), _NoRedirect)
              put = urllib.request.Request(base + "/latest/api/token", method="PUT",
                                           headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
              with opener.open(put, timeout=IMDS_BUDGET) as r:
                  token = r.read(256).decode("ascii").strip()
              get = urllib.request.Request(base + "/latest/meta-data/instance-type", headers={"X-aws-ec2-metadata-token": token})
              with opener.open(get, timeout=IMDS_BUDGET) as r:
                  value = r.read(64).decode("ascii").strip()
              if re.fullmatch(r"[a-z0-9-]+\.[a-z0-9]+", value):
                  out.append(value)


          def instance_type(base=IMDS, budget=IMDS_BUDGET):
              """The EC2 instance type, or "unknown" when IMDS is absent, slow, denied or odd (never more than `budget` s)."""
              out = []

              def run():
                  try:
                      _imds(base, out)
                  except Exception:
                      pass

              worker = threading.Thread(target=run, daemon=True)
              worker.start()
              worker.join(budget)
              return out[0] if out and not worker.is_alive() else "unknown"


          def collect(env, proc="/proc", sysfs="/sys/fs/cgroup", imds=IMDS, now=None, pid=None):
              now = time.time() if now is None else now
              groups = cgroups(proc)
              cpu, cpu_source = cpu_seconds(proc, sysfs, groups)
              mem, mem_source = memory_peak(sysfs, groups)
              wall = wall_seconds(proc, now, os.getpid() if pid is None else pid)
              avg = round(cpu / wall, 3) if isinstance(cpu, float) and isinstance(wall, float) and wall > 0 else NA
              return {
                  "repo": env.get("GITHUB_REPOSITORY", NA),
                  "job": env.get("GITHUB_JOB", NA),
                  "runner_class": env.get("RUNNER_CLASS", NA),
                  "runner_input": env.get("RUNNER_INPUT", NA),
                  "runner_name": env.get("RUNNER_NAME", NA),
                  "instance_type": instance_type(imds),
                  "wall_s": wall,
                  "cpu_s": cpu,
                  "cpu_source": cpu_source,
                  "avg_vcpu": avg,
                  "mem_peak_bytes": mem,
                  "mem_source": mem_source,
                  "disk_used_root_bytes": disk_used("/"),
                  "disk_used_workspace_bytes": disk_used(env.get("GITHUB_WORKSPACE")) if env.get("GITHUB_WORKSPACE") else NA,
                  "cgroup": groups.get("v2", groups.get("memory", NA)),
              }


          def main(env=None, **kwargs):
              env = os.environ if env is None else env
              if env.get("RUNNER_ENVIRONMENT") == "github-hosted":
                  return 0
              line = json.dumps(collect(env, **kwargs), sort_keys=True, separators=(",", ":"))
              print("::notice::job-usage " + line.replace("%", "%25"), flush=True)
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as f:
                          f.write(line + "\n")
                  except (OSError, ValueError):
                      print("job-usage: the step summary is not writable", file=sys.stderr)
              return 0


          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  pass
              sys.exit(0)
