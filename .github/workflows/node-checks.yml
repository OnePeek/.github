# Shared: Node checks with pnpm (lint, types, tests, format, and build on release). Called by Node repos.
name: node-checks

on:
  workflow_call:
    inputs:
      full:
        description: "true on pull requests into release: also run the production build."
        type: boolean
        default: false

permissions:
  contents: read
  packages: read # installs @onepeek/* from GitHub Packages (onepeek-web.md §16); callers must grant it too

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lockfile present
        run: |
          if [ ! -f pnpm-lock.yaml ]; then echo "::error::pnpm-lock.yaml is missing: commit the lockfile (nothing is checked without it)."; exit 1; fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read by the committed .npmrc for npm.pkg.github.com
        run: pnpm install --frozen-lockfile

      - name: Lint, types, tests, format
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run format:check

      - name: Production build (release only)
        if: inputs.full
        run: pnpm run build
