# Shared: Node checks with pnpm (lint, types, tests, format, and build on release). Called by Node repos.
name: node-checks

on:
  workflow_call:
    inputs:
      full:
        description: "true on pull requests into release: also run the production build."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there anything to check?
        id: lock
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No pnpm-lock.yaml yet: nothing to check."; fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.lock.outputs.present == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.lock.outputs.present == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: steps.lock.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint, types, tests, format
        if: steps.lock.outputs.present == 'true'
        run: |
          pnpm run --if-present lint
          pnpm run --if-present typecheck
          pnpm run --if-present test
          pnpm run --if-present format:check

      - name: Production build (release only)
        if: steps.lock.outputs.present == 'true' && inputs.full
        run: pnpm run --if-present build
