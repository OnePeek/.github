# Settings of ship_watch.py, the watcher and merge queue (onepeek-docs standards/agent-operations.md §6.6).
# The repos it watches: every OnePeek repo (gh repo list OnePeek, 2026-11-06).
repos: [onepeek-docs, .github, onepeek-infra, onepeek-design-system, backend-service, onepeek-web,
        browser-extension, plugin-owl, mcp-athena, marketing-website]
# Authors whose pull requests it may merge: the founder and the bots that open pin pull requests, as `gh pr list`
# names them (ship_change_set.py's pin moves are opened as the founder). Any other author is HOLD.
authors: [Karan-98-Mehta, app/dependabot]
# Checks re-run once when red, by their exact name as a passing run prints it (pitfalls.md 23). Empty until one is known.
known_flakes: []
# The depends-on check's name as passing runs print it (every repo, 2026-11-06).
depends_on_check: depends-on / depends-on
# Decision 173: checks that warn but never block a merge (ship_change_set.py does not wait on them; the watcher ignores
# them for READY and alerts when one is red), as the workflow and a check-name prefix. These are the jobs of
# onepeek-infra's sandbox workflow, named as passing runs print them (`gh pr checks 180 -R OnePeek/onepeek-infra --json
# workflow,name`, 2026-11-06). A job added there later blocks until it is listed. Delete the list when warn_until is met.
warn_until: T-30
warn_checks:
  - {workflow: sandbox, prefix: gate}
  - {workflow: sandbox, prefix: budget}
  - {workflow: sandbox, prefix: lock}
  - {workflow: sandbox, prefix: apply-phase-1}
  - {workflow: sandbox, prefix: images}
  - {workflow: sandbox, prefix: apply-phase-2}
  - {workflow: sandbox, prefix: smoke}
  - {workflow: sandbox, prefix: destroy}
  - {workflow: sandbox, prefix: sweep}
  - {workflow: sandbox, prefix: unlock}
  - {workflow: sandbox, prefix: apply-test}
