# Settings of ship_watch.py, the watcher and merge queue (onepeek-docs standards/agent-operations.md §6.6).
# The repos it watches: every OnePeek repo (gh repo list OnePeek, 2026-11-06).
repos: [onepeek-docs, .github, onepeek-infra, onepeek-design-system, backend-service, onepeek-web,
        browser-extension, plugin-owl, mcp-athena, marketing-website]
# Authors whose pull requests it may merge: the founder and the bots that open pin pull requests, as `gh pr list`
# names them (ship_change_set.py's pin moves are opened as the founder). Any other author is HOLD.
authors: [Karan-98-Mehta, app/dependabot]
# Checks re-run once when red, by their exact name as a passing run prints it (pitfalls.md 23). Empty until one is known.
known_flakes: []
# The depends-on check's name as passing runs print it (every repo, 2026-11-06).
depends_on_check: depends-on / depends-on
# Decision 173 (§6.6 build rulings): checks that warn but never block a merge while listed here: ship_change_set.py
# does not wait on them, and the watcher ignores them for READY and alerts when one is red. Each is {repo, workflow,
# name}, the name matched exactly: the jobs of onepeek-infra's sandbox workflow as passing runs print them
# (`gh pr checks 180 -R OnePeek/onepeek-infra --json workflow,name`, 2026-11-06). A job added there blocks until it is
# listed. No warn_until, or an empty list, means no warn checks. T-30 has no signal a tool can read: the T-30 pull
# request deletes this list.
warn_until: T-30
warn_checks:
  - {repo: onepeek-infra, workflow: sandbox, name: gate}
  - {repo: onepeek-infra, workflow: sandbox, name: budget}
  - {repo: onepeek-infra, workflow: sandbox, name: lock}
  - {repo: onepeek-infra, workflow: sandbox, name: apply-phase-1}
  - {repo: onepeek-infra, workflow: sandbox, name: images}
  - {repo: onepeek-infra, workflow: sandbox, name: apply-phase-2}
  - {repo: onepeek-infra, workflow: sandbox, name: smoke}
  - {repo: onepeek-infra, workflow: sandbox, name: destroy}
  - {repo: onepeek-infra, workflow: sandbox, name: sweep}
  - {repo: onepeek-infra, workflow: sandbox, name: unlock}
  - {repo: onepeek-infra, workflow: sandbox, name: apply-test}
# Ruling F43 (founder 2026-11-07): a pull request changing any of these paths is reviewed before its merge in every
# lane, hotfix included: ship_change_set.py reads its changed files live (renames under both names) and then needs the
# coordinator's reviews.json record at its head. Globs over the repo path: `**/` any folders (none too), a trailing
# `/**` anything below, `*` within one segment. Missing or malformed means every hotfix needs a review (fail closed).
review_required_paths:
  - workspace/ship_change_set.py
  - workspace/ship_watch.py
  - workspace/packet.py
  - workspace/done_check.py
  - .github/workflows/**
  - bootstrap/**
  - "**/iam*.tf"
  - "**/*policy*.tf"
